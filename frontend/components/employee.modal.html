<!-- =====================================================
     EMPLOYEE CRUD MODAL (REUSABLE COMPONENT)
===================================================== -->

<!-- LIST MODAL -->
<div class="modal fade" id="employeeListModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content glass">

      <div class="modal-header">
        <h5 class="modal-title">Employee Records</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="d-flex justify-content-between mb-3">
          <input id="employeeSearch" class="form-control w-50" placeholder="Search employee...">

          <button class="btn btn-primary"
                  onclick="openEmployeeCreate()">
            + Add Employee
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>

            <tbody id="employeeTableBody"></tbody>

          </table>
        </div>

      </div>

    </div>
  </div>
</div>


<!-- CREATE / EDIT MODAL -->
<div class="modal fade" id="employeeFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass">

      <div class="modal-header">
        <h5 class="modal-title" id="employeeFormTitle">Employee</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form id="employeeForm">

          <input type="hidden" id="employeeId">

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input id="employeeName" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="employeeEmail" type="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Role</label>
            <select id="employeeRole" class="form-select">
              <option value="EMPLOYEE">Employee</option>
              <option value="ADMIN">Admin</option>  
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select id="employeeStatus" class="form-select">
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-glass" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              Save
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>


<!-- DELETE MODAL -->
<div class="modal fade" id="employeeDeleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass">

      <div class="modal-header">
        <h5 class="modal-title">Deactivate Employee</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <p class="text-secondary-custom">
          This action cannot be undone.
        </p>

        <input type="hidden" id="deleteEmployeeId">

        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-glass" data-bs-dismiss="modal">
            Cancel
          </button>
          <!-- SOFT DELETE -->
          <button class="btn btn-warning"
                  onclick="UsersUI.confirmDeleteEmployee('INACTIVE')">
            Deactivate
          </button>

          <!-- HARD DELETE -->
          <button class="btn btn-danger"
                  onclick="UsersUI.confirmDeleteEmployee('DELETE')">
            Delete
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
