<div class="modal fade" id="globalFormModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content glass">

      <div class="modal-header">
        <h5 class="modal-title" id="globalFormTitle">Form</h5>

        <button class="btn-close btn-close-white"
                data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form id="globalForm">

          <input type="hidden" id="globalFormId">

          <!-- Dynamic Fields -->
          <div id="globalFormFields" class="row g-3"></div>

          <!-- Actions -->
          <div class="d-flex justify-content-end gap-2 mt-4">

            <button type="button"
                    class="btn btn-glass"
                    data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="submit"
                    class="btn btn-primary">
              Save
            </button>

          </div>

        </form>

      </div>

    </div>
  </div>
</div>
