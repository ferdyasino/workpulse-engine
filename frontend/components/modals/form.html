<!-- CREATE / EDIT MODAL -->
<div class="modal fade" id="employeeFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass">

      <div class="modal-header">
        <h5 class="modal-title" id="employeeFormTitle">Employee</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form id="employeeForm">

          <input type="hidden" id="employeeId">

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input id="employeeName" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="employeeEmail" type="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Role</label>
            <select id="employeeRole" class="form-select">
              <option value="EMPLOYEE">Employee</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Department</label>
            <select id="employeeDepartment" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label">Position</label>
            <select id="employeePosition" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label">Shift</label>
            <select id="employeeShift" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <select id="employeeStatus" class="form-select">
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-glass" data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="submit" class="btn btn-primary">
              Save
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
