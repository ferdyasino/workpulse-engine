<!-- EMPLOYEE LIST MODAL -->
<div class="modal fade" id="employeeListModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content glass">

      <div class="modal-header">
        <h5 class="modal-title">Employee Records</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="d-flex justify-content-between mb-3">
          <input id="employeeSearch" class="form-control w-50" placeholder="Search employee...">

          <!-- IMPORTANT: keep same function OR map it in JS -->
          <button class="btn btn-primary"
                  onclick="UsersUI.openCreateModal()">
            + Add Employee
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>

            <tbody id="usersTableBodyModal"></tbody>

          </table>
        </div>

      </div>

    </div>
  </div>
</div>
