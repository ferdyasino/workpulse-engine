<!-- =====================================================
     UNIVERSAL LIST MODAL
===================================================== -->

<div class="modal fade" id="crudListModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content glass">

      <div class="modal-header">
        <h5 class="modal-title" id="crudListTitle">Records</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="d-flex justify-content-between mb-3">

          <input
            id="crudSearch"
            class="form-control w-50"
            placeholder="Search..."
            oninput="CrudList.search(this.value)"
          >

          <!-- FIXED: generic, not employee-specific -->
          <button class="btn btn-primary" onclick="CrudList.openForm()">
            + Add
          </button>

        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">

            <thead id="crudTableHead"></thead>
            <tbody id="crudTableBody"></tbody>

          </table>
        </div>

      </div>

    </div>
  </div>
</div>
