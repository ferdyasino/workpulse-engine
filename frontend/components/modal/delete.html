<!-- =====================================================
     UNIVERSAL DELETE MODAL
===================================================== -->

<div class="modal fade" id="crudDeleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass">

      <div class="modal-header">
        <h5 class="modal-title" id="crudDeleteTitle">Delete Record</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <p class="text-secondary-custom mb-3">
          This action cannot be undone.
        </p>

        <input type="hidden" id="crudDeleteId">
        <input type="hidden" id="crudDeleteEntity">

        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-glass" data-bs-dismiss="modal">
            Cancel
          </button>

          <button class="btn btn-glass-danger" onclick="CrudDelete.confirm()">
            Delete
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
