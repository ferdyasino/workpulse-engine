<script>
  /**
   * =====================================================
   * REPORT EXPORT INITIALIZER
   * =====================================================
   */

  let __reportExportInitialized = false;

  function initReportExport() {
    if (__reportExportInitialized) return;

    __reportExportInitialized = true;

    document.getElementById("btnExportExcel")?.addEventListener("click", exportReportExcel);

    document.getElementById("btnExportPDF")?.addEventListener("click", exportReportPDF);
  }

  /**
   * =====================================================
   * GET REPORT EXPORT DATA
   * =====================================================
   */

  function getReportExportData() {
    const currentUser = APP.user || {};
    const report = Reports.state.report || {};

    return {
      title: "Attendance Report",

      generatedAt: new Date(),

      generatedBy: currentUser.fullname || currentUser.email || "",

      employee:
        document.getElementById("reportEmployee")?.selectedOptions?.[0]?.text || "All Employees",

      shift: document.getElementById("reportShift")?.selectedOptions?.[0]?.text || "Assigned Shift",

      timezone: Reports.state.timezone,

      startDate: Reports.state.start_date,

      endDate: Reports.state.end_date,

      totalRows: (report.rows || []).length,

      summary: report.summary || {},

      rows: report.rows || [],
    };
  }

  /**
   * =====================================================
   * GET REPORT FILENAME
   * =====================================================
   */

  function getReportFilename(extension) {
    const report = getReportExportData();

    const employee = String(report.employee || "Report")
      .replace(/[^\w\s-]/g, "")
      .trim()
      .replace(/\s+/g, "_");

    return (
      ["Attendance_Report", employee, report.startDate, "to", report.endDate].join("_") +
      "." +
      extension
    );
  }

  /**
   * =====================================================
   * EXPORT REPORT (EXCEL)
   * =====================================================
   */

  function exportReportExcel() {
    const report = getReportExportData();

    if (!report.rows.length) {
      showToast?.("There are no report records to export.", "warning");
      return;
    }

    try {
      downloadExcel(report);
    } catch (error) {
      console.error(error);
      showToast?.("Unable to generate the Excel report.", "error");
    }
  }

  /**
   * =====================================================
   * DOWNLOAD EXCEL
   * =====================================================
   */

  function downloadExcel(report) {
    if (typeof XLSX === "undefined") {
      throw new Error("SheetJS (XLSX) library is not loaded.");
    }

    const workbook = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      workbook,
      XLSX.utils.aoa_to_sheet(buildReportSummary(report)),
      "Summary",
    );

    XLSX.utils.book_append_sheet(
      workbook,
      XLSX.utils.aoa_to_sheet(buildReportRows(report)),
      "Attendance",
    );

    XLSX.writeFile(workbook, getReportFilename("xlsx"));
  }

  /**
   * =====================================================
   * BUILD REPORT SUMMARY
   * =====================================================
   */

  function buildReportSummary(report) {
    const s = report.summary || {};

    return [
      ["Attendance Report"],
      [],

      ["Employee", report.employee],
      ["Shift", report.shift],
      ["Timezone", report.timezone],
      ["Date Range", `${report.startDate} to ${report.endDate}`],
      ["Generated By", report.generatedBy],
      ["Generated At", report.generatedAt.toLocaleString()],
      ["Total Records", report.totalRows],

      [],

      ["Attendance Summary"],
      ["Present", Number(s.present || 0)],
      ["Absent", Number(s.absent || 0)],
      ["Workdays", Number(s.workdays || 0)],
      ["Late Count", Number(s.late || 0)],

      [],

      ["Hour Summary"],
      ["Worked Hours", formatMinutesDuration(Number(s.worked_minutes || 0))],
      ["Regular Hours", formatMinutesDuration(Number(s.regular_minutes || 0))],
      [
        "Paid Hours",
        formatMinutesDuration(Number(s.regular_minutes || 0) + Number(s.overtime_minutes || 0)),
      ],
      ["Overtime", formatMinutesDuration(Number(s.overtime_minutes || 0))],
      ["Undertime", formatMinutesDuration(Number(s.undertime_minutes || 0))],

      [],

      ["Break Summary"],
      ["Lunch", formatMinutesDuration(Number(s.lunch_minutes || 0))],
      ["Break", formatMinutesDuration(Number(s.break_minutes || 0))],

      [],

      ["Late Summary"],
      ["Late Time", formatMinutesDuration(Number(s.late_minutes || 0))],
    ];
  }

  /**
   * =====================================================
   * BUILD REPORT ROWS
   * =====================================================
   */

  function buildReportRows(report) {
    const sheet = [
      [
        "Date",
        "Employee",
        "Shift",
        "Time In",
        "Time Out",
        "Worked",
        "Regular",
        "Overtime",
        "Late",
        "Undertime",
        "Status",
      ],
    ];

    (report.rows || []).forEach((row) => {
      sheet.push([
        row.date || "",

        row.fullname || row.email || "",

        row.shift_name || "",

        Reports.formatDateTime(row.time_in),

        Reports.formatDateTime(row.time_out),

        formatMinutesDuration(Number(row.worked_minutes || 0)),

        formatMinutesDuration(Number(row.regular_minutes || 0)),

        formatMinutesDuration(Number(row.overtime_minutes || 0)),

        formatMinutesDuration(Number(row.late_minutes || 0)),

        formatMinutesDuration(Number(row.undertime_minutes || 0)),

        typeof DISPLAY?.status === "function" ? DISPLAY.status(row.status) : row.status || "",
      ]);
    });

    return sheet;
  }
</script>
