<script>
  function getShiftsSafe() {
    return Array.isArray(state?.shifts) ? state.shifts : [];
  }

  function getTimezoneOptions() {
    const settings = APP?.settings || state?.settings || [];

    if (!Array.isArray(settings)) {
      return ["Asia/Manila"];
    }

    const timezoneSetting = settings.find((setting) => setting.key === "TIMEZONE");

    if (
      timezoneSetting &&
      Array.isArray(timezoneSetting.options) &&
      timezoneSetting.options.length
    ) {
      return timezoneSetting.options;
    }

    if (timezoneSetting?.value) {
      return [timezoneSetting.value];
    }

    return ["Asia/Manila"];
  }

  function getDefaultTimezone() {
    const settings = APP?.settings || state?.settings || [];

    if (!Array.isArray(settings)) {
      return "Asia/Manila";
    }

    const timezoneSetting = settings.find((setting) => setting.key === "TIMEZONE");

    return timezoneSetting?.value || "Asia/Manila";
  }

  function openCreateShiftFromUserModal() {
    UsersModal.closeFormModal?.();

    ShiftModal.openCreateModal(
      {},
      {
        listTimezone: getTimezoneOptions(),

        onSubmit(formData) {
          UsersAPI.createShift(
            formData,

            async (result) => {
              if (!result?.success) {
                showToast(result?.message || "Failed to create shift", "error");
                return;
              }

              showToast("Shift created", "success");

              await reloadAllReferences();

              ShiftModal.closeFormModal?.();

              const createdShiftId =
                result?.data?.shift_id ||
                findShiftIdByName(result?.data?.shift_name || formData.shift_name);

              openCreateUser({
                shift_id: createdShiftId || "",
              });
            },

            (err) => {
              console.error("createShift error:", err);
              showToast(err?.message || "Failed to create shift", "error");
            },
          );
        },
      },
    );
  }

  function findShiftIdByName(name) {
    const normalized = String(name || "")
      .trim()
      .toLowerCase();

    const found = [...getShiftsSafe()].reverse().find(
      (s) =>
        String(s.shift_name || "")
          .trim()
          .toLowerCase() === normalized,
    );

    return found?.shift_id || "";
  }

  function mapShiftForView(s = {}) {
    const rawStatus = String(s.status || "ACTIVE")
      .trim()
      .toUpperCase();

    return {
      shift_id: s.shift_id || "",

      shift_name: DISPLAY?.label?.(s.shift_name || "UNKNOWN") || "UNKNOWN",

      timezone: s.timezone || "",

      timezone_label: DISPLAY?.label?.(s.timezone || "") || s.timezone || "",

      start_time: formatShift(s.start_time || ""),

      end_time: formatShift(s.end_time || ""),

      grace_minutes: Number(s.grace_minutes || 0),

      status_raw: rawStatus,

      status: DISPLAY?.status?.(rawStatus) || rawStatus,
    };
  }

  function getShiftStatusClass(status) {
    switch (
      String(status || "")
        .trim()
        .toUpperCase()
    ) {
      case "ACTIVE":
        return "badge-success";

      case "INACTIVE":
        return "badge-danger";

      default:
        return "badge-secondary";
    }
  }

  function renderShiftList(shifts = []) {
    const el = document.getElementById("shiftList");
    const countEl = document.getElementById("shiftCount");

    if (!el) return;

    const list = Array.isArray(shifts) ? shifts : [];

    if (countEl) {
      countEl.textContent = String(list.length);
    }

    if (!list.length) {
      el.innerHTML = `<div class="text-muted small">No shifts found</div>`;
      return;
    }

    const mapped = list.map(mapShiftForView);

    el.innerHTML = mapped
      .map(
        (s) => `
          <div class="d-flex justify-content-between align-items-center border-bottom py-2">
            <div>
              <strong>${escapeHtml(s.shift_name)}</strong>

              <br>
              
              <small class="text-muted">
                ${escapeHtml(s.start_time)}
                -
                ${escapeHtml(s.end_time)}
              </small>

              <br>
              
              <small class="text-info">
                ${escapeHtml(s.timezone_label)}
              </small>

            </div>

            <span class="badge ${getShiftStatusClass(s.status_raw)}">
              ${escapeHtml(s.status)}
            </span>
          </div>
        `,
      )
      .join("");
  }

  function renderShiftListModal(shifts = []) {
    const tbody = document.getElementById("globalListBody");

    if (!tbody) return;

    const list = Array.isArray(shifts) ? shifts : [];

    if (!list.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="text-center text-muted py-4">
            No shifts found
          </td>
        </tr>
      `;
      return;
    }

    const mapped = list.map(mapShiftForView);

    tbody.innerHTML = mapped
      .map(
        (s) => `
          <tr>
            <td>
              ${escapeHtml(s.shift_name)}
            </td>

            <td>
              ${escapeHtml(s.timezone_label)}
            </td>

            <td>
              ${escapeHtml(s.start_time)}
              -
              ${escapeHtml(s.end_time)}
            </td>

            <td>
              ${escapeHtml(String(s.grace_minutes))}
            </td>

            <td>
              <span class="badge ${getShiftStatusClass(s.status_raw)}">
                ${escapeHtml(s.status)}
              </span>
            </td>

            <td class="text-end">
              <div class="btn-group btn-group-sm">
                <button
                  class="btn btn-outline-primary"
                  onclick="editShift('${escapeHtml(s.shift_id)}')">
                  Edit
                </button>

                <button
                  class="btn btn-outline-danger"
                  onclick="deleteShift('${escapeHtml(s.shift_id)}')">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        `,
      )
      .join("");
  }
</script>
