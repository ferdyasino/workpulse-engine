<script>
  function openCreateShiftFromUserModal() {
    UsersModal.closeFormModal?.();

    ShiftModal.openCreateModal(
      {},
      {
        onSubmit(formData) {
          UsersAPI.createShift(
            formData,

            async (result) => {
              // =====================================================
              // IMPORTANT:
              // Apps Script success handler fires for returned objects too,
              // including { success:false, message:"..." }.
              // So we must inspect result.success here.
              // =====================================================
              if (!result?.success) {
                showToast(result?.message || "Failed to create shift", "error");
                return;
              }

              showToast("Shift created", "success");

              await reloadAllReferences();

              ShiftModal.closeFormModal?.();

              // Prefer backend-created shift_id directly.
              // Fallback to name lookup only if needed.
              const createdShiftId =
                result?.data?.shift_id ||
                findShiftIdByName(
                  result?.data?.shift_name || formData.shift_name,
                );

              openCreateUser({
                shift_id: createdShiftId || "",
              });
            },

            (err) => {
              console.error("createShift error:", err);
              showToast(err?.message || "Failed to create shift", "error");
            },
          );
        },
      },
    );
  }

  function renderShiftList(shifts) {
    const el = document.getElementById("shiftList");
    if (!el) return;

    if (!Array.isArray(shifts) || shifts.length === 0) {
      el.innerHTML = `<div class="text-muted">No shifts found</div>`;
      return;
    }

    el.innerHTML = shifts
      .map(mapShiftForView)
      .map(
        (s) => `
      <div class="d-flex justify-content-between align-items-center border-bottom py-2">
        <div>
          <strong>${escapeHtml(s.shift_name)}</strong><br>
          <small class="text-muted">
            ${formatShift(s.start_time)} - ${formatShift(s.end_time)}
          </small>
        </div>

        <div class="text-end">
          <span class="badge ${getShiftStatusClass(s.status_raw)}">
            ${escapeHtml(s.status)}
          </span>
        </div>
      </div>
    `,
      )
      .join("");
  }

  function findShiftIdByName(name) {
    const normalized = String(name || "")
      .trim()
      .toLowerCase();
    const shifts = Array.isArray(state?.shifts) ? state.shifts : [];

    const found = [...shifts].reverse().find(
      (s) =>
        String(s?.shift_name || "")
          .trim()
          .toLowerCase() === normalized,
    );

    return found?.shift_id || "";
  }

  /* =========================
   VIEW MAPPER
========================= */
  function mapShiftForView(s = {}) {
    const rawStatus = String(s.status || "ACTIVE")
      .trim()
      .toUpperCase();

    return {
      shift_id: s.shift_id || "",
      shift_name: DISPLAY.label(s.shift_name || "UNKNOWN"),
      start_time: s.start_time || "",
      end_time: s.end_time || "",
      status_raw: rawStatus,
      status: DISPLAY.status(rawStatus),
    };
  }

  /* =========================
   STATUS STYLE
========================= */
  function getShiftStatusClass(status) {
    switch (
      String(status || "")
        .trim()
        .toUpperCase()
    ) {
      case "ACTIVE":
        return "badge-success";

      case "INACTIVE":
        return "badge-danger";

      default:
        return "badge-secondary";
    }
  }
</script>
