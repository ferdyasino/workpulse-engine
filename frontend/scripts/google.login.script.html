<script>
  (function () {
    const GOOGLE_SDK_URL = "https://accounts.google.com/gsi/client";
    let sdkPromise = null;

    function getGoogleServerData() {
      try {
        const data = window.SERVER_DATA;

        if (data == null) return {};

        if (typeof data === "object") {
          return data;
        }

        if (typeof data === "string") {
          const trimmed = data.trim();
          return trimmed ? JSON.parse(trimmed) : {};
        }

        return {};
      } catch (err) {
        console.error("Invalid SERVER_DATA:", err);
        return {};
      }
    }

    function getGoogleClientId() {
      const data = getGoogleServerData();
      console.log("[GoogleLogin] server data:", data);
      return String(data.googleClientId || "").trim();
    }

    function loadGoogleSdk() {
      console.log("[GoogleLogin] loading Google SDK...");

      if (window.google?.accounts?.id) {
        console.log("[GoogleLogin] Google SDK already available");
        return Promise.resolve();
      }

      if (sdkPromise) {
        return sdkPromise;
      }

      sdkPromise = new Promise((resolve, reject) => {
        const existing = document.querySelector('script[data-google-gis="true"]');
        if (existing) {
          console.log("[GoogleLogin] Google SDK script already injected");
          existing.addEventListener("load", () => resolve(), { once: true });
          existing.addEventListener(
            "error",
            () => reject(new Error("Failed to load Google sign-in script")),
            { once: true },
          );
          return;
        }

        console.log("[GoogleLogin] injecting Google SDK script");

        const script = document.createElement("script");
        script.src = GOOGLE_SDK_URL;
        script.async = true;
        script.defer = true;
        script.dataset.googleGis = "true";
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("Failed to load Google sign-in script"));
        document.head.appendChild(script);
      });

      return sdkPromise;
    }

    function handleGoogleLoginSuccess(response) {
      console.log("[GoogleLogin] credential response received:", response);

      const credential = String(response?.credential || "").trim();

      if (!credential) {
        console.warn("[GoogleLogin] missing credential in response");
        hideLoader?.();
        showToast?.("Google login failed: missing credential", "error");
        return;
      }

      const workspaceSlug =
        APP.workspaceSlug || localStorage.getItem(STORAGE_KEYS.WORKSPACE_SLUG) || "";

      console.log("[GoogleLogin] sending credential to backend", {
        workspaceSlug,
        hasCredential: !!credential,
      });

      ApiClient.call("loginWithGoogle", {
        id_token: credential,
        workspace_slug: workspaceSlug,
      })
        .then((result) => {
          console.log("[GoogleLogin] backend success response:", result);
          hideLoader?.();

          if (!result || result.success !== true) {
            console.warn("[GoogleLogin] backend returned unsuccessful result");
            showToast?.(result?.message || "Google login failed", "error");
            return;
          }

          const loginResult = result.login || result;

          console.log("[GoogleLogin] login result resolved:", loginResult);

          try {
            resetAppSessionState?.();
            resetReportsState?.();
            setCurrentUser(loginResult);
            APP.workStatus = "NOT STARTED";
            APP.dashboard = APP.dashboard || {};
            APP.dashboard.viewingDate = formatDateKey(new Date());
            hideLoader?.();
            renderUserHeader?.();
            applyRoleUI?.();
            go("dashboard");

            queueMicrotask(() => {
              bootstrapSettings?.().catch(console.error);

              if (APP.role === "admin" || APP.role === "owner") {
                UserInit?.();
              }
            });
          } catch (err) {
            console.error(err);
            showToast?.("Unable to load dashboard after Google login", "error");
          }
        })
        .catch((err) => {
          console.error("[GoogleLogin] backend failure:", err);
          hideLoader?.();
          showToast?.(err?.message || "Google login failed", "error");
        });
    }

    function startGoogleLogin() {
      console.log("[GoogleLogin] Apps Script identity login");

      google.script.run
        .withSuccessHandler((email) => {
          console.log("[GoogleLogin] Current Google account:", email);

          if (!email) {
            showToast?.("No Google account detected", "error");
            return;
          }

          google.script.run
            .withSuccessHandler((result) => {
              console.log("[GoogleLogin] backend result", result);

              if (result.success) {
                setCurrentUser(result.login || result);
                go("dashboard");
              }
            })
            .withFailureHandler((err) => {
              console.error(err);
              showToast?.(err.message, "error");
            })
            .loginWithGoogleEmail(email);
        })
        .withFailureHandler((err) => {
          console.error(err);
        })
        .getCurrentUserEmail();
    }
