<script>
  // =====================================================
  // RENDER SETTINGS GROUP
  // =====================================================

  function renderSettingsGroup(group = "ALL", btn = null) {
    setActiveSettingsButton(btn);

    const loading = document.getElementById("settingsLoading");
    const container = document.getElementById("settingsContent");

    const settings = normalizeSettings(APP.settings);

    const filtered =
      group === "ALL"
        ? settings
        : settings.filter(
            (s) =>
              String(s.group).toUpperCase() === String(group).toUpperCase(),
          );

    // --------------------------------------------------
    // Workspace summary cards
    // --------------------------------------------------

    const summary = settings.filter((s) =>
      ["OWNER_NAME", "TIMEZONE", "PERIOD_TYPE_DEFAULT"].includes(s.key),
    );

    let html = `
<div class="settings-page">

  <div class="row g-3 mb-4">
`;

    summary.forEach((item) => {
      html += `
      <div class="col-md-4">

        <div class="glass glass-card h-100">

          <div class="small text-muted">
            ${escapeHtml(item.label)}
          </div>

          <div class="fw-semibold fs-5 mt-1">
            ${escapeHtml(DISPLAY.label(item.value))}
          </div>

        </div>

      </div>
    `;
    });

    html += `
  </div>

  <div class="glass glass-card">

      <div class="d-flex justify-content-between align-items-center mb-3">

          <div>

              <h5 class="mb-1">
                  ${DISPLAY.label(group)} Settings
              </h5>

              <small class="text-muted">
                  ${filtered.length} setting(s)
              </small>

          </div>

      </div>
`;

    if (!filtered.length) {
      html += `

        <div class="text-center py-5">

            <i class="bi bi-sliders fs-1 text-muted"></i>

            <div class="mt-3 text-muted">

                No settings available.

            </div>

        </div>

`;
    } else {
      html += `<div class="list-group list-group-flush">`;

      filtered.forEach((setting) => {
        html += `
<div class="list-group-item px-0 py-3 border-bottom">

    <div class="row align-items-center">

        <div class="col-md-5">

            <div class="fw-semibold">

                ${escapeHtml(setting.label)}

            </div>

            ${
              setting.description
                ? `
                <small class="text-muted">

                    ${escapeHtml(setting.description)}

                </small>
            `
                : ""
            }

        </div>

        <div class="col-md-7">

            ${renderSettingInput(setting)}

        </div>

    </div>

</div>
`;
      });

      html += `</div>`;
    }

    html += `

      <div class="border-top mt-4 pt-3 d-flex justify-content-end">

          <button
              class="btn btn-primary"
              onclick="saveSettings()">

              <i class="bi bi-save me-2"></i>

              Save Changes

          </button>

      </div>

  </div>

</div>
`;

    container.innerHTML = html;

    loading.style.display = "none";

    container.classList.remove("d-none");
  }

  // =====================================================
  // RENDER SETTING INPUT
  // =====================================================
  function renderSettingInput(setting) {
    const key = setting.key;
    const type = setting.type || "text";
    const readonly = !!setting.readonly;
    const value = setting.value;

    if (readonly) {
      return renderReadonlyValue(setting);
    }

    switch (type) {
      case "boolean": {
        return `
<div class="form-check form-switch mb-0">
  <input
      type="checkbox"
      class="form-check-input setting-input"
      data-key="${key}"
      ${value ? "checked" : ""}>
</div>`;
      }

      case "number":
        return `
<input
    type="number"
    class="form-control setting-input"
    data-key="${key}"
    value="${escapeHtml(value ?? "")}">
`;

      case "select": {
        const options = Array.isArray(setting.options)
          ? setting.options
          : String(setting.options || "")
              .split("|")
              .map((v) => v.trim())
              .filter(Boolean);

        return `
<select
    class="form-select setting-input"
    data-key="${key}">
${options
  .map(
    (option) => `
  <option
      value="${escapeHtml(option)}"
      ${option === value ? "selected" : ""}>
      ${DISPLAY.label(option)}
  </option>
`,
  )
  .join("")}
</select>`;
      }

      default:
        return `
<input
    type="text"
    class="form-control setting-input"
    data-key="${key}"
    value="${escapeHtml(value ?? "")}">
`;
    }
  }
</script>
