<script>
  /**
   * =====================================================
   * USERS CONTROLLER
   * =====================================================
   */

  function UserInit() {
    init();
  }

  window.APP_STATE = window.APP_STATE || {
    users: [],
    departments: [],
    positions: [],
    shifts: [],
    loading: false,
  };

  let state = window.APP_STATE;

  function init() {
    loadReferenceData();
    loadUsers();
  }

  function reloadAllReferences() {
    return loadReferenceData();
  }

  // =====================================================
  // DROPDOWNS
  // =====================================================

  function hydrateDropdowns() {
    const dept = document.getElementById("department_id");
    const pos = document.getElementById("position_id");
    const shift = document.getElementById("shift_id");

    if (dept) {
      dept.innerHTML = state.departments
        .map(
          (d) => `
        <option value="${escapeHtml(d.department_id || "")}">
          ${escapeHtml(DISPLAY.name(d.department_name || ""))}
          ${escapeHtml(DISPLAY.name(d.supervisor_name || ""))}
        </option>
      `,
        )
        .join("");
    }

    if (pos) {
      pos.innerHTML = state.positions
        .map(
          (p) => `
        <option value="${escapeHtml(p.position_id || "")}">
          ${escapeHtml(DISPLAY.name(p.position_name || ""))}
        </option>
      `,
        )
        .join("");
    }

    if (shift) {
      shift.innerHTML = state.shifts
        .map(
          (s) => `
        <option value="${escapeHtml(s.shift_id || "")}">
          ${escapeHtml(DISPLAY.name(s.shift_name || ""))}
        </option>
      `,
        )
        .join("");
    }
  }

  // =====================================================
  // LOAD USERS
  // =====================================================

  function loadUsers() {
    console.log("Loading users...");
    setLoading(true);

    UsersAPI.getUsers(
      (res) => {
        state.users = Array.isArray(res) ? res : [];

        renderTable();
        updateStats();
        setLoading(false);
      },
      (err) => {
        console.error("Users load failed:", err);
        showToast("Failed to load users", "error");
        setLoading(false);
      },
    );
  }

  function loadDepartments() {
    return new Promise((resolve, reject) => {
      UsersAPI.getDepartments((res) => {
        state.departments = Array.isArray(res) ? res : [];
        renderDepartmentList(state.departments);
        resolve(state.departments);
      }, reject);
    });
  }

  function loadPositions() {
    return new Promise((resolve, reject) => {
      UsersAPI.getPositions((res) => {
        state.positions = Array.isArray(res) ? res : [];
        renderPositionList(state.positions);
        resolve(state.positions);
      }, reject);
    });
  }

  function loadShifts() {
    return new Promise((resolve, reject) => {
      UsersAPI.getShifts((res) => {
        state.shifts = Array.isArray(res) ? res : [];
        renderShiftList(state.shifts);
        resolve(state.shifts);
      }, reject);
    });
  }

  function loadReferenceData() {
    return Promise.all([loadDepartments(), loadPositions(), loadShifts()])
      .then(([deps, pos, shift]) => {
        state.departments = deps || [];
        state.positions = pos || [];
        state.shifts = shift || [];

        hydrateDropdowns();
      })
      .catch((err) => {
        console.error("Reference load failed:", err);
        throw err;
      });
  }

  // =====================================================
  // TABLE
  // =====================================================

  function renderTable() {
    const tbody = document.getElementById("usersTableBody");
    if (!tbody) return;

    tbody.innerHTML = "";

    if (!Array.isArray(state.users) || state.users.length === 0) {
      tbody.innerHTML = `
      <tr>
        <td colspan="8" class="text-center text-muted">
          No users found
        </td>
      </tr>
    `;
      return;
    }

    state.users.forEach((user) => {
      const row = document.createElement("tr");

      const name = DISPLAY.name(user.fullname || user.name || "N/A");
      const email = String(user.email || "")
        .trim()
        .toLowerCase();
      const role = DISPLAY.label(user.role || "");
      const departmentName = DISPLAY.name(getDepartmentName(user.department_id));
      const supervisorName = DISPLAY.name(getSupervisorName(user.department_id));
      const positionName = DISPLAY.name(getPositionName(user.position_id));
      const shiftName = DISPLAY.name(getShiftName(user.shift_id));
      const shift = getShiftObject(user.shift_id);
      const userSched = getShift(shift, { timeOnly: true });
      const status = DISPLAY.status(user.status || "UNKNOWN");
      const isOwner =
        String(user.role || "")
          .trim()
          .toUpperCase() === "OWNER";

      row.innerHTML = `
      <td>${escapeHtml(name)}</td>
      <td>${escapeHtml(email)}</td>
      <td>${escapeHtml(departmentName)} - ${escapeHtml(supervisorName)}</td>
      <td>${escapeHtml(positionName)}</td>
      <td>
        ${escapeHtml(shiftName)}
        <small class="text-muted d-block">
          ${escapeHtml(userSched)}
        </small>
      </td>
      <td>
        <span class="badge ${getStatusClass(status)}">
          ${escapeHtml(status)}
        </span>
      </td>
      <td class="text-nowrap">
        <button
          class="btn btn-sm btn-primary"
          onclick="editUser('${escapeHtml(user.user_id || "")}')"
          ${isOwner ? "disabled title='Owner account cannot be edited'" : ""}>
          Edit
        </button>

        <button
          class="btn btn-sm btn-danger"
          onclick="deleteUser('${escapeHtml(user.user_id || "")}')"
          ${isOwner ? "disabled title='Owner account cannot be deleted'" : ""}>
          Delete
        </button>
      </td>
    `;

      tbody.appendChild(row);
    });
  }

  // =====================================================
  // STATS
  // =====================================================

  function updateStats() {
    const total = state.users.length;

    const active = state.users.filter(
      (u) =>
        String(u.status || "")
          .trim()
          .toUpperCase() === "ACTIVE",
    ).length;

    setText("#totalUsers", total);
    setText("#activeUsers", active);
  }

  // =====================================================
  // FORM SUBMIT
  // =====================================================

  function handleSubmit(e) {
    e.preventDefault();

    const payload = {
      user_id: document.getElementById("employeeId")?.value || "",
      fullname: document.getElementById("employeeName")?.value || "",
      email: document.getElementById("employeeEmail")?.value || "",
      status: document.getElementById("employeeStatus")?.value || "",

      department_id: document.getElementById("employeeDepartment")?.value || "",
      position_id: document.getElementById("employeePosition")?.value || "",
      shift_id: document.getElementById("employeeShift")?.value || "",
    };

    const isEdit = !!payload.user_id;

    setLoading(true);

    const successHandler = () => {
      showToast(isEdit ? "User updated" : "User created", "success");

      UsersModal.closeFormModal?.();
      loadUsers();
    };

    const failHandler = (err) => {
      console.error(err);

      showToast(err?.message || "Operation failed", "error");
      setLoading(false);
    };

    if (isEdit) {
      UsersAPI.updateUser(payload.user_id, payload, successHandler, failHandler);
    } else {
      UsersAPI.createUser(payload, successHandler, failHandler);
    }
  }

  function setLoading(isLoading) {
    state.loading = isLoading;

    const btn = document.querySelector("#btnAddUser");
    if (!btn) return;

    btn.disabled = isLoading;
    btn.innerText = isLoading ? "Loading..." : "Add User";
  }
</script>
