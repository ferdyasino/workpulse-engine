<script>
/**
 * =====================================================
 * USERS CONTROLLER
 * =====================================================
 */

const UsersUI = (() => {

  let state = {
    users: [],
    loading: false
  };

  // =====================================================
  // INIT
  // =====================================================

  function init() {
    bindEvents();
    loadUsers();
  }

  // =====================================================
  // EVENTS
  // =====================================================

  function bindEvents() {

    document.querySelector("#btnAddUser")
      ?.addEventListener("click", UsersModal.openCreateModal);

    document.querySelector("#btnRefreshUsers")
      ?.addEventListener("click", loadUsers);

    document.querySelector("#employeeForm")
      ?.addEventListener("submit", handleSubmit);

  }

  // =====================================================
  // LOAD USERS
  // =====================================================

  function loadUsers() {

    console.log("Loading users...");

    setLoading(true);

    UsersAPI.getUsers(

      (res) => {

        console.log("Users loaded:", res);

        state.users = res || [];

        renderTable();
        updateStats();

        setLoading(false);

      },

      (err) => {

        console.error("Users load failed:", err);

        showToast("Failed to load users", "error");

        setLoading(false);

      }

    );
  }

  // =====================================================
  // TABLE
  // =====================================================

  function renderTable() {

    const tbody = document.getElementById("usersTableBody");

    console.log("tbody found:", tbody);

    if (!tbody) return;

    // HARD RESET (important)
    tbody.innerHTML = "";

    console.log("state.users:", state.users);

    if (!state.users || state.users.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="text-center text-muted">
            No users found
          </td>
        </tr>
      `;
      return;
    }

    state.users.forEach(user => {

      const row = document.createElement("tr");

      const name = user.fullname || user.name || "N/A";

      row.innerHTML = `
        <td>${escapeHtml(name)}</td>
        <td>${escapeHtml(user.email || "")}</td>
        <td>${escapeHtml(user.role || "")}</td>
        <td>
          <span class="badge ${getStatusClass(user.status)}">
            ${user.status || "UNKNOWN"}
          </span>
        </td>
        <td></td>
      `;

      tbody.appendChild(row);
    });
  }

  // =====================================================
  // STATS
  // =====================================================

  function updateStats() {

    const total = state.users.length;

    const active = state.users.filter(
      u => u.status === "ACTIVE"
    ).length;

    setText("#totalUsers", total);
    setText("#activeUsers", active);

  }

  // =====================================================
  // FORM SUBMIT
  // =====================================================

  function handleSubmit(e) {

    e.preventDefault();

    const payload = {

      user_id:
        document.getElementById("employeeId").value,

      fullname:
        document.getElementById("employeeName").value,

      email:
        document.getElementById("employeeEmail").value,

      role:
        document.getElementById("employeeRole").value,

      status:
        document.getElementById("employeeStatus").value

    };

    const isEdit = !!payload.user_id;

    setLoading(true);

    const successHandler = () => {

      showToast(
        isEdit
          ? "User updated"
          : "User created",
        "success"
      );

      UsersModal.closeFormModal();

      loadUsers();

    };

    const failHandler = (err) => {

      console.error(err);

      showToast(
        err.message || "Operation failed",
        "error"
      );

      setLoading(false);

    };

    if (isEdit) {

      UsersAPI.updateUser(
        payload.user_id,
        payload,
        successHandler,
        failHandler
      );

    } else {

      UsersAPI.createUser(
        payload,
        successHandler,
        failHandler
      );

    }

  }

  // =====================================================
  // DELETE / DEACTIVATE
  // =====================================================

  function confirmDeleteEmployee(mode) {

    const id =
      document.getElementById("deleteEmployeeId").value;

    setLoading(true);

    const successHandler = () => {

      showToast(
        mode === "DELETE"
          ? "User deleted"
          : "User deactivated",
        "success"
      );

      loadUsers();

    };

    const failHandler = (err) => {

      console.error(err);

      showToast(
        err.message || "Operation failed",
        "error"
      );

      setLoading(false);

    };

    if (mode === "DELETE") {

      UsersAPI.deleteUser(
        id,
        successHandler,
        failHandler
      );

    } else {

      UsersAPI.deactivateUser(
        id,
        successHandler,
        failHandler
      );

    }

    UsersModal.closeDeleteModal();

  }

  // =====================================================
  // HELPERS
  // =====================================================

  function setLoading(isLoading) {

    state.loading = isLoading;

    const btn =
      document.querySelector("#btnAddUser");

    if (!btn) return;

    btn.disabled = isLoading;

    btn.innerText =
      isLoading
        ? "Loading..."
        : "Add User";

  }

  function setText(selector, value) {

    const el =
      document.querySelector(selector);

    if (el) el.innerText = value;

  }

  function getStatusClass(status) {

    switch ((status || "").toUpperCase()) {

      case "ACTIVE":
        return "badge-success";

      case "PENDING":
        return "badge-warning";

      case "INACTIVE":
        return "badge-danger";

      default:
        return "badge-secondary";

    }

  }

  function escapeHtml(str) {

    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

  }


  function showToast(message, type) {

    if (window.Toast) {

      window.Toast.show(
        message,
        type
      );

    } else {

      console.log(
        `[${type}] ${message}`
      );

    }

  }

  // =====================================================
  // PUBLIC API
  // =====================================================

  return {

    init,

    loadUsers,

    openListModal:
      UsersModal.openListModal,

    openCreateModal:
      UsersModal.openCreateModal,

    openEditModal:
      UsersModal.openEditModal,

    openDeleteModal:
      UsersModal.openDeleteModal,

    confirmDeleteEmployee

  };

})();

function getWorkspaceId() {

  return localStorage.getItem("workspace_id")
    || document.getElementById("sid")?.value;

}


document.addEventListener(
  "DOMContentLoaded",
  UsersUI.init
);

</script>
