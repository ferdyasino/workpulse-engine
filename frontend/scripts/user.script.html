<script>
/**
 * =====================================================
 * USERS CONTROLLER
 * =====================================================
 */

function UserInit(){
  init();
}


  let state = {
    users: [],
    departments: [],
    positions: [],
    shifts: [],
    loading: false
  };

  // =====================================================
  // INIT
  // =====================================================

  function init() {
    // bindEvents();
    loadReferenceData();
    loadUsers();
  }

  // =====================================================
  // EVENTS
  // =====================================================

  // function bindEvents() {

  //   document.querySelector("#btnAddUser")
  //     ?.addEventListener("click", openCreateUser());

  //   document.querySelector("#btnRefreshUsers")
  //     ?.addEventListener("click", loadUsers);

  //   document.querySelector("#employeeForm")
  //     ?.addEventListener("submit", handleSubmit);

  // }

function openCreateUser() {

  if (!state.departments.length) {
    showToast("Loading reference data...", "warning");
    return;
  }

  UsersModal.openCreateModal({}, {

    departments: state.departments,
    positions: state.positions,
    shifts: state.shifts,

    onAddDepartment: () => {
      console.log("Add Department clicked");
      // openDepartmentModal()
    },

    onAddPosition: () => {
      console.log("Add Position clicked");
      // openPositionModal()
    },

    onAddShift: () => {
      console.log("Add Shift clicked");
      // openShiftModal()
    },

    onSubmit(formData) {

      UsersAPI.createUser(
        formData,

        () => {
          showToast("User created", "success");
          loadUsers();
        },

        (err) => {
          showToast(err.message, "error");
        }
      );

    }

  });

}

  function hydrateDropdowns() {

    const dept = document.getElementById("department_id");
    const pos = document.getElementById("position_id");
    const shift = document.getElementById("shift_id");

    if (dept) {
      dept.innerHTML = state.departments
        .map(d => `<option value="${d.department_id}">${d.department_name}</option>`)
        .join("");
    }

    if (pos) {
      pos.innerHTML = state.positions
        .map(p => `<option value="${p.position_id}">${p.position_name}</option>`)
        .join("");
    }

    if (shift) {
      shift.innerHTML = state.shifts
        .map(s => `<option value="${s.shift_id}">${s.shift_name}</option>`)
        .join("");
    }
  }

  // =====================================================
  // LOAD USERS
  // =====================================================

  function loadUsers() {

    console.log("Loading users...");

    setLoading(true);

    UsersAPI.getUsers(

      (res) => {

        console.log("Users loaded:", res);

        state.users = res || [];

        renderTable();
        updateStats();

        setLoading(false);

      },

      (err) => {

        console.error("Users load failed:", err);

        showToast("Failed to load users", "error");

        setLoading(false);

      }

    );
  }

function loadDepartments() {
  return new Promise((resolve, reject) => {

    UsersAPI.getDepartments(
      (res) => {
        state.departments = res || [];
        resolve(state.departments);
      },
      reject
    );

  });
}

function loadPositions() {
  return new Promise((resolve, reject) => {

    UsersAPI.getPositions(
      (res) => {
        state.positions = res || [];
        resolve(state.positions);
      },
      reject
    );

  });
}

function loadShifts() {
  return new Promise((resolve, reject) => {

    UsersAPI.getShifts(
      (res) => {

        console.log("RAW SHIFTS:", res);
        state.shifts = res || [];
        resolve(state.shifts);
      },
      reject
    );

  });
}

  // =====================================================
  // TABLE
  // =====================================================

  function renderTable() {

    const tbody = document.getElementById("usersTableBody");

    // console.log("tbody found:", tbody);

    if (!tbody) return;

    // HARD RESET (important)
    tbody.innerHTML = "";

    console.log("state.users:", state.users);

    if (!state.users || state.users.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="text-center text-muted">
            No users found
          </td>
        </tr>
      `;
      return;
    }

    state.users.forEach(user => {

      const row = document.createElement("tr");

      const name = user.fullname || user.name || "N/A";

      row.innerHTML = `
        <td>${escapeHtml(name)}</td>
        <td>${escapeHtml(user.email || "")}</td>
        <td>${escapeHtml(user.role || "")}</td>
        <td>${escapeHtml(getDepartmentName(user.department_id))}</td>
        <td>${escapeHtml(getPositionName(user.position_id))}</td>
        <td>${escapeHtml(getShiftName(user.shift_id))}</td>
        <td>
          <span class="badge ${getStatusClass(user.status)}">
            ${user.status || "UNKNOWN"}
          </span>
        </td>
        <td></td>
      `;

      tbody.appendChild(row);
    });
  }

  // =====================================================
  // STATS
  // =====================================================

  function updateStats() {

    const total = state.users.length;

    const active = state.users.filter(
      u => u.status === "ACTIVE"
    ).length;

    setText("#totalUsers", total);
    setText("#activeUsers", active);

  }

  // =====================================================
  // FORM SUBMIT
  // =====================================================

  function handleSubmit(e) {

    e.preventDefault();

    const payload = {
      user_id: document.getElementById("employeeId").value,
      fullname: document.getElementById("employeeName").value,
      email: document.getElementById("employeeEmail").value,
      role: document.getElementById("employeeRole").value,
      status: document.getElementById("employeeStatus").value,

      department_id: document.getElementById("employeeDepartment")?.value || "",
      position_id: document.getElementById("employeePosition")?.value || "",
      shift_id: document.getElementById("employeeShift")?.value || ""
    };

    const isEdit = !!payload.user_id;

    setLoading(true);

    const successHandler = () => {

      showToast(
        isEdit
          ? "User updated"
          : "User created",
        "success"
      );

      UsersModal.closeFormModal();

      loadUsers();

    };

    const failHandler = (err) => {

      console.error(err);

      showToast(
        err.message || "Operation failed",
        "error"
      );

      setLoading(false);

    };

    if (isEdit) {

      UsersAPI.updateUser(
        payload.user_id,
        payload,
        successHandler,
        failHandler
      );

    } else {

      UsersAPI.createUser(
        payload,
        successHandler,
        failHandler
      );

    }

  }

  function getDepartmentName(id) {
    return state.departments.find(d => d.department_id === id)?.department_name || "-";
  }

  function getPositionName(id) {
    return state.positions.find(p => p.position_id === id)?.position_name || "-";
  }

  function getShiftName(id) {
    return state.shifts.find(s => s.shift_id === id)?.shift_name || "-";
  }

  // =====================================================
  // DELETE / DEACTIVATE
  // =====================================================

  function confirmDeleteEmployee(mode) {

    const id =
      document.getElementById("deleteEmployeeId").value;

    setLoading(true);

    const successHandler = () => {

      showToast(
        mode === "DELETE"
          ? "User deleted"
          : "User deactivated",
        "success"
      );

      loadUsers();

    };

    const failHandler = (err) => {

      console.error(err);

      showToast(
        err.message || "Operation failed",
        "error"
      );

      setLoading(false);

    };

    if (mode === "DELETE") {

      UsersAPI.deleteUser(
        id,
        successHandler,
        failHandler
      );

    } else {

      UsersAPI.deactivateUser(
        id,
        successHandler,
        failHandler
      );

    }

    UsersModal.closeDeleteModal();

  }

  function loadReferenceData() {
    Promise.all([
      loadDepartments(),
      loadPositions(),
      loadShifts()
    ]).then(([deps, pos, shift]) => {

      state.departments = deps || [];
      state.positions = pos || [];
      state.shifts = shift || [];

      hydrateDropdowns();

    }).catch(err => {
      console.error("Reference load failed:", err);
    });
  }

  // =====================================================
  // HELPERS
  // =====================================================

  function setLoading(isLoading) {

    state.loading = isLoading;

    const btn =
      document.querySelector("#btnAddUser");

    if (!btn) return;

    btn.disabled = isLoading;

    btn.innerText =
      isLoading
        ? "Loading..."
        : "Add User";

  }
  
  document.getElementById("employeeDepartment")
  .addEventListener("change", function () {

    const deptId = this.value;

    const filtered = (window._positionsCache || [])
      .filter(p => p.department_id === deptId);

    populateSelect("employeePosition", filtered, "position_id", "position_name");
  });

  function populateSelect(id, items, valueKey, labelKey) {
    const el = document.getElementById(id);
    if (!el) return;

    el.innerHTML = `<option value="">Select</option>`;

    (items || []).forEach(item => {
      const opt = document.createElement("option");
      opt.value = item[valueKey];
      opt.textContent = item[labelKey];
      el.appendChild(opt);
    });
  }

  function setText(selector, value) {

    const el =
      document.querySelector(selector);

    if (el) el.innerText = value;

  }

  function getStatusClass(status) {

    switch ((status || "").toUpperCase()) {

      case "ACTIVE":
        return "badge-success";

      case "PENDING":
        return "badge-warning";

      case "INACTIVE":
        return "badge-danger";

      default:
        return "badge-secondary";

    }

  }

  function escapeHtml(str) {

    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

  }


  function showToast(message, type) {

    if (window.Toast) {

      window.Toast.show(
        message,
        type
      );

    } else {

      console.log(
        `[${type}] ${message}`
      );

    }

  }


</script>
