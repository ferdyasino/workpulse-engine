<script>
  function openCreateDepartmentFromUserModal() {
    UsersModal.closeFormModal?.();

    DepartmentModal.openCreateModal(
      {},
      {
        onSubmit(formData) {
          UsersAPI.createDepartment(
            formData,
            async () => {
              showToast("Department created", "success");

              await reloadAllReferences();

              DepartmentModal.closeFormModal?.();

              openCreateUser({
                department_id: findDepartmentIdByName(formData.department_name),
              });
            },
            (err) => {
              showToast(err.message || "Failed to create department", "error");
            },
          );
        },
      },
    );
  }

  // =====================================================
  // HELPERS
  // =====================================================

  function findDepartmentIdByName(name) {
    const normalized = String(name || "")
      .trim()
      .toLowerCase();

    const found = [...(state.departments || [])].reverse().find(
      (d) =>
        String(d.department_name || "")
          .trim()
          .toLowerCase() === normalized,
    );

    return found?.department_id || "";
  }

  function mapDepartmentForView(dept = {}) {
    const rawStatus = String(dept.status || "ACTIVE")
      .trim()
      .toUpperCase();

    return {
      department_id: dept.department_id || "",

      department_name: DISPLAY.label(dept.department_name || "Unknown"),

      description: DISPLAY.label(dept.description || "-"),

      status_raw: rawStatus,

      status: DISPLAY.status(rawStatus),
    };
  }

  function getDepartmentStatusClass(status) {
    switch (String(status || "").toUpperCase()) {
      case "ACTIVE":
        return "badge-success";

      case "INACTIVE":
        return "badge-danger";

      default:
        return "badge-secondary";
    }
  }

  // =====================================================
  // CARD LIST
  // =====================================================

  function renderDepartmentList(departments = []) {
    const list = document.getElementById("departmentList");
    const count = document.getElementById("departmentCount");

    if (!list) return;

    count.textContent = departments.length;

    if (!departments.length) {
      list.innerHTML = `
        <div class="text-muted small">
          No departments found
        </div>
      `;
      return;
    }

    list.innerHTML = departments
      .map(mapDepartmentForView)
      .map(
        (dept) => `
          <div class="d-flex justify-content-between align-items-center border-bottom py-2">
            <div>
              <strong>${escapeHtml(dept.department_name)}</strong>
            </div>

            <span class="badge ${getDepartmentStatusClass(dept.status_raw)}">
              ${escapeHtml(dept.status)}
            </span>
          </div>
        `,
      )
      .join("");
  }

  // =====================================================
  // MODAL LIST
  // =====================================================

  function renderDepartmentListModal(departments = []) {
    const tbody = document.getElementById("globalListBody");

    if (!tbody) return;

    if (!departments.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="text-center text-muted py-4">
            No departments found
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = departments
      .map(mapDepartmentForView)
      .map(
        (dept) => `
          <tr>
            <td>${escapeHtml(dept.department_name)}</td>

            <td>${escapeHtml(dept.description)}</td>

            <td>
              <span class="badge ${getDepartmentStatusClass(dept.status_raw)}">
                ${escapeHtml(dept.status)}
              </span>
            </td>

            <td class="text-end">
              <div class="btn-group btn-group-sm">

                <button
                  class="btn btn-outline-primary"
                  onclick="editDepartment('${dept.department_id}')">
                  Edit
                </button>

                <button
                  class="btn btn-outline-danger"
                  onclick="deleteDepartment('${dept.department_id}')">
                  Delete
                </button>

              </div>
            </td>
          </tr>
        `,
      )
      .join("");
  }
</script>
