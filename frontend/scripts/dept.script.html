<script>

function openCreateDepartmentFromUserModal() {
  // close employee form first so modals do not stack badly
  UsersModal.closeFormModal?.();

  DepartmentModal.openCreateModal({}, {
    onSubmit(formData) {
      UsersAPI.createDepartment(
        formData,

        async () => {
          showToast("Department created", "success");
          
          await reloadAllReferences();

          DepartmentModal.closeFormModal?.();


          const newDepartmentId =
            findDepartmentIdByName(formData.department_name);

          openCreateUser({
            department_id: newDepartmentId
          });
        },

        (err) => {
          showToast(err.message || "Failed to create department", "error");
        }
      );
    }
  });
}

function renderDepartmentList(depts) {

  const el = document.getElementById("departmentList");
  if (!el) return;

  if (!Array.isArray(depts) || depts.length === 0) {
    el.innerHTML = `<div class="text-muted">No departments found</div>`;
    return;
  }

  el.innerHTML = depts.map(normalizeDepartment).map(d => `

    <div class="d-flex justify-content-between align-items-center border-bottom py-2">

      <div>
        <strong>${escapeHtml(d.department_name)}</strong>
      </div>

      <span class="badge ${getDepartmentStatusClass(d.status)}">
        ${d.status}
      </span>

    </div>

  `).join("");
}

function findDepartmentIdByName(name) {
  const normalized = String(name || "").trim().toLowerCase();

  const found = [...(state.departments || [])]
    .reverse()
    .find(d =>
      String(d.department_name || "").trim().toLowerCase() === normalized
    );

  return found?.department_id || "";
}

/* =========================
   NORMALIZER (CRITICAL FOR CONSISTENCY)
========================= */
function normalizeDepartment(d) {
  return {
    department_id: d.department_id || "",
    department_name: d.department_name || "UNKNOWN",
    status: (d.status || "ACTIVE").toUpperCase()
  };
}

/* =========================
   STATUS UI MAPPING
========================= */
function getDepartmentStatusClass(status) {

  switch ((status || "").toUpperCase()) {

    case "ACTIVE":
      return "badge-success";

    case "INACTIVE":
      return "badge-danger";

    default:
      return "badge-secondary";
  }
}

/* =========================
   SAFE HTML ESCAPE
========================= */
function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}
</script>
