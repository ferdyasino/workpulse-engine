<script>
  window.UsersAPI = (() => {
    const ws = () => {
      const id = APP.user?.workspace_id || localStorage.getItem("workspace_id");

      if (!id) {
        throw new Error("Workspace ID not found. Please login again.");
      }

      return id;
    };

    // =====================================================
    // USERS
    // =====================================================

    function getUsers(success, fail) {
      ApiClient.call("getUsers", ws()).then(success).catch(fail);
    }

    function createUser(payload, success, fail) {
      ApiClient.call("createUser", ws(), payload).then(success).catch(fail);
    }

    function updateUser(userId, payload, success, fail) {
      ApiClient.call("updateUser", ws(), userId, payload).then(success).catch(fail);
    }

    function deleteUser(userId, success, fail) {
      ApiClient.call("deleteUser", ws(), userId).then(success).catch(fail);
    }

    function deactivateUser(userId, success, fail) {
      ApiClient.call("deactivateUser", ws(), userId).then(success).catch(fail);
    }

    // =====================================================
    // DEPARTMENTS
    // =====================================================

    function getDepartments(success, fail) {
      ApiClient.call("getAllDepartments", ws()).then(success).catch(fail);
    }

    function createDepartment(payload, success, fail) {
      ApiClient.call("createDepartment", ws(), payload).then(success).catch(fail);
    }

    function updateDepartment(departmentId, payload, success, fail) {
      ApiClient.call("updateDepartment", ws(), departmentId, payload).then(success).catch(fail);
    }

    function deleteDepartment(departmentId, success, fail) {
      ApiClient.call("deleteDepartment", ws(), departmentId).then(success).catch(fail);
    }

    // =====================================================
    // POSITIONS
    // =====================================================

    function getPositions(success, fail) {
      ApiClient.call("getAllPositions", ws()).then(success).catch(fail);
    }

    function createPosition(payload, success, fail) {
      ApiClient.call("createPosition", ws(), payload).then(success).catch(fail);
    }

    function updatePosition(positionId, payload, success, fail) {
      ApiClient.call("updatePosition", ws(), positionId, payload).then(success).catch(fail);
    }

    function deletePosition(positionId, success, fail) {
      ApiClient.call("deletePosition", ws(), positionId).then(success).catch(fail);
    }

    // =====================================================
    // SHIFTS
    // =====================================================
    // console.log("ws", ws());
    function getShifts(success, fail) {
      ApiClient.call("getAllShifts", ws()).then(success).catch(fail);
    }

    function createShift(payload, success, fail) {
      ApiClient.call("createShift", ws(), payload).then(success).catch(fail);
    }

    function updateShift(shiftId, payload, success, fail) {
      ApiClient.call("updateShift", ws(), shiftId, payload).then(success).catch(fail);
    }

    function deleteShift(shiftId, success, fail) {
      ApiClient.call("deleteShift", ws(), shiftId).then(success).catch(fail);
    }

    function deactivateShift(shiftId, success, fail) {
      ApiClient.call("deactivateShift", ws(), shiftId).then(success).catch(fail);
    }

    function getWorkspaceSettings(success, fail) {
      ApiClient.call("getWorkspaceSettings", ws()).then(success).catch(fail);
    }

    // =====================================================
    // PUBLIC API
    // =====================================================

    return {
      // USERS
      getUsers,
      createUser,
      updateUser,
      deleteUser,
      deactivateUser,

      // DEPARTMENTS
      getDepartments,
      createDepartment,
      updateDepartment,
      deleteDepartment,

      // POSITIONS
      getPositions,
      createPosition,
      updatePosition,
      deletePosition,

      // SHIFTS
      getShifts,
      createShift,
      updateShift,
      deleteShift,
      deactivateShift,

      getWorkspaceSettings,
    };
  })();
</script>
