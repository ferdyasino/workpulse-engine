<script>
  // =====================================================
  // TIMEZONE
  // =====================================================

  const APP_TIMEZONE = {
    value: "America/New_York",
  };

  function setAppTimezone(timezone) {
    if (typeof timezone === "string" && timezone.trim()) {
      APP_TIMEZONE.value = timezone.trim();
    }
  }

  function getAppTimezone() {
    return APP_TIMEZONE.value;
  }

  // =====================================================
  // FORMATTERS
  // =====================================================

  function formatTimeClock(value) {
    if (!value) return "--:--";

    const date = value instanceof Date ? value : new Date(value);

    if (isNaN(date)) return String(value);

    return date.toLocaleTimeString("en-US", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true,
      timeZone: getAppTimezone(),
    });
  }

  function formatDate(value) {
    if (!value) return "--";

    const date = value instanceof Date ? value : new Date(value);

    if (isNaN(date)) return String(value);

    return date.toLocaleDateString("en-US", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
      timeZone: getAppTimezone(),
    });
  }

  function formatToday() {
    return new Intl.DateTimeFormat("en-US", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
      timeZone: getAppTimezone(),
    }).format(new Date());
  }

  // =====================================================
  // DATE HELPERS
  // =====================================================

  function getTodayKey() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: getAppTimezone(),
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).format(new Date());
  }

  function getTodayDate() {
    return new Date(getTodayKey() + "T12:00:00");
  }

  function daysBetween(dateA, dateB) {
    const a = new Date(dateA);
    const b = new Date(dateB);

    a.setHours(12, 0, 0, 0);
    b.setHours(12, 0, 0, 0);

    return Math.round((a - b) / 86400000);
  }

  // =====================================================
  // LOGIN CLOCK
  // =====================================================

  function updateLoginClock() {
    const timeEl = document.getElementById("loginClockTime");
    const dateEl = document.getElementById("loginClockDate");

    if (!timeEl || !dateEl) return;

    const now = new Date();

    timeEl.textContent = formatTimeClock(now);
    dateEl.textContent = formatToday();
  }

  // =====================================================
  // DASHBOARD CLOCK
  // =====================================================

  function updateDashboardClock() {
    const timeEl = document.getElementById("dashboardClockTime");
    const currDate = document.getElementById("currDate");
    const dateEl = document.getElementById("dashboardClockDate");

    if (!timeEl || !dateEl) return;

    const now = new Date();

    timeEl.textContent = formatTimeClock(now);

    if (currDate) {
      currDate.innerHTML = `
        <div style="
          font-size:12px;
          font-weight:700;
          text-transform:uppercase;
          letter-spacing:.08em;
          color:#64748b;
          margin-bottom:2px;
        ">
          Current Date
        </div>
        <div>${formatToday()}</div>
      `;
    }

    const todayDate = getTodayDate();

    const displayDate = APP.dashboard.viewingDate
      ? new Date(APP.dashboard.viewingDate + "T12:00:00")
      : todayDate;

    const diffDays = daysBetween(displayDate, todayDate);

    let prefix = "";

    switch (diffDays) {
      case 0:
        prefix = "Today";
        break;
      case -1:
        prefix = "Yesterday";
        break;
      case 1:
        prefix = "Tomorrow";
        break;
      default:
        prefix = diffDays < 0 ? "Viewing Past Record" : "Viewing Future Schedule";
    }

    if (diffDays === 0) {
      dateEl.style.display = "none";
    } else {
      dateEl.style.display = "block";
      dateEl.innerHTML = `
        <div style="
          font-size:12px;
          font-weight:700;
          text-transform:uppercase;
          letter-spacing:.08em;
          color:#2563eb;
          margin-bottom:2px;
        ">
          ${prefix}
        </div>
        <div>${formatDate(displayDate)}</div>
      `;
    }
  }

  // =====================================================
  // TOPBAR CLOCK
  // =====================================================

  function updateTopbarClock() {
    const timeEl = document.getElementById("adminClockTime");
    const dateEl = document.getElementById("adminClockDate");

    if (!timeEl && !dateEl) return;

    const now = new Date();

    if (timeEl) {
      timeEl.textContent = formatTimeClock(now);
    }

    if (dateEl) {
      dateEl.textContent = formatToday();
    }
  }

  // =====================================================
  // MASTER CLOCK
  // =====================================================

  function tickAllClocks() {
    updateLoginClock();
    updateDashboardClock();
    updateTopbarClock();
  }

  window.addEventListener("DOMContentLoaded", () => {
    tickAllClocks();
    setInterval(tickAllClocks, 1000);
  });
</script>
