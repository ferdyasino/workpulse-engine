<script>
  // =====================================================
  // SAFE POSITION RESOLVER
  // =====================================================

  function getPositionsSafe() {
    return state.positions || [];
  }

  // =====================================================
  // CREATE FROM USER
  // =====================================================

  function openCreatePositionFromUserModal() {
    UsersModal.closeFormModal?.();

    PositionModal.openCreateModal(
      {},
      {
        departments: state.departments,

        onSubmit(formData) {
          UsersAPI.createPosition(
            formData,
            async () => {
              showToast("Position created", "success");

              await reloadAllReferences();

              PositionModal.closeFormModal?.();

              openCreateUser({
                position_id: findPositionIdByName(formData.position_name),
              });
            },
            (err) => {
              showToast(err.message || "Failed to create position", "error");
            },
          );
        },
      },
    );
  }

  // =====================================================
  // HELPERS
  // =====================================================

  function findPositionIdByName(name) {
    const normalized = String(name || "")
      .trim()
      .toLowerCase();

    const found = [...getPositionsSafe()].reverse().find(
      (p) =>
        String(p.position_name || "")
          .trim()
          .toLowerCase() === normalized,
    );

    return found?.position_id || "";
  }

  function mapPositionForView(position = {}) {
    const rawStatus = String(position.status || "ACTIVE")
      .trim()
      .toUpperCase();

    const deptName =
      typeof getDepartmentName === "function" ? getDepartmentName(position.department_id) : "-";

    return {
      position_id: position.position_id || "",
      position_name: DISPLAY?.label?.(position.position_name || "Unknown") || "Unknown",
      department_name: DISPLAY?.label?.(deptName) || deptName,
      description: DISPLAY?.label?.(position.description || "-") || "-",
      status_raw: rawStatus,
      status: DISPLAY?.status?.(rawStatus) || rawStatus,
    };
  }

  function getPositionStatusClass(status) {
    switch (String(status || "").toUpperCase()) {
      case "ACTIVE":
        return "badge-success";
      case "INACTIVE":
        return "badge-danger";
      default:
        return "badge-secondary";
    }
  }

  // =====================================================
  // CARD LIST (SAFE)
  // =====================================================

  function renderPositionList(positions = []) {
    const list = document.getElementById("positionList");
    const count = document.getElementById("positionCount");

    if (!list) return;

    if (count) count.textContent = positions.length;

    if (!positions.length) {
      list.innerHTML = `
        <div class="text-muted small">
          No positions found
        </div>
      `;
      return;
    }

    list.innerHTML = positions
      .map(mapPositionForView)
      .map(
        (position) => `
          <div class="d-flex justify-content-between align-items-center border-bottom py-2">
            <div>
              <strong>${escapeHtml(position.position_name)}</strong>
              <div class="text-muted small">
                ${escapeHtml(position.department_name)}
              </div>
            </div>

            <span class="badge ${getPositionStatusClass(position.status_raw)}">
              ${escapeHtml(position.status)}
            </span>
          </div>
        `,
      )
      .join("");
  }

  // =====================================================
  // MODAL LIST (SAFE)
  // =====================================================

  function renderPositionListModal(positions = []) {
    const tbody = document.getElementById("globalListBody");

    if (!tbody) return;

    if (!positions.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="text-center text-muted py-4">
            No positions found
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = positions
      .map(mapPositionForView)
      .map(
        (position) => `
          <tr>
            <td>${escapeHtml(position.position_name)}</td>
            <td>${escapeHtml(position.department_name)}</td>

            <td>
              <span class="badge ${getPositionStatusClass(position.status_raw)}">
                ${escapeHtml(position.status)}
              </span>
            </td>

            <td class="text-end">
              <div class="btn-group btn-group-sm">
                <button
                  class="btn btn-outline-primary"
                  onclick="editPosition('${position.position_id}')">
                  Edit
                </button>

                <button
                  class="btn btn-outline-danger"
                  onclick="deletePosition('${position.position_id}')">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        `,
      )
      .join("");
  }
</script>
