<script>
  APP.__dutyPromptShown = APP.__dutyPromptShown || false;

  async function bootApp() {
    APP.dashboard.viewingDate = formatDateKey(new Date());

    const user = getCurrentUser();

    const isLoggedIn = user && user.user_id && user.workspace_id;

    if (isLoggedIn) {
      APP.currentPage =
        localStorage.getItem(STORAGE_KEYS.LAST_PAGE) ||
        APP.currentPage ||
        "dashboard";
    } else {
      APP.currentPage = "login";
    }

    await go(APP.currentPage);
  }

  async function go(page) {
    APP.currentPage = page;
    localStorage.setItem(STORAGE_KEYS.LAST_PAGE, page);

    const targetId = ROUTES[page] || ROUTES.home;
    const el = document.getElementById(targetId);

    if (!el) {
      console.error("Invalid page:", page);
      return;
    }

    hideAllPages();

    // STEP 1: show shell instantly
    el.classList.remove("d-none");

    applyRoleUI();
    updateDashboardTitle(page);
    applyUIState(page);

    // STEP 2: allow paint first
    await new Promise(requestAnimationFrame);

    // STEP 3: defer ALL hydration safely
    setTimeout(() => {
      loadPageData(page).catch(console.error);
    }, 0);

    console.log("ROUTE →", page);
  }

  // =====================================================
  // PAGE HANDLER
  // =====================================================

  function hideAllPages() {
    document
      .querySelectorAll(".app-page")
      .forEach((pageEl) => pageEl.classList.add("d-none"));
  }

  function buildDashboardShell() {
    renderUserHeader?.();

    clearDashboardUI?.();

    initDashboardAttendanceUI?.();

    updateDashboardClock?.();

    const status = document.getElementById("globalStatusText");

    if (status) {
      status.textContent = "Loading attendance...";
    }

    const dot = document.getElementById("statusDot");

    if (dot) {
      dot.className = "status-dot bg-secondary";
    }
  }

  // =====================================================
  // UI STATE
  // =====================================================

  function applyUIState(page) {
    const topbar = document.getElementById("appTopbar");
    const clock = document.getElementById("adminClockContainer");

    if (page === "login") {
      topbar?.classList.add("d-none");
      clock?.classList.add("d-none");
      return;
    }

    topbar?.classList.remove("d-none");

    if (page === "admin") {
      clock?.classList.remove("d-none");
    } else {
      clock?.classList.add("d-none");
    }

    if (page === "dashboard") {
      clearDashboardUI?.();
      initDashboardAttendanceUI?.();
    }
  }

  // =====================================================
  // ROLE UI
  // =====================================================

  function applyRoleUI() {
    const isAdmin = APP.role === "admin" || APP.role === "owner";
    const adminMenu = document.getElementById("adminMenuItem");
    const adminSettings = document.getElementById("adminSettings");
    const dashDropId = document.getElementById("dashDropId");
    document
      .getElementById("adminReportControls")
      ?.classList.toggle("d-none", !isAdmin);

    if (adminMenu) {
      adminMenu.classList.toggle("d-none", !isAdmin);
      adminSettings.classList.toggle("d-none", !isAdmin);
    }
  }

  // =====================================================
  // TITLE
  // =====================================================

  function updateDashboardTitle(page) {
    const el = document.getElementById("dashboardTitle");
    if (!el) return;

    el.textContent = PAGE_TITLES[page] || "Dashboard";
  }

  async function loadPageData(page) {
    try {
      switch (page) {
        case "dashboard":
          hydrateAttendanceUI?.(state);

          renderUserHeader?.();

          updateDashboardClock?.();
          requestIdleCallback?.(() => {
            syncAttendanceState({ silent: true }).catch(console.error);
          }) ||
            setTimeout(() => {
              syncAttendanceState({ silent: true }).catch(console.error);
            }, 0);
          break;

        case "reports":
          await loadReportsPage?.();
          break;

        case "settings":
          await renderSettingsGroup?.();
          break;

        case "users":
          await loadUsersAdminPage?.();
          break;

        case "admin":
          await loadAdminHomePage?.();
          break;
      }
    } catch (error) {
      console.error("loadPageData error:", error);
    }
  }
  async function loadUsersAdminPage() {
    // Prevent duplicate loads if router fires repeatedly
    if (APP.__usersPageLoading) return;

    // If the users page DOM isn't mounted yet, skip safely
    const usersTableBody = document.getElementById("usersTableBody");
    const departmentList = document.getElementById("departmentList");
    const positionList = document.getElementById("positionList");
    const shiftList = document.getElementById("shiftList");

    const hasUsersPageUI =
      !!usersTableBody || !!departmentList || !!positionList || !!shiftList;

    if (!hasUsersPageUI) return;

    APP.__usersPageLoading = true;

    try {
      showLoader?.();

      // 1) Load references first if API exists
      if (typeof reloadAllReferences === "function") {
        await reloadAllReferences();
      }

      // 2) Render reference cards if renderer exists
      if (typeof renderReferenceCards === "function") {
        renderReferenceCards();
      }

      // 3) Load users table + stats if loader exists
      if (typeof loadUsersTableAndStats === "function") {
        await loadUsersTableAndStats();
      }
      // fallback compatibility:
      else if (typeof loadUsers === "function") {
        // Only call if your existing loadUsers() is your employee-page loader
        loadUsers();
      }
    } catch (error) {
      console.error("loadUsersAdminPage error:", error);
      showToast?.(error.message || "Failed to load users page", "error");
    } finally {
      APP.__usersPageLoading = false;
      hideLoader?.();
    }
  }

  // =====================================================
  // OPTIONAL ADMIN HOME LOADER
  // - safe placeholder for future admin dashboard page logic
  // =====================================================

  function loadAdminHomePage() {
    // Intentionally empty for now
    // Add admin landing-page hydration here later if needed
  }

  function clearDashboardUI() {
    const leftTimelogsList = document.getElementById("leftTimelogsList");

    if (leftTimelogsList) {
      leftTimelogsList.innerHTML = `
      <div class="text-muted-custom">
        <span class="spinner-border spinner-border-sm me-2"></span>
        Loading attendance...
      </div>
    `;
    }

    const summaryTimeIn = document.getElementById("summaryTimeIn");

    if (summaryTimeIn) {
      summaryTimeIn.textContent = "--:--";
    }

    const summaryTimeOut = document.getElementById("summaryTimeOut");

    if (summaryTimeOut) {
      summaryTimeOut.textContent = "--:--";
    }

    const globalStatusText = document.getElementById("globalStatusText");

    if (globalStatusText) {
      globalStatusText.textContent = "Loading attendance...";
    }

    const dot = document.getElementById("statusDot");

    if (dot) {
      dot.className = "status-dot bg-secondary";
    }

    const breakButtonContainer = document.getElementById(
      "breakButtonContainer",
    );

    if (breakButtonContainer) {
      breakButtonContainer.innerHTML = `
      <button
        class="btn btn-secondary w-100"
        disabled>
        <span class="spinner-border spinner-border-sm me-2"></span>
        Loading...
      </button>
    `;
    }
  }

  function syncAttendanceState({ silent = false } = {}) {
    return new Promise((resolve, reject) => {
      const user = getCurrentUser();

      if (!user) {
        resolve();
        return;
      }

      const workspace_id = user.workspace_id;
      const email = user.email;
      const shift_id = user.shift_id;

      if (!workspace_id || !email) {
        resolve();
        return;
      }

      if (!silent) {
        showLoader?.();
      }

      google.script.run
        .withSuccessHandler((state) => {
          if (!silent) {
            hideLoader?.();
          }

          if (!state) {
            resolve();
            return;
          }

          // Server is now the source of truth
          APP.dashboard.viewingDate = state.work_date;
          APP.attendanceState = state;
          APP.workStatus = state.status || "NOT_STARTED";
          APP.timeLogs = state.raw_logs || [];

          hydrateAttendanceUI?.(state);

          renderUserHeader?.();

          updateDashboardClock?.();

          maybePromptForDuty?.();

          resolve(state);
        })
        .withFailureHandler((err) => {
          if (!silent) {
            hideLoader?.();
          }

          reject(err);
        })
        .getCurrentState(workspace_id, email, shift_id);
    });
  }

  window.addEventListener("DOMContentLoaded", async () => {
    showLoader();

    parseServerData();
    restoreSessionLite();

    await bootApp();

    hideLoader();
  });
</script>
