<script>
  // =====================================================
  // APP BOOT
  // =====================================================

  function bootApp() {
    if (!APP.currentPage) {
      APP.currentPage = "login";
    }

    go(APP.currentPage);
  }

  // =====================================================
  // ROUTER
  // =====================================================

  function go(page) {
    APP.currentPage = page;

    localStorage.setItem(STORAGE_KEYS.LAST_PAGE, page);

    const targetId = ROUTES[page] || ROUTES.home;

    hideAllPages();

    const el = document.getElementById(targetId);

    if (!el) {
      console.error("Invalid page:", page);
      showToast?.("Page not found", "error");
      return;
    }

    el.classList.remove("d-none");

    applyUIState(page);
    applyRoleUI();
    updateDashboardTitle(page);

    console.log("ROUTE →", page);
  }

  // =====================================================
  // PAGE HANDLER
  // =====================================================

  function hideAllPages() {
    document
      .querySelectorAll(".app-page")
      .forEach((pageEl) => pageEl.classList.add("d-none"));
  }

  // =====================================================
  // UI STATE
  // =====================================================

  function applyUIState(page) {
    const topbar = document.getElementById("appTopbar");
    const clock = document.getElementById("adminClockContainer");

    if (page === "login") {
      topbar?.classList.add("d-none");
      clock?.classList.add("d-none");
      return;
    }

    topbar?.classList.remove("d-none");

    if (page === "admin") {
      clock?.classList.remove("d-none");
    } else {
      clock?.classList.add("d-none");
    }

    if (page === "dashboard") {
      // 1) Reset dashboard data display only
      clearDashboardUI?.();

      // 2) Render attendance shell immediately (logger + empty placeholders)
      initDashboardAttendanceUI?.();

      // 3) Hydrate actual attendance state in background
      // silent:true = do not block dashboard with loader on initial dashboard load
      syncAttendanceState({ silent: true });
    }
  }

  // =====================================================
  // ROLE UI
  // =====================================================

  function applyRoleUI() {
    const isAdmin = APP.role === "admin" || APP.role === "owner";
    const adminMenu = document.getElementById("adminMenuItem");

    if (adminMenu) {
      adminMenu.classList.toggle("d-none", !isAdmin);
    }
  }

  // =====================================================
  // TITLE
  // =====================================================

  function updateDashboardTitle(page) {
    const el = document.getElementById("dashboardTitle");
    if (!el) return;

    el.textContent = PAGE_TITLES[page] || "Dashboard";
  }

  // =====================================================
  // DASHBOARD TOGGLE
  // =====================================================

  function toggleDashboard() {
    const isAdmin = APP.role === "admin" || APP.role === "owner";

    if (!isAdmin) {
      showToast?.("Access denied", "error");
      return;
    }

    if (APP.currentPage === "admin") {
      showToast?.("Switching to dashboard", "info");
      go("dashboard");
    } else {
      showToast?.("Switching to admin panel", "info");
      go("admin");
    }
  }

  // =====================================================
  // CLEAN DASHBOARD RESET
  // IMPORTANT:
  // - DO NOT destroy the logger container here
  // - logger is persistent shell rendered by initDashboardAttendanceUI()
  // =====================================================

  function clearDashboardUI() {
    const leftTimelogsList = document.getElementById("leftTimelogsList");
    if (leftTimelogsList) {
      leftTimelogsList.innerHTML = `<div class="text-muted-custom">No break activity yet</div>`;
    }

    const summaryTimeIn = document.getElementById("summaryTimeIn");
    if (summaryTimeIn) summaryTimeIn.textContent = "--";

    const summaryTimeOut = document.getElementById("summaryTimeOut");
    if (summaryTimeOut) summaryTimeOut.textContent = "--";

    const globalStatusText = document.getElementById("globalStatusText");
    if (globalStatusText) globalStatusText.textContent = "NOT STARTED";

    const dot = document.getElementById("statusDot");
    if (dot) {
      dot.className = "status-dot bg-secondary";
    }

    const breakButtonContainer = document.getElementById(
      "breakButtonContainer",
    );
    if (breakButtonContainer) {
      breakButtonContainer.innerHTML = "";
    }

    // IMPORTANT:
    // dashboardTimelogsList is NOT cleared here anymore.
    // Logger shell must persist and be managed by renderTimeLogger().
  }

  // =====================================================
  // SINGLE SOURCE DASHBOARD SYNC (PRIMARY)
  // - fetch logs once
  // - build state once
  // - hydrate through one pipeline
  // =====================================================

  function syncAttendanceState({ silent = false } = {}) {
    const user = getCurrentUser();
    const email = user?.email;
    const workspace_id = user?.workspace_id;

    if (!email || !workspace_id) return;

    if (!silent) showLoader?.();

    google.script.run
      .withSuccessHandler((logs) => {
        if (!silent) hideLoader?.();

        const safeLogs = dedupeTimeLogs(Array.isArray(logs) ? logs : []);
        const state = buildTimeLogState(safeLogs);

        APP.timeLogs = safeLogs;
        APP.attendanceState = state;
        APP.workStatus = state.status || "NOT STARTED";

        hydrateAttendanceUI?.(state);
        renderUserHeader?.();
      })
      .withFailureHandler((err) => {
        if (!silent) hideLoader?.();
        console.error("syncAttendanceState error:", err);
      })
      .findTimeLogs(workspace_id, { email });
  }

  // =====================================================
  // INIT
  // =====================================================

  window.addEventListener("DOMContentLoaded", () => {
    parseServerData();
    restoreSession();
    renderUserHeader?.();
    bootApp();
  });
</script>
