<script>

/**
 * =====================================================
 * TIME LOGGER SYSTEM (PRODUCTION SAFE VERSION)
 * =====================================================
 */

/* =========================
   RENDER LOGGER UI
========================= */
function renderTimeLogger() {

  const container = document.getElementById("dashboardTimelogsList");
  if (!container) return;

  container.innerHTML = `
    <div id="timeLogger" class="glass-card mb-4">
      <div class="row g-3">

        <div class="col-6">
          <button class="btn btn-success w-100" onclick="logTime('time_in')">Time In</button>
        </div>

        <div class="col-6">
          <button class="btn btn-danger w-100" onclick="logTime('time_out')">Time Out</button>
        </div>

        <div class="col-6">
          <button class="btn btn-warning w-100" onclick="logTime('break_1_start')">B1 Start</button>
        </div>

        <div class="col-6">
          <button class="btn btn-primary w-100" onclick="logTime('break_1_end')">B1 End</button>
        </div>

        <div class="col-6">
          <button class="btn btn-warning w-100" onclick="logTime('break_2_start')">B2 Start</button>
        </div>

        <div class="col-6">
          <button class="btn btn-primary w-100" onclick="logTime('break_2_end')">B2 End</button>
        </div>

        <div class="col-6">
          <button class="btn btn-warning w-100" onclick="logTime('break_3_start')">B3 Start</button>
        </div>

        <div class="col-6">
          <button class="btn btn-primary w-100" onclick="logTime('break_3_end')">B3 End</button>
        </div>

        <div class="col-6">
          <button class="btn btn-dark w-100" onclick="logTime('lunch_start')">Lunch Start</button>
        </div>

        <div class="col-6">
          <button class="btn btn-info w-100" onclick="logTime('lunch_end')">Lunch End</button>
        </div>

      </div>
    </div>
  `;
}

/* =========================
   LOG TIME EVENT
========================= */
function logTime(action) {

  const email = localStorage.getItem("email");
  const workspace_id =
    localStorage.getItem("workspace_id") ||
    document.getElementById("sid")?.value;

  const userId = localStorage.getItem("user_id");

  if (!email || !workspace_id || !userId) {
    showToast?.("Session expired. Please login again.", "error");
    return;
  }

  const payload = {
    user_id: userId,
    email,
    action,
    shift_id: "SHIFT-4",
    device_info: navigator.userAgent,
    location: "home",
    timestamp: new Date().toISOString()
  };

  showLoader?.();

  google.script.run
    .withSuccessHandler((res) => {

      hideLoader?.();

      // =========================
      // STRICT RESPONSE VALIDATION
      // =========================
      if (!res || typeof res !== "object") {
        showToast?.("Invalid server response", "error");
        return;
      }

      if (res.success !== true) {
        showToast?.(res.message || "Action failed", "error");
        return;
      }

      // =========================
      // ONLY TRUE SUCCESS
      // =========================
      showToast?.(res.message || "Logged successfully", "success");

      // OPTIMIZED UI UPDATE
      appendLogToUI?.({
        action,
        timestamp: payload.timestamp
      });

      // background sync
      getLogs();
    })
    .withFailureHandler((err) => {

      hideLoader?.();
      showToast?.(err?.message || "Server error", "error");
    })
    .insertTimeLog(workspace_id, payload);
}

/* =========================
   FETCH LOGS
========================= */
function getLogs() {

  const email = localStorage.getItem("email");
  const workspace_id =
    localStorage.getItem("workspace_id") ||
    document.getElementById("sid")?.value;

  if (!workspace_id || !email) return;

  google.script.run
    .withSuccessHandler((res) => {

      const logs = Array.isArray(res) ? res : [];

      if (!Array.isArray(res)) {
        console.warn("Invalid logs response:", res);
      }

      const state = buildTimeLogState(logs);

      renderTimeLogs(logs);
      renderTimeSummary(state);
    })
    .withFailureHandler((err) => {
      console.error("getLogs error:", err);
    })
    .findTimeLogs(workspace_id, { email });
}

/* =========================
   LOG LIST
========================= */
function renderTimeLogs(logs) {

  const container = document.getElementById("leftTimelogsList");
  if (!container) return;

  if (!Array.isArray(logs) || logs.length === 0) {
    container.innerHTML = `<div class="text-muted-custom">No logs yet</div>`;
    return;
  }

  container.innerHTML = logs.map(log => `
    <div class="d-flex justify-content-between border-bottom py-2">
      <div>${formatLabel(log.action)}</div>
      <div class="text-muted-custom">${formatTimeSafe(log.timestamp)}</div>
    </div>
  `).join("");
}

/* =========================
   SUMMARY
========================= */
function renderTimeSummary(state) {

  const summary = document.getElementById("dashboardSummaryList");
  const statusLabel = document.getElementById("logStatusLabel");

  if (!summary) return;

  state = state || {};

  if (statusLabel) {
    statusLabel.textContent = state.status || "NOT_STARTED";
  }

  const items = [];

  if (state.time_in) {
    items.push(["Time In", formatTimeSafe(state.time_in)]);
  }

  if (state.time_out) {
    items.push(["Time Out", formatTimeSafe(state.time_out)]);
  }

  if (items.length === 0) {
    summary.innerHTML = `<div class="text-muted-custom">No activity yet</div>`;
    return;
  }

  summary.innerHTML = items.map(([label, time]) => `
    <div class="d-flex justify-content-between py-2 border-bottom">
      <span>${label}</span>
      <span class="text-muted-custom">${time}</span>
    </div>
  `).join("");
}

/* =========================
   STATE ENGINE (FIXED BREAK LOGIC)
========================= */
function buildTimeLogState(timeLogs) {

  const state = {
    status: "NOT_STARTED",
    time_in: null,
    time_out: null,
    lunch: {},
    breaks: []
  };

  for (const log of timeLogs) {

    switch (log.action) {

      case "time_in":
        state.time_in = log.timestamp;
        state.status = "WORKING";
        break;

      case "time_out":
        state.time_out = log.timestamp;
        state.status = "CLOCKED_OUT";
        break;

      case "break_1_start":
      case "break_2_start":
      case "break_3_start":
        state.breaks.push({ in: log.timestamp, out: null });
        state.status = "ON BREAK";
        break;

      case "break_1_end":
      case "break_2_end":
      case "break_3_end":
        const lastBreak = state.breaks.findLast(b => !b.out);
        if (lastBreak) lastBreak.out = log.timestamp;
        state.status = "WORKING";
        break;

      case "lunch_start":
        state.lunch.in = log.timestamp;
        state.status = "AT LUNCH";
        break;

      case "lunch_end":
        state.lunch.out = log.timestamp;
        state.status = "WORKING";
        break;
    }
  }

  return state;
}

/* =========================
   APPEND UI (OPTIMIZED)
========================= */
function appendLogToUI(log) {

  const container = document.getElementById("leftTimelogsList");
  if (!container || !log) return;

  const row = document.createElement("div");

  row.className = "d-flex justify-content-between border-bottom py-2";

  row.innerHTML = `
    <div>${formatLabel(log.action)}</div>
    <div class="text-muted-custom">${formatTimeSafe(log.timestamp)}</div>
  `;

  container.prepend(row);
}

/* =========================
   HELPERS
========================= */
function formatTimeSafe(ts) {
  if (!ts) return "--"; 
  const d = new Date(ts);
  return isNaN(d.getTime())
    ? "--"
    : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function formatLabel(action) {
  return (action || "")
    .replaceAll("_", " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

/* =========================
   CACHE
========================= */
function clearAllCache() {
  google.script.run
    .withSuccessHandler(res => console.log(res))
    .clearAllCache();
}

</script>
