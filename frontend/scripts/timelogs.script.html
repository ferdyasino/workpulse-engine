<script>
/**
 * =====================================================
 * DASHBOARD / TIME LOGGER MODULE
 * =====================================================
 */

// =====================================================
// DASHBOARD RESET
// =====================================================

function clearDashboardUI() {
  const dashboardTimelogsList = document.getElementById("dashboardTimelogsList");
  if (dashboardTimelogsList) dashboardTimelogsList.innerHTML = "";

  const leftTimelogsList = document.getElementById("leftTimelogsList");
  if (leftTimelogsList) {
    leftTimelogsList.innerHTML = `<div class="text-muted-custom">No break activity yet</div>`;
  }

  const summaryTimeIn = document.getElementById("summaryTimeIn");
  if (summaryTimeIn) summaryTimeIn.textContent = "--";

  const summaryTimeOut = document.getElementById("summaryTimeOut");
  if (summaryTimeOut) summaryTimeOut.textContent = "--";

  const currWorkStatus = document.getElementById("currWorkStatus");
  if (currWorkStatus) currWorkStatus.textContent = "NOT STARTED";

  const globalStatusText = document.getElementById("globalStatusText");
  if (globalStatusText) globalStatusText.textContent = "NOT STARTED";

  const dot = document.getElementById("statusDot");
  if (dot) {
    dot.className = "status-dot bg-secondary";
  }

  applyBreakButtonState("b1Btn", "AVAILABLE", "B1");
  applyBreakButtonState("b2Btn", "AVAILABLE", "B2");
  applyBreakButtonState("b3Btn", "AVAILABLE", "B3");
}

// =====================================================
// DASHBOARD SYNC
// =====================================================

function syncDashboard() {
  const user = getCurrentUser();
  const email = user.email;
  const workspace_id = user.workspace_id;

  if (!email || !workspace_id) return;

  showLoader?.();

  google.script.run
    .withSuccessHandler((res) => {
      hideLoader?.();

      const logs = Array.isArray(res) ? res : [];
      const state = buildTimeLogState(logs);

      APP.timeLogs = logs;
      APP.attendanceState = state;
      APP.workStatus = state.status || "NOT STARTED";

      renderTimeLogger();
      renderBreakActivity(logs);
      renderGlobalState(state);
      renderTimeSummary(state);
      renderUserHeader();
    })
    .withFailureHandler((err) => {
      hideLoader?.();
      console.error("syncDashboard error:", err);
    })
    .findTimeLogs(workspace_id, { email });
}

// =====================================================
// GLOBAL STATUS RENDER
// =====================================================

window.renderGlobalState = function(state = {}) {
  const statusText = document.getElementById("globalStatusText");
  const dot = document.getElementById("statusDot");

  const currentStatus = String(state.status || "NOT STARTED").toUpperCase();

  if (statusText) {
    statusText.textContent = state.status || "NOT STARTED";
  }

  if (dot) {
    dot.className = "status-dot";

    switch (currentStatus) {
      case "WORKING":
        dot.classList.add("bg-success");
        break;
      case "ON BREAK":
        dot.classList.add("bg-warning");
        break;
      case "AT LUNCH":
        dot.classList.add("bg-info");
        break;
      case "CLOCKED OUT":
        dot.classList.add("bg-danger");
        break;
      default:
        dot.classList.add("bg-secondary");
        break;
    }
  }

  const breaks = Array.isArray(state.breaks) ? state.breaks : [];

  applyBreakButtonState("b1Btn", getBreakButtonState(breaks[0]), "B1");
  applyBreakButtonState("b2Btn", getBreakButtonState(breaks[1]), "B2");
  applyBreakButtonState("b3Btn", getBreakButtonState(breaks[2]), "B3");
};

function getBreakButtonState(breakItem) {
  if (!breakItem) return "AVAILABLE";

  const hasIn = !!breakItem.in;
  const hasOut = !!breakItem.out;

  if (hasIn && hasOut) return "ENDED";
  if (hasIn && !hasOut) return "ACTIVE";

  return "AVAILABLE";
}

function applyBreakButtonState(buttonId, breakState, label) {
  const btn = document.getElementById(buttonId);
  if (!btn) return;

  btn.className = "btn btn-sm";
  btn.disabled = false;
  btn.textContent = label;
  btn.dataset.breakState = breakState;

  switch (breakState) {
    case "ACTIVE":
      btn.classList.add("btn-success");
      break;

    case "ENDED":
      btn.classList.add("btn-break-ended");
      btn.disabled = true;
      break;

    case "AVAILABLE":
    default:
      btn.classList.add("btn-outline-warning");
      break;
  }
}

// =====================================================
// RENDER LOGGER UI
// =====================================================

function renderTimeLogger() {
  const container = document.getElementById("dashboardTimelogsList");
  if (!container) return;

  container.innerHTML = `
    <div id="timeLogger" class="glass-card mb-4">
      <div class="row g-3">

        <div class="col-6">
          <button class="btn btn-success w-100" onclick="logTime('time_in')">Time In</button>
        </div>

        <div class="col-6">
          <button class="btn btn-danger w-100" onclick="logTime('time_out')">Time Out</button>
        </div>

        <div class="col-6">
          <button class="btn btn-warning w-100" onclick="logTime('break_1_start')">B1 Start</button>
        </div>

        <div class="col-6">
          <button class="btn btn-primary w-100" onclick="logTime('break_1_end')">B1 End</button>
        </div>

        <div class="col-6">
          <button class="btn btn-warning w-100" onclick="logTime('break_2_start')">B2 Start</button>
        </div>

        <div class="col-6">
          <button class="btn btn-primary w-100" onclick="logTime('break_2_end')">B2 End</button>
        </div>

        <div class="col-6">
          <button class="btn btn-warning w-100" onclick="logTime('break_3_start')">B3 Start</button>
        </div>

        <div class="col-6">
          <button class="btn btn-primary w-100" onclick="logTime('break_3_end')">B3 End</button>
        </div>

        <div class="col-6">
          <button class="btn btn-dark w-100" onclick="logTime('lunch_start')">Lunch Start</button>
        </div>

        <div class="col-6">
          <button class="btn btn-info w-100" onclick="logTime('lunch_end')">Lunch End</button>
        </div>

      </div>
    </div>
  `;
}

// =====================================================
// LOG TIME EVENT
// =====================================================

function logTime(action) {
  const user = getCurrentUser();

  const email = user.email;
  const workspace_id = user.workspace_id || document.getElementById("sid")?.value;
  const shiftId = user.shift_id;
  const userId = user.user_id;

  if (!email || !workspace_id || !userId) {
    showToast?.("Session expired. Please login again.", "error");
    return;
  }

  const payload = {
    user_id: userId,
    email,
    action,
    shift_id: shiftId,
    device_info: navigator.userAgent,
    location: "home",
    timestamp: new Date().toISOString()
  };

  validate(
    workspace_id,
    payload,
    () => {
      showLoader?.();

      google.script.run
        .withSuccessHandler((res) => {
          hideLoader?.();

          if (!res?.success) {
            showToast?.(res.message || "Action failed", "error");
            return;
          }

          showToast?.(res.message || "Logged successfully", "success");
          getLogs();
        })
        .withFailureHandler((err) => {
          hideLoader?.();
          showToast?.(err?.message || "Server error", "error");
        })
        .insertTimeLog(workspace_id, payload);
    },
    (err) => {
      showToast?.(err?.message || "Validation failed", "error");
    }
  );
}

// =====================================================
// FETCH LOGS
// =====================================================

function getLogs() {
  const user = getCurrentUser();
  const email = user.email;
  const workspace_id = user.workspace_id || document.getElementById("sid")?.value;

  if (!workspace_id || !email) return;

  google.script.run
    .withSuccessHandler((res) => {
      const logs = Array.isArray(res) ? res : [];

      const unique = Array.from(
        new Map(logs.map(log => [`${log.action}_${log.timestamp}`, log])).values()
      );

      const state = buildTimeLogState(unique);

      APP.timeLogs = unique;
      APP.attendanceState = state;
      APP.workStatus = state.status || "NOT STARTED";

      renderTimeSummary(state);
      renderGlobalState(state);
      renderBreakActivity(unique);
      renderUserHeader();
    })
    .withFailureHandler(console.error)
    .findTimeLogs(workspace_id, { email });
}

// =====================================================
// VALIDATION
// =====================================================

function validate(workspace_id, payload, callback, errCallback) {
  google.script.run
    .withSuccessHandler((res) => {
      if (!res) {
        errCallback?.({ message: "Empty response from server" });
        return;
      }

      if (!res.success) {
        errCallback?.(res);
        return;
      }

      callback?.(res);
    })
    .withFailureHandler((err) => {
      console.error("VALIDATION ERROR:", err);

      errCallback?.({
        message: err?.message || "Server error"
      });
    })
    .recordTimeLogAction(workspace_id, payload);
}

// =====================================================
// BREAK ACTIVITY
// =====================================================

function renderBreakActivity(logs) {
  const container = document.getElementById("leftTimelogsList");
  if (!container) return;

  const filtered = logs.filter(log =>
    log.action.startsWith("break_") ||
    log.action.startsWith("lunch_")
  );

  if (filtered.length === 0) {
    container.innerHTML = `<div class="text-muted-custom">No break activity yet</div>`;
    return;
  }

  container.innerHTML = filtered.map(log => `
    <div class="d-flex justify-content-between border-bottom py-2">
      <div>${formatLabel(log.action)}</div>
      <div class="text-muted-custom">${formatTimeSafe(log.timestamp)}</div>
    </div>
  `).join("");
}

// =====================================================
// SUMMARY
// =====================================================

function renderTimeSummary(state) {
  const currWorkStatus = document.getElementById("currWorkStatus");
  const summaryTimeIn = document.getElementById("summaryTimeIn");
  const summaryTimeOut = document.getElementById("summaryTimeOut");

  if (summaryTimeIn) {
    summaryTimeIn.textContent = state.time_in
      ? formatTimeSafe(state.time_in)
      : "--";
  }

  if (summaryTimeOut) {
    summaryTimeOut.textContent = state.time_out
      ? formatTimeSafe(state.time_out)
      : "--";
  }

  if (currWorkStatus) {
    currWorkStatus.textContent = state.status || "NOT STARTED";
  }
}

// =====================================================
// STATE ENGINE
// =====================================================

function buildTimeLogState(timeLogs) {
  const state = {
    status: "NOT_STARTED",
    time_in: null,
    time_out: null,
    lunch: {},
    breaks: []
  };

  for (const log of timeLogs) {
    switch (log.action) {
      case "time_in":
        state.time_in = log.timestamp;
        state.status = "WORKING";
        break;

      case "time_out":
        state.time_out = log.timestamp;
        state.status = "CLOCKED OUT";
        break;

      case "break_1_start":
      case "break_2_start":
      case "break_3_start":
        state.breaks.push({ in: log.timestamp, out: null });
        state.status = "ON BREAK";
        break;

      case "break_1_end":
      case "break_2_end":
      case "break_3_end": {
        const lastBreak = state.breaks.findLast(b => !b.out);
        if (lastBreak) lastBreak.out = log.timestamp;
        state.status = "WORKING";
        break;
      }

      case "lunch_start":
        state.lunch.in = log.timestamp;
        state.status = "AT LUNCH";
        break;

      case "lunch_end":
        state.lunch.out = log.timestamp;
        state.status = "WORKING";
        break;
    }
  }

  return state;
}

// =====================================================
// HELPERS
// =====================================================

function formatTimeSafe(ts) {
  if (!ts) return "--";

  const d = new Date(ts);
  return isNaN(d.getTime())
    ? "--"
    : d.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
}

function formatLabel(action) {
  return (action || "")
    .replaceAll("_", " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}
</script>
