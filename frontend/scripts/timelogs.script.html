function getLogs() {

  const email = localStorage.getItem("email");
  const workspaceId =
    localStorage.getItem("workspaceId") ||
    document.getElementById("sid").value;

    console.log("email",email);
    console.log("workspaceId",workspaceId);

    google.script.run
      .withSuccessHandler((res) => {
       console.log("timeLogs",{res});
       const state = buildTimeLogState(res);
        renderTimeLogs(res);
        renderTimeSummary(state);

        const newLog = res;
        appendLogToUI(newLog);
      })
      .findTimeLogs(workspaceId,{email});
}


function renderTimeLogs(logs) {

  const container =
    document.getElementById("leftTimelogsList");

  if (!container) return;

  if (!logs.length) {
    container.innerHTML =
      `<div class="text-muted-custom">No logs yet</div>`;
    return;
  }

  container.innerHTML = logs.map(log => `
    <div class="d-flex justify-content-between border-bottom py-2">
      <div>${log.action}</div>
      <div class="text-muted-custom">
        ${new Date(log.timestamp)
          .toLocaleTimeString()}
      </div>
    </div>
  `).join("");

}

function renderTimeSummary(state) {

  const summary = document.getElementById("dashboardSummaryList");
  const statusLabel = document.getElementById("logStatusLabel");

  if (!summary) return;

  state = state || {};

  if (statusLabel) {
    statusLabel.textContent = state.status || "NOT_STARTED";
  }

  const items = [];

  if (state.time_in) {
    items.push(["Time In", formatTime(state.time_in)]);
  }

  if (state.lunch?.in) {
    items.push(["Lunch Start", formatTime(state.lunch.in)]);
  }

  if (state.lunch?.out) {
    items.push(["Lunch End", formatTime(state.lunch.out)]);
  }

  (state.breaks || []).forEach((b, i) => {
    items.push([`Break ${i + 1} Start`, formatTime(b.in)]);
    if (b.out) {
      items.push([`Break ${i + 1} End`, formatTime(b.out)]);
    }
  });

  if (state.time_out) {
    items.push(["Time Out", formatTime(state.time_out)]);
  }

  if (items.length === 0) {
    summary.innerHTML = `<div class="text-muted-custom">No activity yet</div>`;
    return;
  }

  summary.innerHTML = items.map(([label, time]) => `
    <div class="d-flex justify-content-between py-2 border-bottom">
      <span>${label}</span>
      <span class="text-muted-custom">${time}</span>
    </div>
  `).join("");
}

function buildTimeLogState(timeLogs) {

  const state = {
    status: "NOT_STARTED",
    time_in: null,
    time_out: null,
    lunch: {},
    breaks: []
  };

  let currentBreak = null;

  timeLogs.forEach(log => {

    switch (log.action) {

      case "time_in":
        state.time_in = log.timestamp;
        state.status = "WORKING";
        break;

      case "break_in":
        currentBreak = {
          in: log.timestamp,
          out: null
        };

        state.breaks.push(currentBreak);
        state.status = "ON_BREAK";
        break;

      case "break_out":
        if (currentBreak) {
          currentBreak.out = log.timestamp;
        }
        state.status = "WORKING";
        break;

      case "lunch_in":
        state.lunch.in = log.timestamp;
        state.status = "AT_LUNCH";
        break;

      case "lunch_out":
        state.lunch.out = log.timestamp;
        state.status = "WORKING";
        break;

      case "time_out":
        state.time_out = log.timestamp;
        state.status = "CLOCKED_OUT";
        break;
    }

  });

  return state;
}

function appendLogToUI(log) {

  const container =
    document.getElementById("leftTimelogsList");

  if (!container) return;

  const row = document.createElement("div");

  row.className =
    "d-flex justify-content-between border-bottom py-2";

  row.innerHTML = `
    <div>${log.action}</div>
    <div class="text-muted-custom">
      ${new Date(log.timestamp).toLocaleTimeString()}
    </div>
  `;

  container.prepend(row);
}

</script>
