<script>
/**
 * =====================================================
 * DASHBOARD / TIME LOGGER MODULE
 * GLOBAL-HELPER-ONLY + BUTTONS-ONLY LOGGER + DYNAMIC BREAK STATE
 * =====================================================
 */

// =====================================================
// DASHBOARD RESET
// =====================================================

function clearDashboardUI() {
  const dashboardTimelogsList = document.getElementById("dashboardTimelogsList");
  if (dashboardTimelogsList) {
    dashboardTimelogsList.innerHTML = `<div class="text-muted-custom">No logs yet</div>`;
  }

  const leftTimelogsList = document.getElementById("leftTimelogsList");
  if (leftTimelogsList) {
    leftTimelogsList.innerHTML = `<div class="text-muted-custom">No break activity yet</div>`;
  }

  const summaryTimeIn = document.getElementById("summaryTimeIn");
  if (summaryTimeIn) summaryTimeIn.textContent = "--";

  const summaryTimeOut = document.getElementById("summaryTimeOut");
  if (summaryTimeOut) summaryTimeOut.textContent = "--";

  const globalStatusText = document.getElementById("globalStatusText");
  if (globalStatusText) globalStatusText.textContent = "NOT STARTED";

  const dot = document.getElementById("statusDot");
  if (dot) {
    dot.className = "status-dot bg-secondary";
  }

  applyBreakButtonState("b1Btn", "AVAILABLE", "B1");
  applyBreakButtonState("b2Btn", "AVAILABLE", "B2");
  applyBreakButtonState("b3Btn", "AVAILABLE", "B3");
}

// =====================================================
// DASHBOARD SYNC
// =====================================================

function syncDashboard() {
  const user = getCurrentUser();
  const email = user?.email;
  const workspace_id = user?.workspace_id;

  if (!email || !workspace_id) return;

  showLoader?.();

  google.script.run
    .withSuccessHandler((res) => {
      hideLoader?.();

      const logs = dedupeTimeLogs(Array.isArray(res) ? res : []);
      const state = buildTimeLogState(logs);

      APP.timeLogs = logs;
      APP.attendanceState = state;
      APP.workStatus = state.status || "NOT STARTED";

      renderTimeLogger();
      renderTimeline(state, logs); // now buttons only
      renderBreakActivity(state);
      renderGlobalState(state);
      renderTimeSummary(state);
      renderUserHeader?.();
    })
    .withFailureHandler((err) => {
      hideLoader?.();
      console.error("syncDashboard error:", err);
    })
    .findTimeLogs(workspace_id, { email });
}

// =====================================================
// GLOBAL STATUS RENDER
// =====================================================

window.renderGlobalState = function(state = {}) {
  const statusText = document.getElementById("globalStatusText");
  const dot = document.getElementById("statusDot");

  const currentStatus = String(state.status || "NOT STARTED").trim().toUpperCase();

  if (statusText) {
    statusText.textContent = DISPLAY.status(state.status || "NOT STARTED");
  }

  if (dot) {
    dot.className = "status-dot";

    switch (currentStatus) {
      case "WORKING":
        dot.classList.add("bg-success");
        break;
      case "ON BREAK":
        dot.classList.add("bg-warning");
        break;
      case "AT LUNCH":
        dot.classList.add("bg-info");
        break;
      case "CLOCKED OUT":
        dot.classList.add("bg-danger");
        break;
      default:
        dot.classList.add("bg-secondary");
        break;
    }
  }

  const breaks = Array.isArray(state.breaks) ? state.breaks : [];

  applyBreakButtonState("b1Btn", getBreakButtonState(breaks[0]), "B1");
  applyBreakButtonState("b2Btn", getBreakButtonState(breaks[1]), "B2");
  applyBreakButtonState("b3Btn", getBreakButtonState(breaks[2]), "B3");
};

function getBreakButtonState(breakItem) {
  if (!breakItem) return "AVAILABLE";

  const hasIn = !!breakItem.in;
  const hasOut = !!breakItem.out;

  if (hasIn && hasOut) return "ENDED";
  if (hasIn && !hasOut) return "ACTIVE";

  return "AVAILABLE";
}

function applyBreakButtonState(buttonId, breakState, label) {
  const btn = document.getElementById(buttonId);
  if (!btn) return;

  btn.className = "btn btn-sm";
  btn.disabled = false;
  btn.textContent = label;
  btn.dataset.breakState = breakState;

  switch (breakState) {
    case "ACTIVE":
      btn.classList.add("btn-success");
      break;

    case "ENDED":
      btn.classList.add("btn-break-ended");
      btn.disabled = true;
      break;

    case "AVAILABLE":
    default:
      btn.classList.add("btn-outline-warning");
      break;
  }
}

// =====================================================
// LOGGER BUTTONS HTML
// =====================================================

function getTimeLoggerHtml() {
  return `
    <div id="timeLogger" class="glass-card mb-4">
      <div class="row g-3">

        <div class="col-6">
          <button class="btn btn-success w-100" onclick="logTime('time_in')">Time In</button>
        </div>

        <div class="col-6">
          <button class="btn btn-danger w-100" onclick="logTime('time_out')">Time Out</button>
        </div>

        <div class="col-6">
          <button id="b1Btn" class="btn btn-outline-warning w-100" onclick="logTime('break_1_start')">B1</button>
        </div>

        <div class="col-6">
          <button class="btn btn-primary w-100" onclick="logTime('break_1_end')">B1 End</button>
        </div>

        <div class="col-6">
          <button id="b2Btn" class="btn btn-outline-warning w-100" onclick="logTime('break_2_start')">B2</button>
        </div>

        <div class="col-6">
          <button class="btn btn-primary w-100" onclick="logTime('break_2_end')">B2 End</button>
        </div>

        <div class="col-6">
          <button id="b3Btn" class="btn btn-outline-warning w-100" onclick="logTime('break_3_start')">B3</button>
        </div>

        <div class="col-6">
          <button class="btn btn-primary w-100" onclick="logTime('break_3_end')">B3 End</button>
        </div>

        <div class="col-6">
          <button class="btn btn-dark w-100" onclick="logTime('lunch_start')">Lunch Start</button>
        </div>

        <div class="col-6">
          <button class="btn btn-info w-100" onclick="logTime('lunch_end')">Lunch End</button>
        </div>

      </div>
    </div>
  `;
}

function renderTimeLogger() {
  const container = document.getElementById("dashboardTimelogsList");
  if (!container) return;
  container.innerHTML = getTimeLoggerHtml();
}

// =====================================================
// LOG TIME EVENT
// =====================================================

async function logTime(action) {
  const user = getCurrentUser();

  const email = user?.email;
  const workspace_id = user?.workspace_id || document.getElementById("sid")?.value;
  const shiftId = user?.shift_id;
  const userId = user?.user_id;

  if (!email || !workspace_id || !userId) {
    showToast?.("Session expired. Please login again.", "error");
    return;
  }

  showLoader?.();

  const geo = await getCurrentLocation();

  if (!geo.success) {
    console.warn("Geolocation failed:", geo.status, geo.message);
  }

  const payload = {
    user_id: userId,
    email,
    action,
    shift_id: shiftId,
    device_info: navigator.userAgent,
    location: geo.location,
    location_status: geo.status,
    location_message: geo.message,
    timestamp: new Date().toISOString()
  };

  validate(
    workspace_id,
    payload,
    () => {
      google.script.run
        .withSuccessHandler((res) => {
          hideLoader?.();

          if (!res?.success) {
            showToast?.(res.message || "Action failed", "error");
            return;
          }

          showToast?.(res.message || "Logged successfully", "success");
          getLogs();
        })
        .withFailureHandler((err) => {
          hideLoader?.();
          showToast?.(err?.message || "Server error", "error");
        })
        .insertTimeLog(workspace_id, payload);
    },
    (err) => {
      hideLoader?.();
      showToast?.(err?.message || "Validation failed", "error");
    }
  );
}

// =====================================================
// FETCH LOGS
// =====================================================

function getLogs() {
  const user = getCurrentUser();
  const email = user?.email;
  const workspace_id = user?.workspace_id || document.getElementById("sid")?.value;

  if (!workspace_id || !email) return;

  google.script.run
    .withSuccessHandler((res) => {
      const logs = dedupeTimeLogs(Array.isArray(res) ? res : []);
      const state = buildTimeLogState(logs);

      APP.timeLogs = logs;
      APP.attendanceState = state;
      APP.workStatus = state.status || "NOT STARTED";

      renderTimeline(state, logs); // buttons only
      renderTimeSummary(state);
      renderGlobalState(state);
      renderBreakActivity(state);
      renderUserHeader?.();
    })
    .withFailureHandler(console.error)
    .findTimeLogs(workspace_id, { email });
}

// =====================================================
// VALIDATION
// =====================================================

function validate(workspace_id, payload, callback, errCallback) {
  google.script.run
    .withSuccessHandler((res) => {
      if (!res) {
        errCallback?.({ message: "Empty response from server" });
        return;
      }

      if (!res.success) {
        errCallback?.(res);
        return;
      }

      callback?.(res);
    })
    .withFailureHandler((err) => {
      console.error("VALIDATION ERROR:", err);
      errCallback?.({
        message: err?.message || "Server error"
      });
    })
    .recordTimeLogAction(workspace_id, payload);
}

// =====================================================
// BREAK ACTIVITY
// DYNAMIC / UNLIMITED BREAK DISPLAY
// =====================================================

function renderBreakActivity(state = {}) {
  const container = document.getElementById("leftTimelogsList");
  if (!container) return;

  const breaks = Array.isArray(state.breaks) ? state.breaks : [];
  const lunch = state.lunch || {};

  const rows = [
    ...breaks.map((item, index) => ({
      label: item?.key || `B${index + 1}`,
      in: item?.in || null,
      out: item?.out || null
    })),
    {
      label: "Lunch",
      in: lunch.in || null,
      out: lunch.out || null
    }
  ].filter(row => row.in || row.out);

  if (!rows.length) {
    container.innerHTML = `<div class="text-muted-custom">No break activity yet</div>`;
    return;
  }

  container.innerHTML = rows.map(row => `
    <div class="border-bottom py-2">
      <div class="fw-semibold">${escapeHtml(row.label)}</div>
      <div class="small text-muted-custom mt-1">
        In: ${escapeHtml(formatTime(row.in))}
        <span class="mx-2">•</span>
        Out: ${escapeHtml(formatTime(row.out))}
      </div>
    </div>
  `).join("");
}

// =====================================================
// SUMMARY
// =====================================================

function renderTimeSummary(state = {}) {
  const summaryTimeIn = document.getElementById("summaryTimeIn");
  const summaryTimeOut = document.getElementById("summaryTimeOut");
  const globalStatusText = document.getElementById("globalStatusText");

  if (summaryTimeIn) {
    summaryTimeIn.textContent = state.time_in ? formatTime(state.time_in) : "--";
  }

  if (summaryTimeOut) {
    summaryTimeOut.textContent = state.time_out ? formatTime(state.time_out) : "--";
  }

  if (globalStatusText) {
    globalStatusText.textContent = DISPLAY.status(state.status || "NOT STARTED");
  }
}

// =====================================================
// TIMELINE
// BUTTONS ONLY NOW
// =====================================================

function renderTimeline(state = {}, logs = []) {
  const container = document.getElementById("dashboardTimelogsList");
  if (!container) return;

  container.innerHTML = getTimeLoggerHtml();
}

// =====================================================
// STATE ENGINE
// DYNAMIC BREAK SUPPORT
// =====================================================

function buildTimeLogState(timeLogs = []) {
  const state = {
    status: "NOT STARTED",
    time_in: null,
    time_out: null,
    lunch: {
      in: null,
      out: null
    },
    breaks: []
  };

  for (const log of (Array.isArray(timeLogs) ? timeLogs : [])) {
    const action = String(log?.action || "").trim();
    const timestamp = log?.timestamp || null;

    if (action === "time_in") {
      state.time_in = timestamp;
      state.status = "WORKING";
      continue;
    }

    if (action === "time_out") {
      state.time_out = timestamp;
      state.status = "CLOCKED OUT";
      continue;
    }

    if (action === "lunch_start") {
      state.lunch.in = timestamp;
      state.status = "AT LUNCH";
      continue;
    }

    if (action === "lunch_end") {
      state.lunch.out = timestamp;
      state.status = "WORKING";
      continue;
    }

    const breakMatch = action.match(/^break_(\d+)_(start|end)$/);
    if (breakMatch) {
      const breakNumber = Number(breakMatch[1]);
      const breakIndex = breakNumber - 1;
      const breakType = breakMatch[2];

      if (!state.breaks[breakIndex]) {
        state.breaks[breakIndex] = {
          key: `B${breakNumber}`,
          in: null,
          out: null
        };
      }

      if (breakType === "start") {
        state.breaks[breakIndex].in = timestamp;
        state.status = "ON BREAK";
      } else {
        state.breaks[breakIndex].out = timestamp;
        state.status = "WORKING";
      }
    }
  }

  state.breaks = state.breaks.filter(Boolean);

  if (state.time_out) {
    state.status = "CLOCKED OUT";
  }

  return state;
}

// =====================================================
// HELPERS
// =====================================================

function dedupeTimeLogs(logs = []) {
  return Array.from(
    new Map(
      (Array.isArray(logs) ? logs : []).map(log => [
        `${log?.action || ""}_${log?.timestamp || ""}`,
        log
      ])
    ).values()
  );
}
</script>
