<script>
  const PositionModal = (() => {
    function getDepartments(config) {
      return Array.isArray(config.departments) ? config.departments : [];
    }
    function openListModal(config = {}) {
      const departments = getDepartments(config);
      GlobalModal.openList({
        title: "Positions",
        items: (state.positions || []).map((p) => ({
          id: p.position_id,
          label: p.position_name,
          description:
            departments.find((d) => d.department_id === p.department_id)?.department_name || "-",
          onClick: () => {
            GlobalModal.hide("globalListModal");
            config.onSelect?.(p);
          },
        })),
      });
    }

    function openCreateModal(position = {}, config = {}) {
      const departments = getDepartments(config);

      GlobalModal.openForm({
        title: position.position_id ? "Edit Position" : "Create Position",

        fields: [
          {
            name: "position_name",
            label: "Position Name",
            value: position.position_name || "",
            required: true,
            col: "col-md-12",
          },

          {
            name: "department_id",
            label: "Department",
            type: "select",
            required: true,

            options: departments.map((d) => ({
              value: d.department_id,
              label: d.department_name,
            })),

            value: position.department_id || "",
          },

          {
            name: "description",
            label: "Description",
            type: "textarea",
            value: position.description || "",
            col: "col-md-12",
          },
        ],

        onSubmit: (formData) => {
          config.onSubmit?.(formData, position);
        },
      });
    }

    function openEditModal(position, handlers = {}) {
      openCreateModal(position, handlers);
    }

    function openDeleteModal(position, handlers = {}) {
      GlobalModal.openConfirm({
        title: "Delete Position",
        message: `Are you sure you want to delete the position "${position.position_name}"? This action cannot be undone.`,
        onConfirm: () => {
          handlers.onConfirm?.(position);
        },
      });
    }

    function closeFormModal() {
      GlobalModal.hide("globalFormModal");
    }

    return {
      openListModal,
      openCreateModal,
      openEditModal,
      openDeleteModal,
      closeFormModal,
    };
  })();
</script>
