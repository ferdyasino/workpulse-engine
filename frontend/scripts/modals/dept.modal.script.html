<script>
  const DepartmentModal = (() => {
    // =====================================================
    // LIST MODAL
    // =====================================================

    function openListModal(config = {}) {
      GlobalModal.openList({
        title: "Department Records",

        columns: ["Department", "Description"],

        onAdd: () => {
          openCreateModal({}, config);
        },

        onMount: config.onMount || null,
      });
    }

    // =====================================================
    // CREATE / EDIT MODAL
    // =====================================================

    function openCreateModal(dept = {}, config = {}) {
      GlobalModal.openForm({
        title: dept.department_id ? "Edit Department" : "Create Department",

        fields: [
          {
            name: "department_name",
            label: "Department Name",
            value: dept.department_name || "",
            required: true,
            col: "col-md-12",
          },

          {
            name: "description",
            label: "Description",
            type: "textarea",
            value: dept.description || "",
            col: "col-md-12",
          },
        ],

        onSubmit: (formData) => {
          config.onSubmit?.(formData, dept);
        },
      });
    }

    // =====================================================
    // EDIT WRAPPER
    // =====================================================

    function openEditModal(dept, handlers = {}) {
      openCreateModal(dept, handlers);
    }

    function closeFormModal() {
      GlobalModal.hide("globalFormModal");
    }

    // =====================================================
    // DELETE MODAL
    // =====================================================

    function openDeleteModal(id, handlers = {}) {
      GlobalModal.openDelete({
        title: "Department Action",
        message: "Choose whether to deactivate or permanently delete this department.",
        id,
        onDelete: handlers.onDelete,
        onDeactivate: handlers.onDeactivate,
      });
    }

    // =====================================================
    // PUBLIC API
    // =====================================================

    return {
      openListModal,
      openCreateModal,
      openEditModal,
      openDeleteModal,
      closeFormModal,
    };
  })();
</script>
