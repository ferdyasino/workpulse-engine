<script>
  const UsersModal = (() => {
    // =====================================================
    // LIST MODAL
    // =====================================================

    function openListModal(config = {}) {
      GlobalModal.openList({
        title: "Employee Records",

        columns: [
          "Employee No",
          "Full Name",
          "Email",
          "Department",
          "Position",
          "Shift",
          "Status",
        ],

        onAdd: () => {
          openCreateModal({}, config);
        },

        onMount: config.onMount || null,
      });
    }

    // =====================================================
    // CREATE / EDIT MODAL
    // =====================================================

    function openCreateModal(user = {}, config = {}) {
      GlobalModal.openForm({
        title: user.user_id ? "Edit Employee" : "Create Employee",

        fields: [
          {
            name: "fullname",
            label: "Full Name",
            value: user.fullname || "",
          },

          {
            name: "email",
            label: "Email",
            type: "email",
            value: user.email || "",
          },

          {
            name: "department_id",
            label: "Department",
            type: "select",
            options: (config.departments || []).map((d) => ({
              value: d.department_id,
              label: d.department_name,
            })),
            value: user.department_id || config.selectedDepartmentId || "",
            onAdd: true,
          },

          {
            name: "position_id",
            label: "Position",
            type: "select",
            options: (config.positions || []).map((p) => ({
              value: p.position_id,
              label: p.position_name,
            })),
            value: user.position_id || config.selectedPositionId || "",
            onAdd: true,
          },

          {
            name: "shift_id",
            label: "Shift",
            type: "select",
            options: (config.shifts || []).map((s) => ({
              value: s.shift_id,
              label: window.formatShiftLabel(s),
            })),
            value: user.shift_id || config.selectedShiftId || "",
            onAdd: true,
          },
          {
            name: "status",
            label: "Status",
            type: "select",
            options: [
              { value: "ACTIVE", label: "Active" },
              { value: "INACTIVE", label: "Inactive" },
            ],
            value: user.status || "",
          },
        ],

        onAddField: (fieldName, e) => {
          config.onAddField?.(fieldName, e);
        },

        onSubmit: (formData) => {
          config.onSubmit?.(formData, user);
        },
      });
    }

    // =====================================================
    // EDIT WRAPPER
    // =====================================================

    function openEditModal(emp, handlers = {}) {
      openCreateModal(emp, handlers);
    }

    function closeFormModal() {
      GlobalModal.hide("globalFormModal");
    }

    // =====================================================
    // DELETE MODAL
    // =====================================================

    function openDeleteModal(id, handlers = {}) {
      GlobalModal.openDelete({
        title: "Employee Action",
        message:
          "Choose whether to deactivate or permanently delete this employee.",
        id,
        onDelete: handlers.onDelete,
        onDeactivate: handlers.onDeactivate,
      });
    }

    // =====================================================
    // PUBLIC API
    // =====================================================

    return {
      openListModal,
      openCreateModal,
      openEditModal,
      openDeleteModal,
      closeFormModal,
    };
  })();
</script>
