<script>
const UsersModal = (() => {

  // =====================================================
  // LIST MODAL (PURE CONFIG)
  // =====================================================

  function openListModal(config = {}) {

    GlobalModal.openList({
      title: "Employee Records",

      columns: [
        "Employee No",
        "Full Name",
        "Email",
        "Role",
        "Department",
        "Shift",
        "Status"
      ],

      onAdd: () => {
        openCreateModal();
      },

      onMount: config.onMount || null
    });
  }

  // =====================================================
  // CREATE / EDIT MODAL (NO BUSINESS LOGIC)
  // =====================================================

  function openCreateModal(user = {}, config = {}) {

  GlobalModal.openForm({
    title: user.user_id
      ? "Edit Employee"
      : "Create Employee",

    fields: [
      {
        name: "fullname",
        label: "Full Name",
        value: user.fullname || ""
      },

      {
        name: "email",
        label: "Email",
        type: "email",
        value: user.email || ""
      },

      {
        name: "role",
        label: "Role",
        type: "select",
        options: [
          { value: "employee", label: "Employee" },
          { value: "admin", label: "Admin" }
        ],
        value: user.role || "employee"
      },

      {
        name: "department_id",
        label: "Department",
        type: "select",
        options: (config.departments || []).map(d => ({
          value: d.department_id,
          label: d.department_name
        })),
        value: user.department_id || ""
      },

      {
        name: "position_id",
        label: "Position",
        type: "select",
        options: (config.positions || []).map(p => ({
          value: p.position_id,
          label: p.position_name
        })),
        value: user.position_id || ""
      },

      {
        name: "shift_id",
        label: "Shift",
        type: "select",
        options: (config.shifts || []).map(s => ({
          value: s.shift_id,
          label: s.shift_name
        })),
        value: user.shift_id || ""
      }
    ],

    onSubmit: (formData) => {
      config.onSubmit?.(formData, user);
    }
  });
}
  // =====================================================
  // EDIT (WRAPPER ONLY)
  // =====================================================

  function openEditModal(emp, handlers = {}) {
    openCreateModal(emp, handlers);
  }

  // =====================================================
  // DELETE (CONFIG ONLY)
  // =====================================================

  function openDeleteModal(id, handlers = {}) {

    GlobalModal.openDelete({
      title: "Deactivate Employee",
      message: "This action cannot be undone.",
      id,

      onConfirm: () => {
        if (typeof handlers.onConfirm === "function") {
          handlers.onConfirm(id);
        }
      }
    });
  }

  // =====================================================
  // PUBLIC API
  // =====================================================

  return {
    openListModal,
    openCreateModal,
    openEditModal,
    openDeleteModal
  };

})();
</script>
