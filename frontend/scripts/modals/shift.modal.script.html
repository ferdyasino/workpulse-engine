<script>
  const ShiftModal = (() => {
    function openCreateModal(shift = {}, config = {}) {
      const isEdit = Boolean(shift?.shift_id || config.isEdit);
      const showStatus = config.showStatus ?? isEdit;

      const fields = [
        {
          name: "shift_name",
          label: "Shift Name",
          value: shift.shift_name || "",
          required: true,
        },

        {
          name: "start_time",
          label: "Start Time",
          type: "time",
          value: shift.start_time || "",
          required: true,
        },

        {
          name: "end_time",
          label: "End Time",
          type: "time",
          value: shift.end_time || "",
          required: true,
        },

        {
          name: "grace_minutes",
          label: "Grace Minutes",
          type: "number",
          value: shift.grace_minutes ?? 10,
          required: false,
        },
      ];

      if (showStatus) {
        fields.push({
          name: "status",
          label: "Status",
          type: "select",
          value: shift.status || "ACTIVE",
          options: [
            { value: "ACTIVE", label: "Active" },
            { value: "INACTIVE", label: "Inactive" },
          ],
        });
      }

      GlobalModal.openForm({
        title: isEdit ? "Edit Shift" : "Create Shift",
        fields,

        onSubmit: (formData) => {
          const payload = {
            ...formData,
            shift_name: String(formData.shift_name || "").trim(),
            start_time: String(formData.start_time || "").trim(),
            end_time: String(formData.end_time || "").trim(),
            grace_minutes:
              formData.grace_minutes === "" || formData.grace_minutes == null
                ? 10
                : Number(formData.grace_minutes),
            status: formData.status || "ACTIVE",
          };

          config.onSubmit?.(payload, shift);
        },
      });
    }

    function closeFormModal() {
      GlobalModal.hide("globalFormModal");
    }

    return {
      openCreateModal,
      closeFormModal,
    };
  })();
</script>
