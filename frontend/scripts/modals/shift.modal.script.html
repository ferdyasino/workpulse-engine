<script>
  const ShiftModal = (() => {
    function openListModal(config = {}) {
      GlobalModal.openList({
        title: "Shift Records",

        columns: ["Shift", "Schedule", "Grace (mins)", "Status"],

        onAdd: () => {
          openCreateModal({}, config);
        },

        onMount: config.onMount || null,
      });
    }

    function openCreateModal(shift = {}, config = {}) {
      const normalizedShift = window.normalizeShift(shift);
      const isEdit = Boolean(shift?.shift_id || config.isEdit);
      const showStatus = config.showStatus ?? isEdit;

      const fields = [
        {
          name: "shift_name",
          label: "Shift Name",
          value: normalizedShift.shift_name || "",
          required: true,
        },

        {
          name: "start_time",
          label: "Start Time",
          type: "time",
          value: normalizedShift.start_time,
          required: true,
        },

        {
          name: "end_time",
          label: "End Time",
          type: "time",
          value: normalizedShift.end_time,
          required: true,
        },

        {
          name: "grace_minutes",
          label: "Grace Minutes",
          type: "number",
          value: normalizedShift.grace_minutes,
          required: false,
        },
      ];

      if (showStatus) {
        fields.push({
          name: "status",
          label: "Status",
          type: "select",
          value: normalizedShift.status || "ACTIVE",
          options: [
            { value: "ACTIVE", label: "Active" },
            { value: "INACTIVE", label: "Inactive" },
          ],
        });
      }

      GlobalModal.openForm({
        title: isEdit ? "Edit Shift" : "Create Shift",
        fields,

        onSubmit: (formData) => {
          const payload = {
            ...formData,
            shift_name: String(formData.shift_name || "").trim(),
            start_time: String(formData.start_time || "").trim(),
            end_time: String(formData.end_time || "").trim(),
            grace_minutes:
              formData.grace_minutes === "" || formData.grace_minutes == null
                ? 10
                : Number(formData.grace_minutes),
            status: formData.status || "ACTIVE",
          };

          config.onSubmit?.(payload, shift);
        },
      });
    }

    function openEditModal(shift, handlers = {}) {
      openCreateModal(shift, handlers);
    }

    function openDeleteModal(shift, handlers = {}) {
      GlobalModal.openDelete({
        title: "Shift Action",
        message: "Choose whether to deactivate or permanently delete this shift.",
        id: shift.shift_id,
        onDelete: handlers.onDelete,
        onDeactivate: handlers.onDeactivate,
      });
    }

    function closeFormModal() {
      GlobalModal.hide("globalFormModal");
    }

    function closeListModal() {
      const body = document.getElementById("globalListBody");
      if (body) {
        body.innerHTML = "";
      }

      GlobalModal.hide("globalListModal");
    }

    return {
      openListModal,
      openCreateModal,
      openEditModal,
      openDeleteModal,
      closeFormModal,
      closeListModal,
    };
  })();
</script>
