<script>
  const SettingsModal = (() => {
    function getWorkspaceId() {
      const id = APP.user?.workspace_id || localStorage.getItem("workspace_id");

      if (!id) {
        throw new Error("Workspace not found");
      }

      return id;
    }

    function open(settings = {}) {
      GlobalModal.openForm({
        title: "Settings",

        fields: [
          {
            name: SETTINGS_KEYS.TIMEZONE,
            label: "Timezone",
            value: settings[SETTINGS_KEYS.TIMEZONE] || "Asia/Manila",
            required: true,
          },

          {
            name: SETTINGS_KEYS.PERIOD_TYPE_DEFAULT,
            label: "Default Payroll Period",
            type: "select",
            value: settings[SETTINGS_KEYS.PERIOD_TYPE_DEFAULT] || "DAILY",
            options: [
              { value: "DAILY", label: "Daily" },
              { value: "WEEKLY", label: "Weekly" },
              { value: "BI_WEEKLY", label: "Bi-Weekly" },
              { value: "MONTHLY", label: "Monthly" },
            ],
          },

          {
            name: SETTINGS_KEYS.BREAK_MAX_PER_DAY,
            label: "Max Breaks Per Day",
            type: "number",
            value: settings[SETTINGS_KEYS.BREAK_MAX_PER_DAY] ?? 2,
          },

          {
            name: SETTINGS_KEYS.BREAK_MINUTES_PER_DAY,
            label: "Max Break Minutes Per Day",
            type: "number",
            value: settings[SETTINGS_KEYS.BREAK_MINUTES_PER_DAY] ?? 60,
          },

          {
            name: SETTINGS_KEYS.LATE_GRACE_MINUTES_DEFAULT,
            label: "Default Grace Minutes",
            type: "number",
            value: settings[SETTINGS_KEYS.LATE_GRACE_MINUTES_DEFAULT] ?? 10,
          },

          {
            name: SETTINGS_KEYS.REQUIRE_TIME_OUT,
            label: "Require Time Out",
            type: "select",
            value: settings[SETTINGS_KEYS.REQUIRE_TIME_OUT] ?? "true",
            options: [
              { value: "true", label: "Required" },
              { value: "false", label: "Optional" },
            ],
          },
        ],

        onSubmit: (formData) => {
          const workspace_id = getWorkspaceId();

          // normalize numeric fields BEFORE sending
          const payload = {
            ...formData,
            [SETTINGS_KEYS.BREAK_MAX_PER_DAY]: Number(
              formData[SETTINGS_KEYS.BREAK_MAX_PER_DAY] || 0,
            ),

            [SETTINGS_KEYS.BREAK_MINUTES_PER_DAY]: Number(
              formData[SETTINGS_KEYS.BREAK_MINUTES_PER_DAY] || 0,
            ),

            [SETTINGS_KEYS.LATE_GRACE_MINUTES_DEFAULT]: Number(
              formData[SETTINGS_KEYS.LATE_GRACE_MINUTES_DEFAULT] || 0,
            ),
          };

          google.script.run
            .withSuccessHandler(() => {
              showToast("Settings updated", "success");
              GlobalModal.hide("globalFormModal");
            })
            .withFailureHandler((err) => {
              showToast(err.message || "Update failed", "error");
            })
            .updateWorkspaceSettings(workspace_id, payload);
        },
      });
    }

    function close() {
      GlobalModal.hide("globalFormModal");
    }

    return { open, close };
  })();

  function openSettingsModal() {
    const workspace_id =
      APP.user?.workspace_id || localStorage.getItem("workspace_id");

    if (!workspace_id) {
      showToast("Workspace not found", "error");
      return;
    }

    google.script.run
      .withSuccessHandler((settings) => {
        SettingsModal.open(settings || {});
      })
      .withFailureHandler((err) => {
        showToast(err.message || "Failed to load settings", "error");
      })
      .getWorkspaceSettings(workspace_id);
  }
</script>
