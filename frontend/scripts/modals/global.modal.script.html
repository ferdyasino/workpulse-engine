<script>

const GlobalModal = (() => {

  /* =====================================================
     BOOTSTRAP HELPERS
  ===================================================== */

  function getModal(id) {
    return document.getElementById(id);
  }

  function show(id) {

    const el = getModal(id);

    const modal = new bootstrap.Modal(el, {
      backdrop: "static",
      keyboard: false
    });

    modal.show();
  }

  function hide(id) {

    const el = getModal(id);

    bootstrap.Modal
      .getInstance(el)
      ?.hide();
  }

  /* =====================================================
     LIST MODAL
  ===================================================== */

  function openList(config = {}) {

    document.getElementById("globalListTitle").innerText =
      config.title || "List";

    const head = document.getElementById("globalListHead");

    head.innerHTML = `
      <tr>
        ${(config.columns || [])
          .map(col => `<th>${col}</th>`)
          .join("")}
        <th class="text-end">Actions</th>
      </tr>
    `;

    const addBtn = document.getElementById("globalListAddBtn");

    addBtn.onclick = config.onAdd || null;

    show("globalListModal");
  }

  /* =====================================================
     FORM MODAL
  ===================================================== */

  function openForm(config = {}) {

    document.getElementById("globalFormTitle").innerText =
      config.title || "Form";

    const form = document.getElementById("globalForm");
    const container = document.getElementById("globalFormFields");

    form.reset();

    container.innerHTML = "";

    (config.fields || []).forEach(field => {

      const colClass = field.col || "col-md-6";

      let html = "";

      /* =========================
         SELECT
      ========================= */

      if (field.type === "select") {

        html = `
          <div class="${colClass}">
            <label class="form-label">
              ${field.label || ""}
            </label>

            <select
              class="form-select"
              name="${field.name}"
              ${field.required ? "required" : ""}
            >

              ${(field.options || []).map(option => `

                <option
                  value="${option.value}"
                  ${String(option.value) === String(field.value)
                    ? "selected"
                    : ""}
                >
                  ${option.label}
                </option>

              `).join("")}

            </select>
          </div>
        `;
      }

      /* =========================
         TEXTAREA
      ========================= */

      else if (field.type === "textarea") {

        html = `
          <div class="${colClass}">
            <label class="form-label">
              ${field.label || ""}
            </label>

            <textarea
              class="form-control"
              name="${field.name}"
              rows="${field.rows || 3}"
              ${field.required ? "required" : ""}
            >${field.value || ""}</textarea>
          </div>
        `;
      }

      /* =========================
         INPUT
      ========================= */

      else {

        html = `
          <div class="${colClass}">
            <label class="form-label">
              ${field.label || ""}
            </label>

            <input
              class="form-control"
              type="${field.type || "text"}"
              name="${field.name}"
              value="${field.value || ""}"
              placeholder="${field.placeholder || ""}"
              ${field.required ? "required" : ""}
            >
          </div>
        `;
      }

      container.insertAdjacentHTML(
        "beforeend",
        html
      );
    });

    form.onsubmit = (e) => {

      e.preventDefault();

      const data =
        Object.fromEntries(
          new FormData(form).entries()
        );

      config.onSubmit?.(data);
    };

    show("globalFormModal");
  }

  /* =====================================================
     DELETE MODAL
  ===================================================== */

  function openDelete(config = {}) {

    document.getElementById("globalDeleteTitle").innerText =
      config.title || "Confirm Delete";

    document.getElementById("globalDeleteMessage").innerText =
      config.message || "Are you sure?";

    document.getElementById("globalDeleteId").value =
      config.id || "";

    const btn =
      document.getElementById(
        "globalDeleteConfirmBtn"
      );

    btn.onclick = () => {
      config.onConfirm?.(config.id);
    };

    show("globalDeleteModal");
  }

  return {

    openList,
    openForm,
    openDelete,

    show,
    hide

  };

})();

</script>
