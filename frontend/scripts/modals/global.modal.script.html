<script>
function formatLabel(value) {
  if (!value) return "-";

  return String(value)
    .toLowerCase()
    .replace(/_/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

const GlobalModal = (() => {

  /* =====================================================
     BOOTSTRAP HELPERS
  ===================================================== */

  function getModal(id) {
    return document.getElementById(id);
  }

  function show(id) {
    const el = getModal(id);

    const modal = new bootstrap.Modal(el, {
      backdrop: "static",
      keyboard: false
    });

    modal.show();
  }

  function hide(id) {
    const el = getModal(id);
    bootstrap.Modal.getInstance(el)?.hide();
  }

  /* =====================================================
     LIST MODAL
  ===================================================== */

  function openList(config = {}) {
    document.getElementById("globalListTitle").innerText =
      config.title || "List";

    const head = document.getElementById("globalListHead");

    head.innerHTML = `
      <tr>
        ${(config.columns || [])
          .map(col => `<th>${col}</th>`)
          .join("")}
        <th class="text-end">Actions</th>
      </tr>
    `;

    const addBtn = document.getElementById("globalListAddBtn");
    addBtn.onclick = null;
    addBtn.onclick = config.onAdd || null;

    show("globalListModal");
  }

  /* =====================================================
     FORM MODAL
  ===================================================== */

  function openForm(config = {}) {
    document.getElementById("globalFormTitle").innerText =
      config.title || "Form";

    const form = document.getElementById("globalForm");
    const container = document.getElementById("globalFormFields");

    form.reset();
    container.innerHTML = "";

    (config.fields || []).forEach(field => {
      const colClass = field.col || "col-md-6";
      let html = "";

      if (field.type === "select") {
        html = `
          <div class="${colClass}">
            <label class="form-label">${field.label || ""}</label>

            <div class="d-flex gap-2 align-items-center">
              <select
                class="form-select flex-grow-1"
                name="${field.name}"
                ${field.required ? "required" : ""}
              >
                ${
                  field.placeholderOption
                    ? `<option value="">${field.placeholderOption}</option>`
                    : ""
                }

                ${(field.options || []).map(option => `
                  <option
                    value="${option.value}"
                    ${String(option.value) === String(field.value) ? "selected" : ""}
                  >
                    ${formatLabel(option.label || option.value)}
                  </option>
                `).join("")}
              </select>

              ${
                field.onAdd
                  ? `
                    <button
                      type="button"
                      class="btn btn-glass btn-glass-icon"
                      data-add-field="${field.name}"
                      title="Add ${field.label}"
                    >
                      +
                    </button>
                  `
                  : ""
              }
            </div>
          </div>
        `;
      }

      else if (field.type === "textarea") {
        html = `
          <div class="${colClass}">
            <label class="form-label">${field.label || ""}</label>

            <textarea
              class="form-control"
              name="${field.name}"
              rows="${field.rows || 3}"
              ${field.required ? "required" : ""}
            >${field.value || ""}</textarea>
          </div>
        `;
      }

      else {
        html = `
          <div class="${colClass}">
            <label class="form-label">${field.label || ""}</label>

            <input
              class="form-control"
              type="${field.type || "text"}"
              name="${field.name}"
              value="${field.value || ""}"
              placeholder="${field.placeholder || ""}"
              ${field.required ? "required" : ""}
            >
          </div>
        `;
      }

      container.insertAdjacentHTML("beforeend", html);
    });

    container.onclick = (e) => {
      const btn = e.target.closest("[data-add-field]");
      if (!btn) return;

      const fieldName = btn.dataset.addField;
      config.onAddField?.(fieldName, e);
    };

    form.onsubmit = (e) => {
      e.preventDefault();

      const data = Object.fromEntries(
        new FormData(form).entries()
      );

      config.onSubmit?.(data);
    };

    show("globalFormModal");
  }

  /* =====================================================
     DELETE MODAL
  ===================================================== */

  function openDelete(config = {}) {
    document.getElementById("globalDeleteTitle").innerText =
      config.title || "Confirm Action";

    document.getElementById("globalDeleteMessage").innerText =
      config.message || "Choose an action.";

    document.getElementById("globalDeleteId").value =
      config.id || "";

    const deleteBtn = document.getElementById("globalDeleteBtn");
    const deactivateBtn = document.getElementById("globalDeactivateBtn");

    deleteBtn.onclick = null;
    deactivateBtn.onclick = null;

    if (deleteBtn) {
      deleteBtn.onclick = () => config.onDelete?.(config.id);
    }

    if (deactivateBtn) {
      deactivateBtn.onclick = () => config.onDeactivate?.(config.id);
    }

    show("globalDeleteModal");
  }

  return {
    openList,
    openForm,
    openDelete,
    show,
    hide
  };

})();
</script>
