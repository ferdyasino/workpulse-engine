<script>
  /**
   * =====================================================
   * GAS PROMISE WRAPPER
   * =====================================================
   */
  function gas(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [fn](...args);
    });
  }

  /**
   * =====================================================
   * SETTINGS API
   * Backend already returns normalized objects.
   * =====================================================
   */
  const SettingsAPI = {
    /**
     * -----------------------------------------------------
     * Current Workspace
     * -----------------------------------------------------
     */
    get workspaceId() {
      return (
        APP.user?.workspace_id ||
        localStorage.getItem(STORAGE_KEYS?.WORKSPACE_ID || "workspace_id") ||
        ""
      );
    },

    /**
     * -----------------------------------------------------
     * Get all settings
     * -----------------------------------------------------
     */
    async getAll(forceRefresh = false) {
      const workspace_id = this.workspaceId;

      if (!workspace_id) {
        console.warn("[SettingsAPI] Workspace not found.");
        return [];
      }

      if (!forceRefresh && Array.isArray(APP.settings) && APP.settings.length) {
        return APP.settings;
      }

      const settings = await gas("workspaceSettings", workspace_id);

      APP.settings = Array.isArray(settings) ? settings : [];

      APP.settingsLoaded = true;

      return APP.settings;
    },

    /**
     * -----------------------------------------------------
     * Get one setting
     * -----------------------------------------------------
     */
    async get(key) {
      if (!key) return null;

      const list = await this.getAll();

      return list.find((s) => s.key === key) || null;
    },

    /**
     * -----------------------------------------------------
     * Convenience getter
     * Returns only the value
     * -----------------------------------------------------
     */
    async value(key, defaultValue = null) {
      const setting = await this.get(key);

      return setting ? setting.value : defaultValue;
    },

    /**
     * -----------------------------------------------------
     * Save everything
     * -----------------------------------------------------
     */
    async saveAll(settingsRows) {
      const workspace_id = this.workspaceId;

      if (!workspace_id) {
        throw new Error("Workspace not found");
      }

      if (!Array.isArray(settingsRows)) {
        throw new Error("settingsRows must be an array");
      }

      const saved = await gas("saveWorkspaceSettings", workspace_id, settingsRows);

      console.log(
        "Returned from GAS:",
        saved.find((s) => s.key === "OVERTIME_ENABLED"),
      );

      APP.settings = Array.isArray(saved) ? saved : [];

      APP.settingsLoaded = true;

      await this.refresh();

      return APP.settings;
    },

    /**
     * -----------------------------------------------------
     * Patch
     * -----------------------------------------------------
     */
    async patch(settingsRows) {
      const workspace_id = this.workspaceId;

      if (!workspace_id) {
        throw new Error("Workspace not found");
      }

      const saved = await gas("patchWorkspaceSettings", workspace_id, settingsRows);

      APP.settings = Array.isArray(saved) ? saved : APP.settings;

      await this.refresh();

      return APP.settings;
    },

    /**
     * -----------------------------------------------------
     * Reset
     * -----------------------------------------------------
     */
    async reset() {
      const workspace_id = this.workspaceId;

      if (!workspace_id) {
        throw new Error("Workspace not found");
      }

      const settings = await gas("resetWorkspaceSettings", workspace_id);

      APP.settings = Array.isArray(settings) ? settings : [];

      APP.settingsLoaded = true;

      await this.refresh();

      return APP.settings;
    },

    /**
     * -----------------------------------------------------
     * Validate
     * -----------------------------------------------------
     */
    async validate(settingsRows) {
      return gas("validateWorkspaceSettings", settingsRows);
    },

    /**
     * -----------------------------------------------------
     * Convert array to map
     * -----------------------------------------------------
     */
    async toObject() {
      const list = await this.getAll();

      return list.reduce((obj, item) => {
        obj[item.key] = item.value;

        return obj;
      }, {});
    },

    /**
     * -----------------------------------------------------
     * Reload from server
     * -----------------------------------------------------
     */
    async refresh() {
      return this.getAll(true);
    },
  };
</script>
