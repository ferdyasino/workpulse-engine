<script>
  /**
   * =====================================================
   * GAS PROMISE WRAPPER
   * =====================================================
   */
  function gas(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [fn](...args);
    });
  }

  /**
   * =====================================================
   * SETTINGS API (SCHEMA-DRIVEN)
   * =====================================================
   */
  const SettingsAPI = {
    /**
     * Always resolve workspace dynamically
     */
    get workspaceId() {
      return APP.user?.workspace_id || localStorage.getItem("workspace_id");
    },

    /**
     * Get ALL settings (structured rows)
     */
    async getAll() {
      const workspace_id = this.workspaceId;

      if (!workspace_id) {
        showToast("Workspace not found", "error");
        return [];
      }

      return await gas("getWorkspaceSettings", workspace_id);
    },

    /**
     * Save full settings table (RECOMMENDED PATH)
     */
    async saveAll(settingsRows) {
      const workspace_id = this.workspaceId;

      if (!workspace_id) {
        throw new Error("Workspace not found");
      }

      return await gas("saveWorkspaceSettings", workspace_id, settingsRows);
    },

    /**
     * Get single setting (resolved from row list)
     */
    async get(key) {
      const all = await this.getAll();
      return all.find((s) => s.key === key) || null;
    },

    /**
     * Patch (future-ready: partial update support)
     */
    async patch(settingsRows) {
      const workspace_id = this.workspaceId;
      return await gas("patchWorkspaceSettings", workspace_id, settingsRows);
    },

    /**
     * Reset settings
     */
    async reset() {
      const workspace_id = this.workspaceId;
      return await gas("resetWorkspaceSettings", workspace_id);
    },

    /**
     * Validate before save
     */
    async validate(settingsRows) {
      return await gas("validateWorkspaceSettings", settingsRows);
    },
  };
</script>
