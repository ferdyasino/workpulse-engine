<script>
  function cleanToastMessage(message, fallback = "No message") {
    if (message == null) return fallback;

    let text = "";

    if (typeof message === "string") {
      text = message;
    } else if (typeof message?.message === "string") {
      text = message.message;
    } else {
      text = String(message);
    }

    text = text.trim();

    // Remove common prefixes repeatedly if stacked
    text = text.replace(/^(Error|Exception)\s*:\s*/i, "");

    return text || fallback;
  }

  function showToast(message, type = "info") {
    const toastEl = document.getElementById("appToast");
    const body = document.getElementById("toastBody");

    if (!toastEl || !body) {
      console.warn("Toast not mounted in DOM yet.");
      return;
    }

    const typeMap = {
      success: "bg-success",
      error: "bg-danger",
      warning: "bg-warning",
      info: "bg-info",
    };

    toastEl.classList.remove(
      "bg-success",
      "bg-danger",
      "bg-warning",
      "bg-info",
    );
    toastEl.classList.add(typeMap[type] || "bg-info");

    body.textContent = cleanToastMessage(message, "No message");

    let instance = bootstrap.Toast.getInstance(toastEl);
    if (!instance) {
      instance = new bootstrap.Toast(toastEl, {
        delay: 3000,
        autohide: true,
      });
    }

    instance.show();
  }

  const toastSuccess = (msg) => showToast(msg, "success");
  const toastError = (msg) => showToast(msg, "error");
  const toastInfo = (msg) => showToast(msg, "info");
  const toastWarning = (msg) => showToast(msg, "warning");
</script>
