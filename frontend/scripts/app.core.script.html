<script>
  // =====================================================
  // APP STATE
  // =====================================================

  const APP = {
    // session / auth
    user: null,
    role: "guest",
    currentPage: null,

    workspaceSlug: "",
    serverEmail: "",

    // attendance / dashboard
    workStatus: "NOT STARTED",
    timeLogs: [],
    attendanceState: null,
    dashboardData: null,
    shiftSummary: null,

    dashboard: {
      viewingDate: null,
    },

    reports: {
      rows: [],
      kpis: null,
      range: "today",
    },

    settings: {},
    settingsLoaded: false,

    // admin / misc
    selectedUser: null,
    currentLocation: null,
  };

  // =====================================================
  // STORAGE KEYS
  // =====================================================

  const STORAGE_KEYS = Object.freeze({
    USER_ID: "user_id",
    EMAIL: "email",
    NAME: "name",
    ROLE: "role",
    SHIFT_ID: "shift_id",
    SHIFT_NAME: "shift_name",
    START_TIME: "start_time",
    END_TIME: "end_time",
    GRACE: "grace_minutes",
    DEPT_NAME: "dept_name",
    WORKSPACE_ID: "workspace_id",
    WORKSPACE_SLUG: "workspace_slug",
    LAST_PAGE: "last_page",
  });

  // =====================================================
  // ROUTES
  // =====================================================

  const ROUTES = {
    home: "page-home",
    dashboard: "page-dashboard",
    admin: "page-admin-dashboard",
    reports: "page-reports",
    settings: "page-settings",
    debugger: "page-debug",
    login: "page-login",
    error: "page-error",
  };

  // =====================================================
  // PAGE TITLES
  // =====================================================

  const PAGE_TITLES = Object.freeze({
    admin: "Admin Dashboard",
    dashboard: "Dashboard",
    home: "System Home",
    reports: "Reports",
    settings: "Settings",
    debugger: "Attendance Debugger",
    login: "Login",
  });

  function resetAttendanceRuntimeState() {
    APP.workStatus = "NOT STARTED";
    APP.timeLogs = [];
    APP.attendanceState = null;
    APP.dashboardData = null;
    APP.shiftSummary = null;
    APP.dashboard.viewingDate = null;
  }

  function resetSessionRuntimeState() {
    APP.user = null;
    APP.role = "guest";
    APP.currentPage = null;

    APP.workspaceSlug = "";
    APP.serverEmail = "";

    resetAttendanceRuntimeState();

    APP.selectedUser = null;
    APP.currentLocation = null;
  }

  function showLoader() {
    const el = document.getElementById("loader");
    if (!el) return;
    el.classList.remove("d-none");
  }

  function hideLoader() {
    const el = document.getElementById("loader");
    if (!el) return;
    el.classList.add("d-none");
  }
</script>
