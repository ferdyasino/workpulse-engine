<script>
  const Reports = {
    initialized: false,

    storageKey: "reports_page",

    state: {
      workspace_id: "",

      users: [],
      shifts: [],

      settings: {},

      timezone: "Asia/Manila",

      email: "",
      shift_id: "",

      start_date: "",
      end_date: "",

      report: null,
    },

    init() {
      if (this.initialized) return;

      this.initialized = true;

      this.state.workspace_id = localStorage.getItem(STORAGE_KEYS.WORKSPACE_ID) || "";

      this.restore();

      const today = this.formatDateTZ(this.now());

      document.getElementById("reportStartDate").value = this.state.start_date || today;

      document.getElementById("reportEndDate").value = this.state.end_date || today;

      document.getElementById("reportRun")?.addEventListener("click", () => this.run());

      document
        .getElementById("reportEmployee")
        ?.addEventListener("change", () => this.onUserChange());

      this.loadReferenceData();

      this.loadSettings().finally(() => {
        this.bindRangeButtons();
      });
    },

    server(method, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [method](...args);
      });
    },

    loadSettings() {
      return this.server("getWorkspaceSettings", this.state.workspace_id)
        .then((settings) => {
          this.state.settings = settings || {};

          this.state.timezone =
            this.state.settings.TIMEZONE || this.state.settings.timezone || "Asia/Manila";

          document.getElementById("reportTimezone").textContent = this.state.timezone;

          console.log("REPORT SETTINGS", this.state.settings);
          console.log("TIMEZONE", this.state.timezone);
        })
        .catch((err) => {
          console.error(err);
          this.state.settings = {};
        });
    },

    loadReferenceData() {
      this.server("getUsers", this.state.workspace_id)

        .then((users) => {
          this.state.users = Array.isArray(users) ? users : [];

          this.renderUsers();

          return this.server("getAllShifts", this.state.workspace_id);
        })

        .then((shifts) => {
          this.state.shifts = Array.isArray(shifts) ? shifts : [];

          this.renderShifts();

          if (this.state.email) {
            document.getElementById("reportEmployee").value = this.state.email;

            this.onUserChange();
          }
        })

        .catch(console.error);
    },

    renderUsers() {
      const select = document.getElementById("reportEmployee");

      if (!select) return;

      select.innerHTML = `<option value="">All Employees</option>`;

      this.state.users.forEach((user) => {
        const option = document.createElement("option");

        option.value = user.email;

        option.textContent = `${user.fullname || user.name} (${user.email})`;

        option.dataset.shiftId = user.shift_id || "";

        select.appendChild(option);
      });

      if (this.state.email) {
        select.value = this.state.email;
      }
    },

    renderShifts() {
      const select = document.getElementById("reportShift");

      if (!select) return;

      select.innerHTML = `<option value="">Assigned Shift</option>`;

      this.state.shifts.forEach((shift) => {
        const option = document.createElement("option");

        option.value = shift.shift_id;

        option.textContent = shift.shift_name;

        select.appendChild(option);
      });

      if (this.state.shift_id) {
        select.value = this.state.shift_id;
      }
    },

    onUserChange() {
      const select = document.getElementById("reportEmployee");

      const option = select.options[select.selectedIndex];

      if (!option) return;

      this.state.email = option.value;

      const shift = document.getElementById("reportShift");

      if (!shift.value) {
        this.state.shift_id = option.dataset.shiftId || "";

        shift.value = this.state.shift_id;
      }
    },

    bindRangeButtons() {
      document.getElementById("reportToday")?.addEventListener("click", () => {
        const today = this.formatDateTZ(this.now());

        this.setRange(today, today);
      });

      document.getElementById("reportYesterday")?.addEventListener("click", () => {
        const d = this.now();

        d.setDate(d.getDate() - 1);

        const date = this.formatDateTZ(d);

        this.setRange(date, date);
      });

      document.getElementById("reportThisWeek")?.addEventListener("click", () => {
        const range = this.getWeekRange();

        this.setRange(range.start, range.end);
      });

      document.getElementById("reportLastWeek")?.addEventListener("click", () => {
        const range = this.getLastWeekRange();

        this.setRange(range.start, range.end);
      });

      document.getElementById("reportThisMonth")?.addEventListener("click", () => {
        const now = this.now();

        const start = new Date(now.getFullYear(), now.getMonth(), 1);

        this.setRange(this.formatDateTZ(start), this.formatDateTZ(now));
      });
    },

    getWeekStartDay() {
      const raw = this.state.settings?.WEEKLY_START_DAY ?? "Monday";

      if (typeof raw === "number" && !isNaN(raw)) {
        return raw;
      }

      const value = String(raw).trim().toLowerCase();

      const map = {
        sunday: 0,
        monday: 1,
        tuesday: 2,
        wednesday: 3,
        thursday: 4,
        friday: 5,
        saturday: 6,
      };

      return map[value] ?? 1;
    },

    getWeekRange(offset = 0) {
      const now = this.now();

      now.setHours(0, 0, 0, 0);

      const startDay = this.getWeekStartDay();

      const currentDay = now.getDay();

      const diff = (currentDay - startDay + 7) % 7;

      const start = new Date(now);

      start.setDate(start.getDate() - diff + offset * 7);

      const end = new Date(start);

      end.setDate(end.getDate() + 6);

      return {
        start: this.formatDateTZ(start),
        end: this.formatDateTZ(end),
      };
    },

    getLastWeekRange() {
      return this.getWeekRange(-1);
    },

    setRange(start, end) {
      document.getElementById("reportStartDate").value = start;

      document.getElementById("reportEndDate").value = end;
    },

    run() {
      this.state.workspace_id = localStorage.getItem(STORAGE_KEYS.WORKSPACE_ID) || "";

      this.state.email = document.getElementById("reportEmployee").value;

      this.state.shift_id = document.getElementById("reportShift").value;

      this.state.start_date = document.getElementById("reportStartDate").value;

      this.state.end_date = document.getElementById("reportEndDate").value;

      this.save();

      const btn = document.getElementById("reportRun");

      btn.disabled = true;

      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>`;

      google.script.run

        .withSuccessHandler((result) => {
          console.log("result", result);
          if (typeof result === "string") {
            result = JSON.parse(result);
          }

          this.state.report = result;

          this.render();

          btn.disabled = false;

          btn.innerHTML = "Run";
        })

        .withFailureHandler((err) => {
          console.error(err);

          btn.disabled = false;

          btn.innerHTML = "Run";

          alert(err.message || String(err));
        })

        .api_getReports(
          this.state.workspace_id,
          this.state.email,
          this.state.shift_id,
          APP.role,
          this.state.start_date,
          this.state.end_date,
        );
    },

    render() {
      this.renderSummary();

      this.renderTable();
    },

    renderSummary() {
      const summary = this.state.report?.summary || {};

      document.getElementById("repRunningHours").textContent = formatMinutes(
        summary.worked_minutes || 0,
      );

      document.getElementById("repRegularHours").textContent = formatMinutes(
        summary.regular_minutes || 0,
      );

      document.getElementById("repOTHours").textContent = formatMinutes(
        summary.overtime_minutes || 0,
      );

      document.getElementById("repUndertimeHours").textContent = formatMinutes(
        summary.undertime_minutes || 0,
      );

      document.getElementById("repBreakHours").textContent = formatMinutes(
        summary.break_minutes || 0,
      );

      document.getElementById("repLunchHours").textContent = formatMinutes(
        summary.lunch_minutes || 0,
      );

      document.getElementById("repPresent").textContent = summary.present || 0;

      document.getElementById("repAbsent").textContent = summary.absent || 0;

      document.getElementById("repLate").textContent = summary.late || 0;

      document.getElementById("repWorkdays").textContent = summary.workdays || 0;
    },

    renderTable() {
      const tbody = document.getElementById("reportTableBody");

      if (!tbody) return;

      const rows = this.state.report?.rows || [];

      if (!rows.length) {
        tbody.innerHTML = `
            <tr>
              <td colspan="11"
                  class="text-center text-muted py-5">
                No reports found.
              </td>
            </tr>
            `;

        return;
      }

      tbody.innerHTML = rows
        .map(
          (row) => `

          <tr>

            <td>${row.date || "-"}</td>

            <td>${row.fullname || row.email || "-"}</td>

            <td>${row.shift_name || "-"}</td>


            <td>${row.time_in || "-"}</td>

            <td>${row.time_out || "-"}</td>


            <td>${formatMinutes(row.worked_minutes || 0)}</td>

            <td>${formatMinutes(row.regular_minutes || 0)}</td>

            <td>${formatMinutes(row.overtime_minutes || 0)}</td>


            <td>${formatMinutes(row.late_minutes || 0)}</td>

            <td>${formatMinutes(row.undertime_minutes || 0)}</td>


            <td>
              <span class="badge ${statusBadgeClass(row.status)}">
                ${DISPLAY.status(row.status)}
              </span>
            </td>


          </tr>

          `,
        )
        .join("");
    },

    save() {
      localStorage.setItem(
        this.storageKey,
        JSON.stringify({
          email: this.state.email,

          shift_id: this.state.shift_id,

          start_date: this.state.start_date,

          end_date: this.state.end_date,
        }),
      );
    },

    restore() {
      try {
        Object.assign(this.state, JSON.parse(localStorage.getItem(this.storageKey) || "{}"));
      } catch (err) {
        console.error(err);
      }
    },

    formatDate(date) {
      if (!(date instanceof Date) || isNaN(date.getTime())) {
        console.error("Invalid date:", date);
        return "";
      }

      const year = date.getFullYear();

      const month = String(date.getMonth() + 1).padStart(2, "0");

      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    },

    now() {
      return new Date(
        new Date().toLocaleString("en-US", {
          timeZone: this.state.timezone || "Asia/Manila",
        }),
      );
    },

    formatDateTZ(date) {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: this.state.timezone || "Asia/Manila",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).format(date);
    },
  };

  document.addEventListener("DOMContentLoaded", () => Reports.init());
</script>
