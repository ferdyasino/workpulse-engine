<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

// =====================================================
// APP STATE
// =====================================================

const APP = {
  user: null,
  role: "guest",
  currentPage: "login"
};

// =====================================================
// ROUTES
// =====================================================

const ROUTES = {
  home: "page-home",
  dashboard: "page-dashboard",
  admin: "page-admin-dashboard",
  login: "page-login",
  error: "page-error"
};

// =====================================================
// TIME LOG ACTIONS
// =====================================================

const TIME_LOG_ACTIONS = {
  TIME_IN: "time_in",
  TIME_OUT: "time_out",

  BREAK_1_START: "break_1_start",
  BREAK_1_END: "break_1_end",

  BREAK_2_START: "break_2_start",
  BREAK_2_END: "break_2_end",

  BREAK_3_START: "break_3_start",
  BREAK_3_END: "break_3_end",

  LUNCH_START: "lunch_start",
  LUNCH_END: "lunch_end"
};

// =====================================================
// PAGE TITLES
// =====================================================

const PAGE_TITLES = {
  admin: "Admin Dashboard",
  dashboard: "Employee Dashboard",
  home: "System Home",
  login: "Login"
};

function initApp(serverData) {

  const data = JSON.parse(serverData);

  const emailInput = document.getElementById("email");
  const sidInput = document.getElementById("sid");

  // Prefill email from URL immediately
  if (emailInput && data.email) {
    emailInput.value = data.email;
  }

  // Fetch owner info using workspace slug
  google.script.run
    .withSuccessHandler(owner => {

      console.log("owner", owner);

      // SID from owner record
      if (sidInput) {
        sidInput.value = owner?.sid || owner?.owner_sid || "";
      }

      // Optional: overwrite email if owner email exists
      // if (emailInput && owner?.email) {
      //   emailInput.value = owner.email;
      // }

    })
    .withFailureHandler(err => {
      console.error(err);
    })
    .getOwnerById(data.workspaceSlug);
}

function bootApp() {
  if(window.SERVER_DATA){
    initApp(window.SERVER_DATA);
  }

  const page = APP.currentPage || "login";

  go(page);

  // ONLY sync if dashboard is active
  if (page === "dashboard") {
    syncDashboard();
  }
}

function syncDashboard() {

  const email = localStorage.getItem("email");
  const workspace_id =
    localStorage.getItem("workspace_id") ||
    document.getElementById("sid")?.value;

  if (!email || !workspace_id) return;

  showLoader?.();

  google.script.run
    .withSuccessHandler((res) => {

      hideLoader?.();

      const logs = Array.isArray(res) ? res : [];

      const state = buildTimeLogState(logs);

      renderTimeLogger?.();
      // renderTimeLogs(logs);
      renderBreakActivity(logs);  
      renderTimeSummary(state);

    })
    .withFailureHandler((err) => {
      hideLoader?.();
      console.error("syncDashboard error:", err);
    })
    .findTimeLogs(workspace_id, { email });
}

// =====================================================
// ROUTER
// =====================================================

function go(page) {

  APP.currentPage = page;

  const targetId = ROUTES[page] || ROUTES.home;

  hideAllPages();

  const el = document.getElementById(targetId);

  if (!el) {
    console.error("Invalid page:", page);
    showToast?.("Page not found", "error");
    return;
  }

  el.classList.remove("d-none");

  applyUIState(page);
  applyRoleUI();
  updateDashboardTitle(page);

  console.log("ROUTE →", page);
}

// =====================================================
// PAGE HANDLER
// =====================================================

function hideAllPages() {
  document.querySelectorAll(".app-page")
    .forEach(p => p.classList.add("d-none"));
}

// =====================================================
// UI STATE
// =====================================================

function applyUIState(page) {

  const topbar = document.getElementById("appTopbar");
  const clock = document.getElementById("adminClockContainer");
  const switchBtn = document.getElementById("roleSwitchBtn");

  if (page === "login") {
    topbar?.classList.add("d-none");
    return;
  }

  topbar?.classList.remove("d-none");

  clock?.classList.add("d-none");
  switchBtn?.classList.add("d-none");

  if (page === "admin") {
    clock?.classList.remove("d-none");
  }

  if (page === "dashboard") {

    renderTimeLogger?.();

    syncDashboard();
  }
}

// =====================================================
// ROLE UI
// =====================================================

function applyRoleUI() {

  const switchBtn = document.getElementById("roleSwitchBtn");
  if (!switchBtn) return;

  const isAdmin = APP.role === "admin" || APP.role === "owner";

  switchBtn.classList.toggle("d-none", !isAdmin);
}

// =====================================================
// TITLE
// =====================================================

function updateDashboardTitle(page) {

  const el = document.getElementById("dashboardTitle");
  if (!el) return;

  el.textContent = PAGE_TITLES[page] || "Dashboard";
}

// =====================================================
// LOADER
// =====================================================

function showLoader() {
  document.getElementById("loader")?.classList.remove("d-none");
}

function hideLoader() {
  document.getElementById("loader")?.classList.add("d-none");
}

// =====================================================
// DASHBOARD TOGGLE
// =====================================================

function toggleDashboard() {

  const isAdmin = APP.role === "admin" || APP.role === "owner";

  if (!isAdmin) {
    showToast("Access denied", "error");
    return;
  }

  if (APP.currentPage === "admin") {
    showToast("Switching to dashboard", "info");
    go("dashboard");
  } else {
    showToast("Switching to admin panel", "info");
    go("admin");
  }
}

// =====================================================
// INIT
// =====================================================

window.addEventListener("DOMContentLoaded", () => {

  restoreSession();
  renderUserHeader();
  bootApp();
});

function formatTime(ts) {
  if (!ts) return "--";
  return new Date(ts).toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}

</script>
