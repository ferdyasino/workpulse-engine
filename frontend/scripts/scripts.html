<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

// =====================================================
// APP STATE
// =====================================================

const APP = {
  user: null,
  role: "guest",
  currentPage: null, // IMPORTANT: do NOT default to login
  workspaceSlug: "",
  serverEmail: ""
};

// =====================================================
// ROUTES
// =====================================================

const ROUTES = {
  home: "page-home",
  dashboard: "page-dashboard",
  admin: "page-admin-dashboard",
  login: "page-login",
  error: "page-error"
};

// =====================================================
// TIME LOG ACTIONS
// =====================================================

const TIME_LOG_ACTIONS = {
  TIME_IN: "time_in",
  TIME_OUT: "time_out",

  BREAK_1_START: "break_1_start",
  BREAK_1_END: "break_1_end",

  BREAK_2_START: "break_2_start",
  BREAK_2_END: "break_2_end",

  BREAK_3_START: "break_3_start",
  BREAK_3_END: "break_3_end",

  LUNCH_START: "lunch_start",
  LUNCH_END: "lunch_end"
};

// =====================================================
// PAGE TITLES
// =====================================================

const PAGE_TITLES = {
  admin: "Admin Dashboard",
  dashboard: "Employee Dashboard",
  home: "System Home",
  login: "Login"
};

// =====================================================
// SERVER DATA BOOTSTRAP
// =====================================================

function parseServerData() {
  let data = {};

  try {
    if (window.SERVER_DATA) {
      data = JSON.parse(window.SERVER_DATA);
    }
  } catch (err) {
    console.error("Failed to parse SERVER_DATA:", err);
    data = {};
  }

  const workspaceSlug = data.workspaceSlug || data.w || "";
  const email = data.email || "";

  APP.workspaceSlug = workspaceSlug;
  APP.serverEmail = email;

  if (workspaceSlug) {
    localStorage.setItem("workspace_slug", workspaceSlug);
  }

  // prefill login email if present in URL/server data
  const emailInput = document.getElementById("email");
  if (emailInput && email) {
    emailInput.value = email;
  }

  return data;
}

// =====================================================
// APP BOOT
// =====================================================

function bootApp() {
  // IMPORTANT:
  // restoreSession() should already decide current page.
  // bootApp must only fallback if page is still empty.
  if (!APP.currentPage) {
    APP.currentPage = "login";
  }

  go(APP.currentPage);
}

// =====================================================
// DASHBOARD SYNC
// =====================================================

function syncDashboard() {
  const email = localStorage.getItem("email");
  const workspace_id = localStorage.getItem("workspace_id");

  if (!email || !workspace_id) return;

  showLoader?.();

  google.script.run
    .withSuccessHandler((res) => {
      hideLoader?.();

      const logs = Array.isArray(res) ? res : [];
      const state = buildTimeLogState(logs);

      renderTimeLogger?.();
      renderBreakActivity?.(logs);
      renderGlobalState?.(state);
    })
    .withFailureHandler((err) => {
      hideLoader?.();
      console.error("syncDashboard error:", err);
    })
    .findTimeLogs(workspace_id, { email });
}

// =====================================================
// ROUTER
// =====================================================

function go(page) {
  APP.currentPage = page;

  // persist last viewed page
  localStorage.setItem("last_page", page);

  const targetId = ROUTES[page] || ROUTES.home;

  hideAllPages();

  const el = document.getElementById(targetId);

  if (!el) {
    console.error("Invalid page:", page);
    showToast?.("Page not found", "error");
    return;
  }

  el.classList.remove("d-none");

  applyUIState(page);
  applyRoleUI();
  updateDashboardTitle(page);

  console.log("ROUTE →", page);
}

// =====================================================
// PAGE HANDLER
// =====================================================

function hideAllPages() {
  document.querySelectorAll(".app-page")
    .forEach(p => p.classList.add("d-none"));
}

// =====================================================
// UI STATE
// =====================================================

function applyUIState(page) {
  const topbar = document.getElementById("appTopbar");
  const clock = document.getElementById("adminClockContainer");

  // LOGIN PAGE
  if (page === "login") {
    topbar?.classList.add("d-none");
    clock?.classList.add("d-none");
    return;
  }

  // SHOW TOPBAR FOR ALL NON-LOGIN PAGES
  topbar?.classList.remove("d-none");

  // CLOCK ONLY FOR ADMIN PAGE
  if (page === "admin") {
    clock?.classList.remove("d-none");
  } else {
    clock?.classList.add("d-none");
  }

  // EMPLOYEE DASHBOARD
  if (page === "dashboard") {
    renderTimeLogger?.();
    syncDashboard();
  }
}

// =====================================================
// ROLE UI
// =====================================================

function applyRoleUI() {
  const isAdmin = APP.role === "admin" || APP.role === "owner";
  const adminMenu = document.getElementById("adminMenuItem");

  if (adminMenu) {
    adminMenu.classList.toggle("d-none", !isAdmin);
  }
}

// =====================================================
// TITLE
// =====================================================

function updateDashboardTitle(page) {
  const el = document.getElementById("dashboardTitle");
  if (!el) return;

  el.textContent = PAGE_TITLES[page] || "Dashboard";
}

// =====================================================
// LOADER
// =====================================================

function showLoader() {
  document.getElementById("loader")?.classList.remove("d-none");
}

function hideLoader() {
  document.getElementById("loader")?.classList.add("d-none");
}

// =====================================================
// DASHBOARD TOGGLE
// =====================================================

function toggleDashboard() {
  const isAdmin = APP.role === "admin" || APP.role === "owner";

  if (!isAdmin) {
    showToast?.("Access denied", "error");
    return;
  }

  if (APP.currentPage === "admin") {
    showToast?.("Switching to dashboard", "info");
    go("dashboard");
  } else {
    showToast?.("Switching to admin panel", "info");
    go("admin");
  }
}

// =====================================================
// SESSION RESTORE
// =====================================================

function restoreSession() {
  const email = localStorage.getItem("email");

  // no session = login page
  if (!email) {
    APP.user = null;
    APP.role = "guest";
    APP.currentPage = "login";
    return;
  }

  const user = getCurrentUser();

  APP.user = user;
  APP.role = (user.role || "guest").toLowerCase();

  renderUserHeader();
  applyRoleUI?.();

  const isAdmin = APP.role === "admin" || APP.role === "owner";
  const lastPage = localStorage.getItem("last_page");

  if (isAdmin) {
    // admin can persist admin/dashboard
    APP.currentPage =
      lastPage === "dashboard" || lastPage === "admin"
        ? lastPage
        : "admin";
  }else{
    APP.currentPage = "dashboard";
  }
}

// =====================================================
// INIT
// =====================================================

window.addEventListener("DOMContentLoaded", () => {
  parseServerData();  
  restoreSession();  
  renderUserHeader();
  bootApp();     
});

function formatTime(ts) {
  if (!ts) return "--";
  return new Date(ts).toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}

</script>
