<script>
  (() => {
    if (window.__SHIFT_HELPER_READY__) return;
    window.__SHIFT_HELPER_READY__ = true;

    window.formatShift = function (value) {
      if (!value) return "--";

      const match = String(value)
        .trim()
        .match(/^(\d{1,2}):(\d{2})$/);

      if (!match) return value;

      let hour = Number(match[1]);
      const minute = match[2];

      const suffix = hour >= 12 ? "PM" : "AM";

      hour = hour % 12 || 12;

      return `${hour}:${minute} ${suffix}`;
    };

    window.formatTime = function (value) {
      if (!value) return "--";

      const str = String(value).trim();

      if (/^\d{1,2}:\d{2}$/.test(str)) {
        return window.formatShift(str);
      }

      const d = new Date(value);

      if (isNaN(d)) return "--";

      return d.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });
    };

    window.normalizeShift = function (shift = {}) {
      function toTimeInput(value) {
        if (!value) return "";

        const str = String(value).trim();

        // Accept 6:00 or 06:00
        const match24 = str.match(/^(\d{1,2}):(\d{2})$/);

        if (match24) {
          return `${String(Number(match24[1])).padStart(2, "0")}:${match24[2]}`;
        }

        // Accept 6:00 AM / 6:00 PM
        const match12 = str.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);

        if (match12) {
          let hh = Number(match12[1]);
          const mm = match12[2];
          const ap = match12[3].toUpperCase();

          if (ap === "PM" && hh !== 12) hh += 12;
          if (ap === "AM" && hh === 12) hh = 0;

          return `${String(hh).padStart(2, "0")}:${mm}`;
        }

        const d = new Date(str);

        if (!isNaN(d.getTime())) {
          return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(
            2,
            "0",
          )}`;
        }

        return "";
      }

      return {
        shift_name: shift.shift_name || "",
        start_time: toTimeInput(shift.start_time),
        end_time: toTimeInput(shift.end_time),
        grace_minutes: Number(shift.grace_minutes ?? shift.grace ?? 10),
        status: shift.status || "ACTIVE",
      };
    };

    window.parseShiftTimeToDate = function (value, base = new Date()) {
      if (!value) return null;

      const date = new Date(base.getFullYear(), base.getMonth(), base.getDate());

      const match = String(value)
        .trim()
        .match(/^(\d{1,2}):(\d{2})(?:\s*(AM|PM))?$/i);

      if (!match) return null;

      let hh = Number(match[1]);
      const mm = Number(match[2]);

      if (match[3]) {
        const suffix = match[3].toUpperCase();

        if (suffix === "PM" && hh !== 12) hh += 12;
        if (suffix === "AM" && hh === 12) hh = 0;
      }

      date.setHours(hh, mm, 0, 0);

      return date;
    };

    window.formatShiftLabel = function (shift = {}, options = {}) {
      if (!shift) return "--";

      const range = `${window.formatShift(shift.start_time)} - ${window.formatShift(shift.end_time)}`;

      if (options.timeOnly) {
        return range;
      }

      return `${DISPLAY.label(shift.shift_name || "Unnamed Shift")} (${range})`;
    };
  })();
</script>
