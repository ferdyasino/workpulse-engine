<script>
  (() => {
    if (window.__SHIFT_HELPER_READY__) return;
    window.__SHIFT_HELPER_READY__ = true;

    function parseTime(value) {
      if (!value) return null;

      const str = String(value).trim();

      // H:mm / HH:mm / HH:mm:ss
      let match = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);

      if (match) {
        return {
          hours: Number(match[1]),
          minutes: Number(match[2]),
        };
      }

      // H:mm AM/PM
      match = str.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);

      if (match) {
        let hours = Number(match[1]);

        const minutes = Number(match[2]);
        const ap = match[3].toUpperCase();

        if (ap === "PM" && hours !== 12) hours += 12;
        if (ap === "AM" && hours === 12) hours = 0;

        return {
          hours,
          minutes,
        };
      }

      const d = new Date(str);

      if (!isNaN(d.getTime())) {
        return {
          hours: d.getHours(),
          minutes: d.getMinutes(),
        };
      }

      return null;
    }

    window.formatShift = function (value) {
      const time = parseTime(value);

      if (!time) return "--";

      let hour = time.hours;

      const minute = String(time.minutes).padStart(2, "0");

      const suffix = hour >= 12 ? "PM" : "AM";

      hour = hour % 12 || 12;

      return `${hour}:${minute} ${suffix}`;
    };

    window.formatTime = function (value) {
      return window.formatShift(value);
    };

    window.normalizeShift = function (shift = {}) {
      function toTimeInput(value) {
        const time = parseTime(value);

        if (!time) return "";

        return `${String(time.hours).padStart(2, "0")}:${String(time.minutes).padStart(2, "0")}`;
      }

      return {
        shift_name: shift.shift_name || "",
        start_time: toTimeInput(shift.start_time),
        end_time: toTimeInput(shift.end_time),
        grace_minutes: Number(shift.grace_minutes ?? shift.grace ?? 10),
        status: shift.status || "ACTIVE",
      };
    };

    window.parseShiftTimeToDate = function (value, base = new Date()) {
      const time = parseTime(value);

      if (!time) return null;

      const date = new Date(base.getFullYear(), base.getMonth(), base.getDate());

      date.setHours(time.hours, time.minutes, 0, 0);

      return date;
    };

    window.formatShiftLabel = function (shift = {}, options = {}) {
      if (!shift) return "--";

      const name = DISPLAY.label(shift.shift_name || "Unnamed Shift");

      const range = `${window.formatShift(shift.start_time)} - ${window.formatShift(
        shift.end_time,
      )}`;

      return options.timeOnly ? range : `${name} (${range})`;
    };
  })();
</script>
