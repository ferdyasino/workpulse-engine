<script>
  (() => {
    if (window.__DATE_HELPER_READY__) return;
    window.__DATE_HELPER_READY__ = true;

    function getTimezone() {
      return typeof getAppTimezone === "function"
        ? getAppTimezone()
        : Intl.DateTimeFormat().resolvedOptions().timeZone;
    }

    window.formatDateKey = function (value = new Date()) {
      if (typeof value === "string") {
        const str = value.trim();

        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
          return str;
        }
      }

      const d = value instanceof Date ? new Date(value) : new Date(value);

      if (isNaN(d.getTime())) return "";

      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: getTimezone(),
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).formatToParts(d);

      const year = parts.find((p) => p.type === "year")?.value;
      const month = parts.find((p) => p.type === "month")?.value;
      const day = parts.find((p) => p.type === "day")?.value;

      return `${year}-${month}-${day}`;
    };

    window.formatTime = function (value) {
      if (!value) return "--:--";

      const d = value instanceof Date ? value : new Date(value);

      if (isNaN(d.getTime())) return String(value);

      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true,
        timeZone: getTimezone(),
      });
    };

    window.formatDateTime = function (value) {
      if (!value) return "--";

      const d = value instanceof Date ? value : new Date(value);

      if (isNaN(d.getTime())) return String(value);

      return d.toLocaleString("en-US", {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true,
        timeZone: getTimezone(),
      });
    };

    window.addMinutes = function (date, minutes = 0) {
      if (!(date instanceof Date) || isNaN(date.getTime())) return null;

      return new Date(date.getTime() + Number(minutes) * 60000);
    };

    window.diffMinutes = function (later, earlier) {
      const a = new Date(later);
      const b = new Date(earlier);

      if (isNaN(a.getTime()) || isNaN(b.getTime())) return 0;

      return Math.floor((a.getTime() - b.getTime()) / 60000);
    };

    window.formatMinutesDuration = function (minutes = 0) {
      const total = Math.abs(Number(minutes));

      const hrs = Math.floor(total / 60);
      const mins = total % 60;

      return hrs ? `${hrs}h ${mins}m` : `${mins}m`;
    };
  })();
</script>
