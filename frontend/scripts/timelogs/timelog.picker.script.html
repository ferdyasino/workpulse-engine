<script>
  function changeAttendanceDay(days) {
    if (!APP.dashboard.viewingDate) return;

    const d = new Date(APP.dashboard.viewingDate);

    d.setDate(d.getDate() + days);

    APP.dashboard.viewingDate = formatDateKey(d);

    loadAttendanceDay(APP.dashboard.viewingDate);
  }

  document
    .getElementById("btnPrevAttendanceDay")
    ?.addEventListener("click", () => changeAttendanceDay(-1));

  document
    .getElementById("btnNextAttendanceDay")
    ?.addEventListener("click", () => changeAttendanceDay(1));

  function loadAttendanceDay(workDate) {
    const user = getCurrentUser();

    google.script.run
      .withSuccessHandler((state) => {
        console.log("state", state);
        APP.attendanceState = state;
        APP.timeLogs = state.raw_logs || [];
        APP.sessions = state.sessions || [];
        APP.dashboard.viewingDate = state.work_date;

        hydrateAttendanceUI(state);
      })
      .withFailureHandler((err) => {
        showToast(err.message, "error");
      })
      .getAttendanceStateByWorkDate(user.workspace_id, user.email, user.shift_id, workDate);
  }
</script>
