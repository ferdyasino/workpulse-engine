<script>
  /**
   * =====================================================
   * TIME LOGGER UI MODULE
   * - HEADER: B1 / B2 / B3 indicators only
   * - LOGGER: actual action buttons only
   *   Time In | Time Out
   *   Break Start | Break End
   *   Lunch Start | Lunch End
   * =====================================================
   */

  /* =====================================================
     GLOBAL STATE ENTRYPOINT
  ===================================================== */
  window.renderGlobalState = function (state = {}) {
    const statusText = document.getElementById("globalStatusText");
    const dot = document.getElementById("statusDot");

    const status = String(state.status || "NOT STARTED").toUpperCase();

    if (statusText) {
      statusText.textContent = DISPLAY.status(state.status || "NOT STARTED");
    }

    if (dot) {
      dot.className = "status-dot";

      const map = {
        WORKING: "bg-success",
        "ON BREAK": "bg-warning",
        "AT LUNCH": "bg-info",
        "CLOCKED OUT": "bg-danger",
      };

      dot.classList.add(map[status] || "bg-secondary");
    }

    // HEADER ONLY
    renderBreakIndicators(state);
  };

  /* =====================================================
     BREAK STATE HELPERS
  ===================================================== */
  function getBreakState(breakItem) {
    if (!breakItem) return "AVAILABLE";
    if (breakItem.in && breakItem.out) return "ENDED";
    if (breakItem.in && !breakItem.out) return "ACTIVE";
    return "AVAILABLE";
  }

  function getActiveBreakIndex(state = {}) {
    const breaks = Array.isArray(state.breaks) ? state.breaks : [];
    const idx = breaks.findIndex((b) => b && b.in && !b.out);
    return idx >= 0 ? idx + 1 : null;
  }

  function getNextBreakIndex(state = {}) {
    const breaks = Array.isArray(state.breaks) ? state.breaks : [];

    for (let i = 0; i < breaks.length; i++) {
      const b = breaks[i];
      if (!b) return i + 1;
      if (!b.in) return i + 1;
      if (b.in && !b.out) return i + 1;
    }

    return breaks.length + 1;
  }

  /* =====================================================
     HEADER BREAK INDICATORS
     - visual only
     - rendered below status
  ===================================================== */
  function renderBreakIndicators(state = {}) {
    const container = document.getElementById("breakButtonContainer");
    if (!container) return;

    const breaks = Array.isArray(state.breaks) ? state.breaks : [];
    const maxBreaks = Math.max(3, breaks.length);

    container.innerHTML = "";

    for (let i = 0; i < maxBreaks; i++) {
      const index = i + 1;
      const breakItem = breaks[i] || null;
      const breakState = getBreakState(breakItem);

      const badge = document.createElement("button");
      badge.type = "button";
      badge.className = "btn btn-sm";
      badge.textContent = `B${index}`;
      badge.disabled = true;

      if (breakState === "ACTIVE") {
        badge.classList.add("btn-success");
      } else if (breakState === "ENDED") {
        badge.classList.add("btn-break-ended");
      } else {
        badge.classList.add("btn-outline-warning");
      }

      container.appendChild(badge);
    }
  }

  /* =====================================================
     LOGGER BREAK ACTION BUTTONS STATE
     - decides what break action should be fired
     - supports sequential break model
  ===================================================== */
  function getBreakActionMeta(state = {}) {
    const activeBreakIndex = getActiveBreakIndex(state);

    // if currently on break, only break end should be active
    if (activeBreakIndex) {
      return {
        startAction: null,
        endAction: `break_${activeBreakIndex}_end`,
        activeBreakIndex,
      };
    }

    // otherwise next break start
    const nextBreakIndex = getNextBreakIndex(state);

    return {
      startAction: `break_${nextBreakIndex}_start`,
      endAction: null,
      activeBreakIndex: null,
    };
  }

  /* =====================================================
     LOGGER ACTION BUTTON STATE APPLIER
     - updates button enabled/disabled state after logger HTML exists
  ===================================================== */
  function syncLoggerButtons(state = {}) {
    const timeInBtn = document.getElementById("loggerTimeInBtn");
    const timeOutBtn = document.getElementById("loggerTimeOutBtn");
    const lunchStartBtn = document.getElementById("loggerLunchStartBtn");
    const lunchEndBtn = document.getElementById("loggerLunchEndBtn");
    const breakStartBtn = document.getElementById("loggerBreakStartBtn");
    const breakEndBtn = document.getElementById("loggerBreakEndBtn");

    const status = String(state.status || "NOT STARTED").toUpperCase();
    const breakMeta = getBreakActionMeta(state);

    const hasTimeIn = !!state.time_in;
    const hasTimeOut = !!state.time_out;
    const lunchStarted = !!state.lunch?.in;
    const lunchEnded = !!state.lunch?.out;
    const onLunch = lunchStarted && !lunchEnded;
    const onBreak = !!breakMeta.activeBreakIndex;

    /* -------------------------
       TIME IN
    ------------------------- */
    if (timeInBtn) {
      timeInBtn.disabled = hasTimeIn;
    }

    /* -------------------------
       TIME OUT
    ------------------------- */
    if (timeOutBtn) {
      timeOutBtn.disabled = !hasTimeIn || hasTimeOut || onBreak || onLunch;
    }

    /* -------------------------
       LUNCH START
    ------------------------- */
    if (lunchStartBtn) {
      lunchStartBtn.disabled = !hasTimeIn || hasTimeOut || onBreak || onLunch;
    }

    /* -------------------------
       LUNCH END
    ------------------------- */
    if (lunchEndBtn) {
      lunchEndBtn.disabled = !lunchStarted || lunchEnded || hasTimeOut;
    }

    /* -------------------------
       BREAK START
    ------------------------- */
    if (breakStartBtn) {
      breakStartBtn.disabled =
        !hasTimeIn ||
        hasTimeOut ||
        onLunch ||
        onBreak ||
        !breakMeta.startAction;

      breakStartBtn.className = "btn btn-warning w-100";

      if (breakMeta.startAction) {
        breakStartBtn.onclick = () => logTime(breakMeta.startAction);
      } else {
        breakStartBtn.onclick = null;
      }
    }

    /* -------------------------
       BREAK END
    ------------------------- */
    if (breakEndBtn) {
      breakEndBtn.disabled =
        !hasTimeIn || hasTimeOut || !onBreak || !breakMeta.endAction;

      breakEndBtn.className = "btn btn-outline-warning w-100";

      if (breakMeta.endAction) {
        breakEndBtn.onclick = () => logTime(breakMeta.endAction);
      } else {
        breakEndBtn.onclick = null;
      }
    }

    /* -------------------------
       OPTIONAL ACTIVE VISUAL STATE
    ------------------------- */
    if (status === "ON BREAK" && breakEndBtn) {
      breakEndBtn.className = "btn btn-success w-100";
    }

    if (status === "AT LUNCH" && lunchEndBtn) {
      lunchEndBtn.className = "btn btn-success w-100";
    }
  }

  /* =====================================================
     TIME LOGGER UI
     IMPORTANT:
     - no indicator buttons here
     - only real action buttons
     - break row is BETWEEN time and lunch
  ===================================================== */
  function renderTimeLogger(state = {}) {
    const container = document.getElementById("dashboardTimelogsList");
    if (!container) return;

    container.innerHTML = `
      <div id="timeLogger" class="glass-card mb-4">
        <div class="row g-3">

          <!-- TIME -->
          <div class="col-6">
            <button
              id="loggerTimeInBtn"
              class="btn btn-success w-100"
              onclick="logTime('time_in')"
            >
              Time In
            </button>
          </div>

          <div class="col-6">
            <button
              id="loggerTimeOutBtn"
              class="btn btn-danger w-100"
              onclick="logTime('time_out')"
            >
              Time Out
            </button>
          </div>

          <!-- BREAK -->
          <div class="col-6">
            <button
              id="loggerBreakStartBtn"
              class="btn btn-warning w-100"
              type="button"
            >
              Break Start
            </button>
          </div>

          <div class="col-6">
            <button
              id="loggerBreakEndBtn"
              class="btn btn-outline-warning w-100"
              type="button"
            >
              Break End
            </button>
          </div>

          <!-- LUNCH -->
          <div class="col-6">
            <button
              id="loggerLunchStartBtn"
              class="btn btn-dark w-100"
              onclick="logTime('lunch_start')"
            >
              Lunch Start
            </button>
          </div>

          <div class="col-6">
            <button
              id="loggerLunchEndBtn"
              class="btn btn-info w-100"
              onclick="logTime('lunch_end')"
            >
              Lunch End
            </button>
          </div>

        </div>
      </div>
    `;

    syncLoggerButtons(state);
  }

  /* =====================================================
     SUMMARY UI
  ===================================================== */
  function renderTimeSummary(state = {}) {
    const inEl = document.getElementById("summaryTimeIn");
    const outEl = document.getElementById("summaryTimeOut");

    if (inEl) {
      inEl.textContent = state.time_in ? formatTime(state.time_in) : "--";
    }

    if (outEl) {
      outEl.textContent = state.time_out ? formatTime(state.time_out) : "--";
    }
  }

  /* =====================================================
     BREAK ACTIVITY UI
  ===================================================== */
  function renderBreakActivity(state = {}) {
    const container = document.getElementById("leftTimelogsList");
    if (!container) return;

    const rows = [];
    const breaks = Array.isArray(state.breaks) ? state.breaks : [];
    const lunch = state.lunch || {};

    breaks.forEach((b, i) => {
      if (b?.in) {
        rows.push({
          label: `Break ${i + 1} Start`,
          time: b.in,
        });
      }

      if (b?.out) {
        rows.push({
          label: `Break ${i + 1} End`,
          time: b.out,
        });
      }
    });

    if (lunch.in) {
      rows.push({
        label: "Lunch Start",
        time: lunch.in,
      });
    }

    if (lunch.out) {
      rows.push({
        label: "Lunch End",
        time: lunch.out,
      });
    }

    if (!rows.length) {
      container.innerHTML = `
        <div class="text-muted-custom">No break activity yet</div>
      `;
      return;
    }

    container.innerHTML = rows
      .map(
        (row) => `
          <div class="d-flex justify-content-between py-1">
            <span>${escapeHtml(row.label)}</span>
            <strong>${escapeHtml(formatTime(row.time))}</strong>
          </div>
        `,
      )
      .join("");
  }

  /* =====================================================
     SINGLE HYDRATION ENTRY POINT
     ORDER:
     1) header state + break indicators
     2) summary
     3) break activity
     4) logger action buttons
  ===================================================== */
  function hydrateAttendanceUI(state = {}) {
    renderGlobalState(state); // includes header B1/B2/B3 indicators
    renderTimeSummary(state);
    renderBreakActivity(state);
    renderTimeLogger(state); // real buttons only
  }
</script>
