<script>
  /* =====================================================
   SAFE TIME LOG ACTION ENTRY (FRONT → BACK VALIDATION)
===================================================== */

  function recordTimeLogAction(workspace_id, payload) {
    try {
      if (!workspace_id) {
        return { success: false, message: "workspace_id is required" };
      }

      if (!payload) {
        return { success: false, message: "payload is required" };
      }

      validateTimeLogAction(workspace_id, payload);

      return {
        success: true,
        message: `${payload.action} validated for shift ${payload.shift_id || ""}`,
      };
    } catch (err) {
      return {
        success: false,
        message: err?.message || "Validation failed",
      };
    }
  }

  /* =====================================================
   ALLOWED ACTIONS (SOURCE OF TRUTH)
===================================================== */

  function getAllowedTimeLogActions() {
    return [
      "time_in",
      "time_out",
      "lunch_start",
      "lunch_end",
      "break_1_start",
      "break_1_end",
      "break_2_start",
      "break_2_end",
      "break_3_start",
      "break_3_end",
    ];
  }

  /* =====================================================
   VALIDATION ENTRYPOINT
===================================================== */

  function validateTimeLogAction(workspace_id, payload) {
    const email = String(payload?.email || "")
      .trim()
      .toLowerCase();
    const action = String(payload?.action || "").trim();
    const shiftId = payload?.shift_id || null;

    if (!email) throw new Error("email is required");
    if (!action) throw new Error("action is required");

    if (!getAllowedTimeLogActions().includes(action)) {
      throw new Error(`Invalid action: ${action}`);
    }

    const state = getCurrentState(workspace_id, email, shiftId);

    switch (action) {
      case "time_in":
        assertCanTimeIn(state);
        return true;

      case "time_out":
        assertCanTimeOut(state);
        return true;

      case "lunch_start":
        assertCanStartLunch(state);
        return true;

      case "lunch_end":
        assertCanEndLunch(state);
        return true;

      case "break_1_start":
      case "break_2_start":
      case "break_3_start":
        assertCanStartBreak(state, action);
        return true;

      case "break_1_end":
      case "break_2_end":
      case "break_3_end":
        assertCanEndBreak(state, action);
        return true;

      default:
        throw new Error(`Unsupported action: ${action}`);
    }
  }

  /* =====================================================
   STATE HELPERS
===================================================== */

  function getBreakMap(state) {
    const list = Array.isArray(state.breaks) ? state.breaks : [];

    return {
      1: list[0] || null,
      2: list[1] || null,
      3: list[2] || null,
    };
  }

  function getActiveBreak(state) {
    return (state.breaks || []).find((b) => b && b.in && !b.out) || null;
  }

  function extractBreakNumber(action) {
    const m = String(action).match(/^break_(\d+)_(start|end)$/);
    return m ? Number(m[1]) : null;
  }

  function getBreakIndexSafe(state, breakObj) {
    return (
      (state.breaks || []).findIndex(
        (b) => b?.key && breakObj?.key && b.key === breakObj.key,
      ) + 1
    );
  }

  /* =====================================================
   TIME RULES
===================================================== */

  function assertCanTimeIn(state) {
    if (state.time_in) throw new Error("Already timed in.");
    return true;
  }

  function assertCanTimeOut(state) {
    if (!state.time_in) throw new Error("Time in required first.");
    if (state.time_out) throw new Error("Already timed out.");

    if (getActiveBreak(state)) {
      throw new Error("End active break first.");
    }

    if (state.lunch?.in && !state.lunch?.out) {
      throw new Error("End lunch first.");
    }

    return true;
  }

  /* =====================================================
   LUNCH RULES
===================================================== */

  function assertCanStartLunch(state) {
    if (!state.time_in) throw new Error("Time in required.");
    if (state.time_out) throw new Error("Already timed out.");

    if (state.lunch?.in && !state.lunch?.out) {
      throw new Error("Lunch already active.");
    }

    if (getActiveBreak(state)) {
      throw new Error("End break before lunch.");
    }

    return true;
  }

  function assertCanEndLunch(state) {
    if (!state.lunch?.in) throw new Error("Lunch not started.");
    if (state.lunch?.out) throw new Error("Lunch already ended.");
    return true;
  }

  /* =====================================================
   BREAK RULES (STRICT SEQUENTIAL MODEL)
===================================================== */

  function assertCanStartBreak(state, action) {
    if (!state.time_in) throw new Error("Time in required.");
    if (state.time_out) throw new Error("Already timed out.");

    const n = extractBreakNumber(action);
    const map = getBreakMap(state);

    if (getActiveBreak(state)) {
      throw new Error("Finish active break first.");
    }

    if (n === 1 && map[1]) throw new Error("Break 1 already done.");

    if (n === 2) {
      if (!map[1]?.out) throw new Error("Complete Break 1 first.");
      if (map[2]) throw new Error("Break 2 already done.");
    }

    if (n === 3) {
      if (!map[2]?.out) throw new Error("Complete Break 2 first.");
      if (map[3]) throw new Error("Break 3 already done.");
    }

    return true;
  }

  function assertCanEndBreak(state, action) {
    const n = extractBreakNumber(action);
    const active = getActiveBreak(state);

    if (!active) throw new Error("No active break.");

    const idx = getBreakIndexSafe(state, active);

    if (idx !== n) {
      throw new Error(`Must end Break ${idx} first.`);
    }

    return true;
  }

  /* =====================================================
   SUMMARY UI
===================================================== */

  function renderTimeSummary(state = {}) {
    const inEl = document.getElementById("summaryTimeIn");
    const outEl = document.getElementById("summaryTimeOut");
    const statusEl = document.getElementById("globalStatusText");

    if (inEl)
      inEl.textContent = state.time_in ? formatTime(state.time_in) : "--";
    if (outEl)
      outEl.textContent = state.time_out ? formatTime(state.time_out) : "--";
    if (statusEl)
      statusEl.textContent = DISPLAY.status(state.status || "NOT STARTED");
  }

  /* =====================================================
   BREAK ACTIVITY UI
===================================================== */

  function renderBreakActivity(state = {}) {
    const container = document.getElementById("leftTimelogsList");
    if (!container) return;

    const rows = [];
    const breaks = state.breaks || [];
    const lunch = state.lunch || {};

    breaks.forEach((b, i) => {
      if (b?.in) rows.push({ label: `Break ${i + 1} Start`, time: b.in });
      if (b?.out) rows.push({ label: `Break ${i + 1} End`, time: b.out });
    });

    if (lunch.in) rows.push({ label: "Lunch Start", time: lunch.in });
    if (lunch.out) rows.push({ label: "Lunch End", time: lunch.out });

    if (!rows.length) {
      container.innerHTML = `<div class="text-muted-custom">No break activity yet</div>`;
      return;
    }

    container.innerHTML = rows
      .map(
        (r) => `
    <div class="d-flex justify-content-between py-1">
      <span>${escapeHtml(r.label)}</span>
      <strong>${escapeHtml(formatTime(r.time))}</strong>
    </div>
  `,
      )
      .join("");
  }

  /* =====================================================
   GOOGLE APPS SCRIPT VALIDATION WRAPPER
===================================================== */

  function validate(workspace_id, payload, onSuccess, onError) {
    google.script.run
      .withSuccessHandler((res) => {
        if (!res?.success) return onError?.(res);
        onSuccess?.(res);
      })
      .withFailureHandler((err) => {
        onError?.({ message: err?.message || "Server error" });
      })
      .recordTimeLogAction(workspace_id, payload);
  }
</script>
