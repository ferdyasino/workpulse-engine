<script>
  function buildTimeLogState(timeLogs = []) {
    const state = {
      status: "NOT STARTED",
      time_in: null,
      time_out: null,
      lunch: { in: null, out: null },
      breaks: [],
    };

    const logs = Array.isArray(timeLogs) ? timeLogs : [];

    let breakCounter = 0;

    for (const log of logs) {
      const action = String(log?.action || "").trim();
      const timestamp = log?.timestamp || null;

      /* =========================
       CORE EVENTS
    ========================= */

      if (action === "time_in") {
        state.time_in = timestamp;
        state.status = "WORKING";
        continue;
      }

      if (action === "time_out") {
        state.time_out = timestamp;
        continue;
      }

      if (action === "lunch_start") {
        state.lunch.in = timestamp;
        state.status = "AT LUNCH";
        continue;
      }

      if (action === "lunch_end") {
        state.lunch.out = timestamp;
        state.status = "WORKING";
        continue;
      }

      /* =========================
       NEW BREAK MODEL (SAFE)
    ========================= */

      if (action === "break_start") {
        state.breaks.push({
          key: `B${++breakCounter}`,
          in: timestamp,
          out: null,
        });

        state.status = "ON BREAK";
        continue;
      }

      if (action === "break_end") {
        const openBreak = [...state.breaks].reverse().find((b) => b && !b.out);

        if (openBreak) {
          openBreak.out = timestamp;
        }

        state.status = "WORKING";
        continue;
      }

      /* =========================
       LEGACY MODEL (ISOLATED)
    ========================= */

      const legacy = action.match(/^break_(\d+)_(start|end)$/);

      if (legacy) {
        const index = Number(legacy[1]) - 1;
        const type = legacy[2];

        if (!state.breaks[index]) {
          state.breaks[index] = {
            key: `B${index + 1}`,
            in: null,
            out: null,
          };
        }

        if (type === "start") {
          state.breaks[index].in = timestamp;
        }

        if (type === "end") {
          state.breaks[index].out = timestamp;
        }

        continue;
      }
    }

    /* =========================
     FINAL STATE RESOLUTION
  ========================= */

    state.breaks = state.breaks.filter(Boolean);

    if (state.time_out) {
      state.status = "CLOCKED OUT";
    } else if (state.lunch?.in && !state.lunch?.out) {
      state.status = "AT LUNCH";
    } else if (state.breaks.some((b) => b.in && !b.out)) {
      state.status = "ON BREAK";
    } else if (state.time_in) {
      state.status = "WORKING";
    }

    return state;
  }
</script>
