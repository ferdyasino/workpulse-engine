<script>
  /**
   * =====================================================
   * EXPORT REPORT (PDF)
   * =====================================================
   */

  function exportReportPDF() {
    const report = getReportExportData();

    if (!report.rows.length) {
      showToast?.(
        "warning",
        "Nothing to Export",
        "There are no report records to export.",
      );

      return;
    }

    try {
      downloadPDF(report);
    } catch (error) {
      console.error("PDF Export Error:", error);

      showToast?.(
        "danger",
        "Export Failed",
        "Unable to generate the PDF report.",
      );
    }
  }

  /**
   * =====================================================
   * DOWNLOAD PDF
   * =====================================================
   */

  function downloadPDF(report) {
    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
      orientation: "landscape",
      unit: "mm",
      format: "a4",
    });

    const kpis = report.kpis || {};

    // =====================================================
    // TITLE
    // =====================================================

    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(18);
    pdf.text(report.title, 14, 18);

    // =====================================================
    // REPORT INFO
    // =====================================================

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(10);

    pdf.text(`Employee : ${report.employee}`, 14, 28);
    pdf.text(`Range : ${report.range}`, 14, 34);
    pdf.text(`Generated By : ${report.generatedBy}`, 14, 40);
    pdf.text(`Generated At : ${report.generatedAt.toLocaleString()}`, 14, 46);

    // =====================================================
    // SUMMARY
    // =====================================================

    pdf.autoTable({
      startY: 55,

      theme: "grid",

      head: [["Metric", "Value"]],

      body: [
        ["Present", kpis.total_present || 0],
        ["Absent", kpis.total_absent || 0],
        ["Workdays", kpis.total_workdays || 0],
        ["Late Count", kpis.total_late_count || 0],

        ["Worked Hours", formatMinutesDuration(kpis.total_worked_minutes)],
        ["Regular Hours", formatMinutesDuration(kpis.total_regular_minutes)],
        ["Paid Hours", formatMinutesDuration(kpis.total_paid_minutes)],
        ["Overtime", formatMinutesDuration(kpis.total_overtime_minutes)],
        ["Undertime", formatMinutesDuration(kpis.total_undertime_minutes)],
        ["Lunch", formatMinutesDuration(kpis.total_lunch_minutes)],
        ["Break", formatMinutesDuration(kpis.total_break_minutes)],
        ["Late Time", formatMinutesDuration(kpis.total_late_minutes)],
      ],
    });

    // =====================================================
    // ATTENDANCE TABLE
    // =====================================================

    pdf.autoTable({
      startY: pdf.lastAutoTable.finalY + 10,

      theme: "striped",

      head: [["Employee", "Shift", "Worked", "Late", "OT", "Status", "Date"]],

      body: report.rows.map(function (row) {
        return [
          row.fullname || "",

          row.shift_name || "",

          formatMinutesDuration(row.worked_minutes),

          formatMinutesDuration(row.late_minutes),

          formatMinutesDuration(row.overtime_minutes),

          DISPLAY.status(row.status),

          row.date || "",
        ];
      }),

      styles: {
        fontSize: 9,
      },

      headStyles: {
        fontStyle: "bold",
      },
    });

    // =====================================================
    // PAGE NUMBERS
    // =====================================================

    const pageCount = pdf.internal.getNumberOfPages();

    for (let page = 1; page <= pageCount; page++) {
      pdf.setPage(page);

      pdf.setFontSize(9);

      pdf.text(
        `Page ${page} of ${pageCount}`,
        pdf.internal.pageSize.getWidth() - 30,
        pdf.internal.pageSize.getHeight() - 8,
      );
    }

    // =====================================================
    // SAVE
    // =====================================================

    pdf.save(getReportFilename("pdf"));
  }
</script>
