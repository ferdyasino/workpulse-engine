<script>
  /**
   * =====================================================
   * EXPORT REPORT (PDF)
   * =====================================================
   */

  function exportReportPDF() {
    const report = getReportExportData();

    if (!report.rows.length) {
      showToast?.("There are no report records to export.", "warning");
      return;
    }

    try {
      downloadPDF(report);
    } catch (error) {
      console.error("PDF Export Error:", error);

      showToast?.("Unable to generate the PDF report.", "error");
    }
  }

  /**
   * =====================================================
   * DOWNLOAD PDF
   * =====================================================
   */

  function downloadPDF(report) {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      throw new Error("jsPDF library is not loaded.");
    }

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
      orientation: "landscape",
      unit: "mm",
      format: "a4",
    });

    if (typeof pdf.autoTable !== "function") {
      throw new Error("jsPDF AutoTable plugin is not loaded.");
    }

    const kpis = report.summary || {};

    // =====================================================
    // TITLE
    // =====================================================

    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(18);
    pdf.text(report.title, 14, 18);

    // =====================================================
    // REPORT INFORMATION
    // =====================================================

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(10);

    pdf.text(`Employee : ${report.employee}`, 14, 28);
    pdf.text(`Shift : ${report.shift}`, 14, 34);
    pdf.text(`Timezone : ${report.timezone}`, 14, 40);
    pdf.text(`Date Range : ${report.startDate} to ${report.endDate}`, 14, 46);
    pdf.text(`Generated By : ${report.generatedBy}`, 14, 52);
    pdf.text(`Generated At : ${report.generatedAt.toLocaleString()}`, 14, 58);
    pdf.text(`Total Records : ${report.totalRows}`, 14, 64);

    // =====================================================
    // SUMMARY TABLE
    // =====================================================

    pdf.autoTable({
      startY: 72,

      theme: "grid",

      head: [["Metric", "Value"]],

      body: [
        ["Present", kpis.present || 0],
        ["Absent", kpis.absent || 0],
        ["Workdays", kpis.workdays || 0],
        ["Late Count", kpis.late || 0],

        ["Worked Hours", formatMinutesDuration(Number(kpis.worked_minutes || 0))],
        ["Regular Hours", formatMinutesDuration(Number(kpis.regular_minutes || 0))],
        ["Paid Hours", formatMinutesDuration(Number(kpis.paid_minutes || 0))],
        ["Overtime", formatMinutesDuration(Number(kpis.overtime_minutes || 0))],
        ["Undertime", formatMinutesDuration(Number(kpis.undertime_minutes || 0))],
        ["Lunch", formatMinutesDuration(Number(kpis.lunch_minutes || 0))],
        ["Break", formatMinutesDuration(Number(kpis.break_minutes || 0))],
        ["Late Time", formatMinutesDuration(Number(kpis.late_minutes || 0))],
      ],

      styles: {
        fontSize: 9,
      },

      headStyles: {
        fontStyle: "bold",
      },
    });

    // =====================================================
    // ATTENDANCE TABLE
    // =====================================================

    pdf.autoTable({
      startY: pdf.lastAutoTable.finalY + 8,

      theme: "striped",

      head: [
        [
          "Date",
          "Employee",
          "Employee No.",
          "Role",
          "Shift",
          "Worked",
          "Regular",
          "Paid",
          "Late",
          "OT",
          "UT",
          "Lunch",
          "Break",
          "Status",
        ],
      ],

      body: report.rows.map(function (row) {
        return [
          row.date || "",
          row.fullname || "",
          row.employee_no || "",
          row.role || "",
          row.shift_name || row.shift || "",

          formatMinutesDuration(Number(row.worked_minutes || 0)),
          formatMinutesDuration(Number(row.regular_minutes || 0)),
          formatMinutesDuration(Number(row.paid_minutes || 0)),
          formatMinutesDuration(Number(row.late_minutes || 0)),
          formatMinutesDuration(Number(row.overtime_minutes || 0)),
          formatMinutesDuration(Number(row.undertime_minutes || 0)),
          formatMinutesDuration(Number(row.lunch_minutes || 0)),
          formatMinutesDuration(Number(row.break_minutes || 0)),

          typeof DISPLAY?.status === "function" ? DISPLAY.status(row.status) : row.status || "",
        ];
      }),

      styles: {
        fontSize: 8,
        cellPadding: 2,
      },

      headStyles: {
        fontStyle: "bold",
      },
    });

    // =====================================================
    // PAGE NUMBERS
    // =====================================================

    const pageCount = pdf.internal.getNumberOfPages();

    for (let page = 1; page <= pageCount; page++) {
      pdf.setPage(page);

      pdf.setFontSize(9);

      pdf.text(
        `Page ${page} of ${pageCount}`,
        pdf.internal.pageSize.getWidth() - 35,
        pdf.internal.pageSize.getHeight() - 8,
      );
    }

    // =====================================================
    // SAVE
    // =====================================================

    pdf.save(getReportFilename("pdf"));
  }
</script>
