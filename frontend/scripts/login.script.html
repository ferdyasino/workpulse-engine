<script>
// =====================================================
// SERVER DATA HELPER
// =====================================================

function getServerData() {
  try {
    return window.SERVER_DATA
      ? JSON.parse(window.SERVER_DATA)
      : {};
  } catch (err) {
    console.error("Invalid SERVER_DATA:", err);
    return {};
  }
}

function embedServerData() {
  const data = getServerData();

  const emailInput = document.getElementById("email");

  // Save workspace slug if available
  if (data.workspaceSlug) {
    localStorage.setItem("workspaceSlug", data.workspaceSlug);
  }

  // Prefill email if available
  if (emailInput && data.email) {
    emailInput.value = data.email;
  }

  return data;
}


// =====================================================
// LOGIN HANDLER
// =====================================================


document.getElementById("loginForm")?.addEventListener("submit", (e) => {
  e.preventDefault();

  const email =
    document.getElementById("email")?.value?.trim() ||
    APP.serverEmail ||
    "";

  const workspaceSlug =
    APP.workspaceSlug ||
    localStorage.getItem("workspace_slug") ||
    "";

  if (!email) {
    showToast?.("Email is required", "warning");
    return;
  }

  showLoader?.();

  google.script.run
    .withSuccessHandler(handleLoginSuccess)
    .withFailureHandler(handleLoginError)
    .loginResolver(workspaceSlug, email);
});

// =====================================================
// LOGIN SUCCESS
// =====================================================

function handleLoginSuccess(result) {
  hideLoader?.();

  if (!result) {
    showToast?.("Invalid login response", "error");
    return;
  }

  const user = setCurrentUser(result);

  renderUserHeader();
  applyRoleUI?.();

  const isAdmin =
    APP.role === "admin" ||
    APP.role === "owner";

  if (isAdmin) {
    UserInit?.();
  }
  go("dashboard");
}


// =====================================================
// LOGIN ERROR
// =====================================================

function handleLoginError(err) {
  hideLoader?.();

  console.error("LOGIN ERROR:", err);

  showToast?.(
    err?.message || "Login failed. Please try again.",
    "error"
  );

  go("login");
}


// =====================================================
// LOGOUT
// =====================================================

function logout() {
  // keep workspaceSlug if you want the login page to still know which workspace it belongs to
  const workspaceSlug = localStorage.getItem("workspaceSlug") || "";

  localStorage.clear();

  if (workspaceSlug) {
    localStorage.setItem("workspaceSlug", workspaceSlug);
  }

  APP.user = null;
  APP.role = "guest";
  APP.currentPage = "login";

  showToast?.("Logged out successfully", "info");
  go("login");
}

// =====================================================
// USER STATE
// =====================================================

function setCurrentUser(result) {
  if (!result) return null;

  const user = {
    user_id: result.user_id || "",
    email: result.email || "",
    name: result.fullname || result.name || "",
    role: (result.role || "guest").toLowerCase(),
    shift_id: result.shift_id || "",
    workspace_id: result.workspace_id || ""
  };

  APP.user = user;
  APP.role = user.role;

  localStorage.setItem("user_id", user.user_id);
  localStorage.setItem("email", user.email);
  localStorage.setItem("name", user.name);
  localStorage.setItem("role", user.role);
  localStorage.setItem("workspace_id", user.workspace_id);
  localStorage.setItem("shift_id", user.shift_id);

  return user;
}


// =====================================================
// GET USER
// =====================================================

function getCurrentUser() {
  return APP.user || {
    user_id: localStorage.getItem("user_id") || "",
    email: localStorage.getItem("email") || "",
    name: localStorage.getItem("name") || "",
    role: localStorage.getItem("role") || "guest",
    shift_id: localStorage.getItem("shift_id") || "",
    workspace_id: localStorage.getItem("workspace_id") || ""
  };
}


// =====================================================
// HEADER
// =====================================================

function renderUserHeader() {
  const user = getCurrentUser();
  const name = user.name || "User";

  const usernameEl = document.getElementById("currUsername");
  if (usernameEl) usernameEl.textContent = name;

  const initials = name
    .split(" ")
    .map(n => n?.[0] || "")
    .join("")
    .substring(0, 2)
    .toUpperCase();

  const initialsEl = document.getElementById("currInitials");
  if (initialsEl) initialsEl.textContent = initials;

  const statusEl = document.getElementById("currWorkStatus");
  if (statusEl) {
    statusEl.textContent = APP.workStatus || "NOT STARTED";
  }
}
