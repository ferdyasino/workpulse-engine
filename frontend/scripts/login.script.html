<script>
// =====================================================
// SERVER DATA HELPERS
// =====================================================

function getServerData() {
  try {
    return window.SERVER_DATA
      ? JSON.parse(window.SERVER_DATA)
      : {};
  } catch (err) {
    console.error("Invalid SERVER_DATA:", err);
    return {};
  }
}

function parseServerData() {
  const data = getServerData();

  const workspaceSlug = data.workspaceSlug || data.w || "";
  const email = data.email || "";

  APP.workspaceSlug = workspaceSlug;
  APP.serverEmail = email;

  if (workspaceSlug) {
    localStorage.setItem(STORAGE_KEYS.WORKSPACE_SLUG, workspaceSlug);
  }

  const emailInput = document.getElementById("email");
  if (emailInput && email) {
    emailInput.value = email;
  }

  return data;
}

function embedServerData() {
  return parseServerData();
}

// =====================================================
// LOGIN HANDLER
// =====================================================

document.getElementById("loginForm")?.addEventListener("submit", (e) => {
  e.preventDefault();

  const email =
    document.getElementById("email")?.value?.trim() ||
    APP.serverEmail ||
    "";

  const workspaceSlug =
    APP.workspaceSlug ||
    localStorage.getItem(STORAGE_KEYS.WORKSPACE_SLUG) ||
    "";

  if (!email) {
    showToast?.("Email is required", "warning");
    return;
  }

  showLoader?.();

  google.script.run
    .withSuccessHandler(handleLoginSuccess)
    .withFailureHandler(handleLoginError)
    .loginResolver(workspaceSlug, email);
});

// =====================================================
// LOGIN SUCCESS
// =====================================================

function handleLoginSuccess(result) {
  console.log("sched", result.sched);
  hideLoader?.();

  if (!result) {
    showToast?.("Invalid login response", "error");
    return;
  }

  // clear previous user session completely before applying new user
  resetAppSessionState();
  clearDashboardUI?.();

  setCurrentUser(result);

  APP.workStatus = "NOT STARTED";

  renderUserHeader();
  applyRoleUI?.();

  const isAdmin = APP.role === "admin" || APP.role === "owner";
  if (isAdmin) {
    UserInit?.();
  }

  go("dashboard");
}

// =====================================================
// LOGIN ERROR
// =====================================================

function handleLoginError(err) {
  hideLoader?.();

  console.error("LOGIN ERROR:", err);

  showToast?.(
    err?.message || "Login failed. Please try again.",
    "error"
  );

  go("login");
}

// =====================================================
// LOGOUT
// =====================================================

function logout() {
  const workspaceSlug =
    localStorage.getItem(STORAGE_KEYS.WORKSPACE_SLUG) ||
    APP.workspaceSlug ||
    "";

  localStorage.clear();

  if (workspaceSlug) {
    localStorage.setItem(STORAGE_KEYS.WORKSPACE_SLUG, workspaceSlug);
  }

  resetAppSessionState();
  APP.workspaceSlug = workspaceSlug;

  resetUIAfterLogout();

  showToast?.("Logged out successfully", "info");
  go("login");
}

// =====================================================
// SESSION RESET
// =====================================================

function resetAppSessionState() {
  APP.user = null;
  APP.role = "guest";
  APP.currentPage = "login";

  APP.serverEmail = "";
  APP.workStatus = "NOT STARTED";
  APP.timeLogs = [];
  APP.dashboardData = null;
  APP.attendanceState = null;
  APP.selectedUser = null;
}

// =====================================================
// UI RESET
// =====================================================

function resetUIAfterLogout() {
  const emailInput = document.getElementById("email");
  if (emailInput) emailInput.value = "";

  const usernameEl = document.getElementById("currUsername");
  if (usernameEl) usernameEl.textContent = "User";

  const initialsEl = document.getElementById("currInitials");
  if (initialsEl) initialsEl.textContent = "--";

  const statusEl = document.getElementById("currWorkStatus");
  if (statusEl) statusEl.textContent = "NOT STARTED";

  clearDashboardUI?.();
}

// =====================================================
// USER STATE
// =====================================================

function setCurrentUser(result) {
  if (!result) return null;

  const user = {
    user_id: result.user_id || "",
    email: result.email || "",
    name: result.fullname || result.name || "",
    role: (result.role || "guest").toLowerCase(),
    shift_id: result.shift_id || "",
    workspace_id: result.workspace_id || "",
    dept_name: result.dept_name || ""
  };

  APP.user = user;
  APP.role = user.role;

  localStorage.setItem(STORAGE_KEYS.USER_ID, user.user_id);
  localStorage.setItem(STORAGE_KEYS.EMAIL, user.email);
  localStorage.setItem(STORAGE_KEYS.NAME, user.name);
  localStorage.setItem(STORAGE_KEYS.ROLE, user.role);
  localStorage.setItem(STORAGE_KEYS.WORKSPACE_ID, user.workspace_id);
  localStorage.setItem(STORAGE_KEYS.SHIFT_ID, user.shift_id);
  localStorage.setItem(STORAGE_KEYS.DEPT_NAME, user.dept_name);

  return user;
}

function getCurrentUser() {
  return APP.user || {
    user_id: localStorage.getItem(STORAGE_KEYS.USER_ID) || "",
    email: localStorage.getItem(STORAGE_KEYS.EMAIL) || "",
    name: localStorage.getItem(STORAGE_KEYS.NAME) || "",
    role: localStorage.getItem(STORAGE_KEYS.ROLE) || "guest",
    shift_id: localStorage.getItem(STORAGE_KEYS.SHIFT_ID) || "",
    workspace_id: localStorage.getItem(STORAGE_KEYS.WORKSPACE_ID) || "",
    dept_name: localStorage.getItem(STORAGE_KEYS.DEPT_NAME) || ""
  };
}

// =====================================================
// SESSION RESTORE
// =====================================================

function restoreSession() {
  const user_id = localStorage.getItem(STORAGE_KEYS.USER_ID);
  const email = localStorage.getItem(STORAGE_KEYS.EMAIL);
  const role = localStorage.getItem(STORAGE_KEYS.ROLE);
  const workspace_id = localStorage.getItem(STORAGE_KEYS.WORKSPACE_ID);

  if (!user_id || !email || !role || !workspace_id) {
    APP.user = null;
    APP.role = "guest";
    APP.currentPage = "login";
    return;
  }

  const user = getCurrentUser();

  APP.user = user;
  APP.role = (user.role || "guest").toLowerCase();

  renderUserHeader();
  applyRoleUI?.();

  const isAdmin = APP.role === "admin" || APP.role === "owner";
  const lastPage = localStorage.getItem(STORAGE_KEYS.LAST_PAGE);

  if (isAdmin) {
    APP.currentPage =
      lastPage === "dashboard" || lastPage === "admin"
        ? lastPage
        : "admin";
  } else {
    APP.currentPage = "dashboard";
  }
}

// =====================================================
// HEADER
// =====================================================

function renderUserHeader() {
  const user = getCurrentUser();
  const name = user.name || "User";
  const deptName = `${user.dept_name.toUpperCase()} Department`

  const usernameEl = document.getElementById("currUsername");
  if (usernameEl) usernameEl.textContent = name;  
  const deptNameEl = document.getElementById("currDepartment");
  if (deptNameEl) deptNameEl.textContent = deptName;

  const initials = name
    .split(" ")
    .map(part => part?.[0] || "")
    .join("")
    .substring(0, 2)
    .toUpperCase();

  const initialsEl = document.getElementById("currInitials");
  if (initialsEl) initialsEl.textContent = initials || "--";

  const statusEl = document.getElementById("currWorkStatus");
  if (statusEl) {
    statusEl.textContent = APP.workStatus || "NOT STARTED";
  }
}
</script>
