<script>
  // =====================================================
  // SERVER DATA HELPERS
  // =====================================================

  function getServerData() {
    try {
      return window.SERVER_DATA ? JSON.parse(window.SERVER_DATA) : {};
    } catch (err) {
      console.error("Invalid SERVER_DATA:", err);
      return {};
    }
  }

  function parseServerData() {
    const data = getServerData();

    const workspaceSlug = data.workspaceSlug || data.w || "";
    const email = data.email || "";

    APP.workspaceSlug = workspaceSlug;
    APP.serverEmail = email;

    if (workspaceSlug) {
      localStorage.setItem(STORAGE_KEYS.WORKSPACE_SLUG, workspaceSlug);
    }

    const emailInput = document.getElementById("email");
    if (emailInput && email) {
      emailInput.value = DISPLAY.email(email);
    }

    return data;
  }

  // =====================================================
  // LOGIN HANDLER
  // =====================================================

  document.getElementById("loginForm")?.addEventListener("submit", (e) => {
    e.preventDefault();

    const form = e.currentTarget;

    const email =
      DISPLAY.email(document.getElementById("email")?.value || "") ||
      DISPLAY.email(APP.serverEmail || "");

    const workspaceSlug =
      APP.workspaceSlug || localStorage.getItem(STORAGE_KEYS.WORKSPACE_SLUG) || "";

    if (!email) {
      showToast?.("Email is required", "warning");
      return;
    }

    document.activeElement?.blur();

    form.querySelectorAll("input, button, select, textarea").forEach((el) => (el.disabled = true));

    // Hide the login page immediately
    hideAllPages();

    showLoader?.();
    showToast?.("Signing you in...", "info");

    ApiClient.call("loginResolver", workspaceSlug, email)
      .then(handleLoginSuccess)
      .catch((err) => {
        hideLoader?.();

        form
          .querySelectorAll("input, button, select, textarea")
          .forEach((el) => (el.disabled = false));

        handleLoginError(err);
      });
  });

  // =====================================================
  // REPORT RESET
  // =====================================================

  function resetReportsState() {
    APP.reports = {
      range: "today",
      rows: [],
      filteredRows: [],
      kpis: {},
      initialized: APP.reports?.initialized || false,
    };

    const tbody = document.getElementById("reportTableBody");

    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="20" class="text-center text-muted py-4">
            Loading reports...
          </td>
        </tr>
      `;
    }

    renderReportKPIs({});
  }

  async function handleLoginSuccess(result) {
    if (!result) {
      hideLoader?.();
      showToast?.("Invalid login response", "error");
      return;
    }

    try {
      resetAppSessionState();
      resetReportsState();

      setCurrentUser(result);

      APP.workStatus = "NOT STARTED";
      APP.dashboard = APP.dashboard || {};
      APP.dashboard.viewingDate = formatDateKey(new Date());

      hideLoader?.();
      renderUserHeader();
      applyRoleUI?.();
      await go("dashboard");

      queueMicrotask(() => {
        bootstrapSettings().catch(console.error);

        if (APP.role === "admin" || APP.role === "owner") {
          UserInit?.();
        }

        // maybePromptForDuty?.();
      });
    } catch (err) {
      console.error(err);
      showToast?.("Unable to load dashboard", "error");
      await go("login");
    }
  }
  // =====================================================
  // LOGIN ERROR
  // =====================================================

  function handleLoginError(err) {
    hideLoader?.();
    resetLoginForm();

    console.error("LOGIN ERROR:", err);

    showToast?.(err?.message || "Login failed. Please try again.", "error");

    go("login");
  }

  // =====================================================
  // LOGOUT
  // =====================================================

  async function logout() {
    const workspaceSlug =
      localStorage.getItem(STORAGE_KEYS.WORKSPACE_SLUG) || APP.workspaceSlug || "";

    localStorage.clear();

    if (workspaceSlug) {
      localStorage.setItem(STORAGE_KEYS.WORKSPACE_SLUG, workspaceSlug);
    }

    resetAppSessionState();
    resetReportsState();
    resetSettings();
    APP.workspaceSlug = workspaceSlug;

    resetUIAfterLogout();
    resetLoginForm();

    showToast?.("Logged out successfully", "info");
    await go("login");
  }

  // =====================================================
  // SESSION RESET
  // =====================================================

  function resetAppSessionState() {
    APP.user = null;
    APP.role = "guest";
    APP.currentPage = "login";

    APP.serverEmail = "";
    APP.workStatus = "NOT STARTED";
    APP.timeLogs = [];
    APP.dashboardData = null;
    APP.attendanceState = null;
    APP.shiftSummary = null;
    APP.selectedUser = null;
    APP.dashboard = APP.dashboard || {};
    APP.dashboard.viewingDate = formatDateKey(new Date());
    APP.__dutyPromptShown = false;
  }

  // =====================================================
  // UI RESET
  // =====================================================

  function resetUIAfterLogout() {
    const emailInput = document.getElementById("email");
    if (emailInput) emailInput.value = "";

    const usernameEl = document.getElementById("currUsername");
    if (usernameEl) usernameEl.textContent = "User";

    const deptEl = document.getElementById("currDepartment");
    if (deptEl) deptEl.textContent = "-- Department --";

    const shiftEl = document.getElementById("currShiftLabel");
    if (shiftEl) shiftEl.textContent = "--:-- - --:--";

    const initialsEl = document.getElementById("currInitials");
    if (initialsEl) initialsEl.textContent = "--";

    const statusEl = document.getElementById("globalStatusText");
    if (statusEl) statusEl.textContent = "NOT STARTED";

    clearDashboardUI?.();
  }

  // =====================================================
  // USER STATE
  // IMPORTANT:
  // - store RAW shift values in APP/localStorage
  // - only format when rendering
  // =====================================================

  function setCurrentUser(result) {
    if (!result) return null;

    const sched = result.sched || {};

    const user = {
      user_id: String(result.user_id || "").trim(),
      email: DISPLAY.email(result.email || ""),
      name: DISPLAY.name(result.fullname || result.name || ""),
      role: DISPLAY.lower(result.role || "guest"),

      workspace_id: String(result.workspace_id || "").trim(),
      dept_name: DISPLAY.label(result.dept_name || ""),

      shift_id: String(result.shift_id || "").trim(),
      shift_name: DISPLAY.label(sched.shift_name || ""),
      start_time: String(sched.start_time || "").trim(), // RAW
      end_time: String(sched.end_time || "").trim(), // RAW
      grace: Number(sched.grace_minutes || 0),
    };

    APP.user = user;
    APP.role = user.role;

    localStorage.setItem(STORAGE_KEYS.USER_ID, user.user_id);
    localStorage.setItem(STORAGE_KEYS.EMAIL, user.email);
    localStorage.setItem(STORAGE_KEYS.NAME, user.name);
    localStorage.setItem(STORAGE_KEYS.ROLE, user.role);
    localStorage.setItem(STORAGE_KEYS.WORKSPACE_ID, user.workspace_id);

    localStorage.setItem(STORAGE_KEYS.SHIFT_ID, user.shift_id);
    localStorage.setItem(STORAGE_KEYS.SHIFT_NAME, user.shift_name);
    localStorage.setItem(STORAGE_KEYS.DEPT_NAME, user.dept_name);
    localStorage.setItem(STORAGE_KEYS.START_TIME, user.start_time);
    localStorage.setItem(STORAGE_KEYS.END_TIME, user.end_time);
    localStorage.setItem(STORAGE_KEYS.GRACE, String(user.grace));

    return user;
  }

  function getCurrentUser() {
    return (
      APP.user || {
        user_id: localStorage.getItem(STORAGE_KEYS.USER_ID) || "",
        email: DISPLAY.email(localStorage.getItem(STORAGE_KEYS.EMAIL) || ""),
        name: DISPLAY.name(localStorage.getItem(STORAGE_KEYS.NAME) || ""),
        role: DISPLAY.lower(localStorage.getItem(STORAGE_KEYS.ROLE) || "guest"),

        workspace_id: localStorage.getItem(STORAGE_KEYS.WORKSPACE_ID) || "",
        dept_name: DISPLAY.label(localStorage.getItem(STORAGE_KEYS.DEPT_NAME) || ""),

        shift_id: localStorage.getItem(STORAGE_KEYS.SHIFT_ID) || "",
        shift_name: DISPLAY.label(localStorage.getItem(STORAGE_KEYS.SHIFT_NAME) || ""),
        start_time: localStorage.getItem(STORAGE_KEYS.START_TIME) || "",
        end_time: localStorage.getItem(STORAGE_KEYS.END_TIME) || "",
        grace: Number(localStorage.getItem(STORAGE_KEYS.GRACE) || 0),
      }
    );
  }

  function getCurrentShift() {
    const user = getCurrentUser();

    return normalizeShift({
      shift_id: user.shift_id || "",
      shift_name: user.shift_name || "",
      start_time: user.start_time || "",
      end_time: user.end_time || "",
      grace_minutes: Number(user.grace || 0),
    });
  }

  function restoreSessionLite() {
    const user_id = localStorage.getItem(STORAGE_KEYS.USER_ID);
    const email = localStorage.getItem(STORAGE_KEYS.EMAIL);
    const role = localStorage.getItem(STORAGE_KEYS.ROLE);
    const workspace_id = localStorage.getItem(STORAGE_KEYS.WORKSPACE_ID);

    if (!user_id || !email || !role || !workspace_id) {
      APP.user = null;
      APP.role = "guest";
      APP.currentPage = "login";
      return;
    }

    APP.user = getCurrentUser();
    APP.role = DISPLAY.lower(APP.user.role || "guest");

    const lastPage = localStorage.getItem(STORAGE_KEYS.LAST_PAGE);

    const isAdmin = APP.role === "admin" || APP.role === "owner";
    const allowedPages = ["dashboard", "admin", "reports"];

    if (isAdmin) {
      UserInit?.();
      bootstrapSettings().catch(console.error);
    }

    APP.currentPage = allowedPages.includes(lastPage) ? lastPage : isAdmin ? "admin" : "dashboard";
  }

  // =====================================================
  // HEADER
  // =====================================================

  function renderUserHeader() {
    const user = getCurrentUser();

    const name = DISPLAY.name(user.name || "User");
    const deptName = user.dept_name
      ? `${DISPLAY.label(user.dept_name)} Department`
      : "-- Department --";

    const shift = getCurrentShift();
    const shiftLabel =
      shift.start_time && shift.end_time
        ? formatShiftLabel(shift, { timeOnly: true })
        : "--:-- - --:--";

    const usernameEl = document.getElementById("currUsername");
    if (usernameEl) usernameEl.textContent = name;

    const deptNameEl = document.getElementById("currDepartment");
    if (deptNameEl) deptNameEl.textContent = deptName;

    const shiftEl = document.getElementById("currShiftLabel");
    if (shiftEl) shiftEl.textContent = shiftLabel;

    const initials = name
      .split(" ")
      .map((part) => part?.[0] || "")
      .join("")
      .substring(0, 2)
      .toUpperCase();

    const initialsEl = document.getElementById("currInitials");
    if (initialsEl) initialsEl.textContent = initials || "--";

    const statusEl = document.getElementById("globalStatusText");
    if (statusEl) {
      statusEl.textContent = DISPLAY.status(APP.workStatus || "NOT STARTED");
    }
  }

  async function bootstrapSettings(force = false) {
    const workspace_id = getCurrentUser()?.workspace_id;

    if (!workspace_id) {
      APP.settings = {};
      APP.settingsLoaded = false;
      return;
    }

    if (APP.settingsLoaded && !force) {
      return APP.settings;
    }

    try {
      APP.settings = await SettingsAPI.getAll();
      APP.settingsLoaded = true;

      // ============================================
      // Apply workspace timezone
      // ============================================
      const timezone = APP.settings.find((s) => s.key === "TIMEZONE")?.value || "America/New_York";

      setAppTimezone(timezone);

      return APP.settings;
    } catch (err) {
      APP.settings = {};
      APP.settingsLoaded = false;
      throw err;
    }
  }

  function resetLoginForm() {
    const form = document.getElementById("loginForm");

    if (!form) return;

    form.querySelectorAll("input, button, select, textarea").forEach((el) => {
      el.disabled = false;
    });
  }

  function resetSettings() {
    APP.settings = {};
    APP.settingsLoaded = false;
  }
</script>
