<script>

// =====================================================
// LOGIN HANDLER
// =====================================================

document.getElementById("loginForm")?.addEventListener("submit", (e) => {
  e.preventDefault();

  const data = window.SERVER_DATA
    ? JSON.parse(window.SERVER_DATA)
    : {};

  const workspaceSlug = data.workspaceSlug || "";

  const email =
    document.getElementById("email")?.value ||
    data.email ||
    "";

  const sid =
    document.getElementById("sid")?.value || "";

  if (!email) {
    showToast?.("Email is required", "warning");
    return;
  }

  showLoader?.();

  google.script.run
    .withSuccessHandler(handleLoginSuccess)
    .withFailureHandler(handleLoginError)
    .loginResolver(workspaceSlug, email);
});


// =====================================================
// LOGIN SUCCESS
// =====================================================

function handleLoginSuccess(result) {

  hideLoader?.();

  if (!result) {
    showToast?.("Invalid login response", "error");
    return;
  }

  const user = setCurrentUser(result);

  console.log("LOGIN USER:", user);

  renderUserHeader();
  applyRoleUI?.();

  // IMPORTANT: set initial route ONCE
  const isAdmin = APP.role === "admin" || APP.role === "owner";

  if (isAdmin) {
    showToast?.("Welcome Admin Panel", "success");
    UserInit?.();
    go("admin");
  } else {
    showToast?.("Welcome Dashboard", "success");
    go("dashboard");
  }
}


// =====================================================
// LOGIN ERROR
// =====================================================

function handleLoginError(err) {

  hideLoader?.();

  console.error("LOGIN ERROR:", err);

  showToast?.(
    err?.message || "Login failed. Please try again.",
    "error"
  );

  go("login");
}


// =====================================================
// LOGOUT
// =====================================================

function logout() {

  localStorage.clear();

  APP.user = null;
  APP.role = "guest";
  APP.currentPage = "login";

  showToast?.("Logged out successfully", "info");

  go("login");
}


// =====================================================
// SESSION RESTORE (FIXED)
// =====================================================

function restoreSession() {

  const email = localStorage.getItem("email");

  if (!email) {
    go("login");
    return;
  }

  const user = getCurrentUser();

  APP.user = user;
  APP.role = (user.role || "guest").toLowerCase();

  renderUserHeader();
  applyRoleUI?.();

  const isAdmin = APP.role === "admin" || APP.role === "owner";

  // ==============================
  // PRIORITY 1: last visited page
  // ==============================
  const lastPage = localStorage.getItem("last_page");

  const validAdminPages = ["admin", "dashboard"];
  const validUserPages = ["dashboard"];

  let targetPage = "dashboard";

  if (isAdmin) {
    UserInit?.();
    targetPage = validAdminPages.includes(lastPage)
      ? lastPage
      : "admin"; // fallback for admin
  } else {
    targetPage = validUserPages.includes(lastPage)
      ? lastPage
      : "dashboard";
  }

  go(targetPage);
}


// =====================================================
// USER STATE
// =====================================================

function setCurrentUser(result) {

  if (!result) return null;

  const user = {
    user_id: result.user_id || "",
    email: result.email || "",
    name: result.fullname || result.name || "",
    role: (result.role || "guest").toLowerCase(),
    shift_id: result.shift_id || ""
  };

  APP.user = user;
  APP.role = user.role;

  localStorage.setItem("user_id", user.user_id);
  localStorage.setItem("email", user.email);
  localStorage.setItem("name", user.name);
  localStorage.setItem("role", user.role);
  localStorage.setItem("workspace_id", result.workspace_id || "");
  localStorage.setItem("shift_id", user.shift_id);

  return user;
}


// =====================================================
// GET USER
// =====================================================

function getCurrentUser() {

  return APP.user || {
    user_id: localStorage.getItem("user_id") || "",
    email: localStorage.getItem("email") || "",
    name: localStorage.getItem("name") || "",
    role: localStorage.getItem("role") || "guest",
    shift_id: localStorage.getItem("shift_id") || ""
  };
}


// =====================================================
// HEADER
// =====================================================

function renderUserHeader() {

  const user = getCurrentUser();

  const name = user.name || "User";

  const usernameEl = document.getElementById("currUsername");
  if (usernameEl) usernameEl.textContent = name;

  const initials = name
    .split(" ")
    .map(n => n?.[0] || "")
    .join("")
    .substring(0, 2)
    .toUpperCase();

  const initialsEl = document.getElementById("currInitials");
  if (initialsEl) initialsEl.textContent = initials;

  // IMPORTANT: do NOT hardcode fake status here
  const statusEl = document.getElementById("currWorkStatus");
  if (statusEl) {
    statusEl.textContent = APP.workStatus || "NOT STARTED";
  }
}

</script>
