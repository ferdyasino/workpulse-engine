<script>

document.getElementById("loginForm")?.addEventListener("submit", (e) => {
  e.preventDefault();

  const data = window.SERVER_DATA
    ? JSON.parse(window.SERVER_DATA)
    : {};

  const workspaceSlug = data.workspaceSlug || "";
  const email =
    document.getElementById("email")?.value ||
    data.email ||
    "";

  const sid =
    document.getElementById("sid")?.value ||
    "";

  console.log("SERVER_DATA:", data);
  console.log("workspaceSlug:", workspaceSlug);
  console.log("email:", email);
  console.log("sid:", sid);

  if (!email) {
    showToast?.("Email is required", "warning");
    return;
  }

  showLoader?.();
  showToast?.("Logging in...", "info");

  google.script.run
    .withSuccessHandler(handleLoginSuccess)
    .withFailureHandler(handleLoginError)
    .loginResolver(
      workspaceSlug, // can be blank
      email
    );
});

// =====================================================
// LOGIN SUCCESS
// =====================================================

function handleLoginSuccess(result) {

  hideLoader?.();

  if (!result) {
    showToast?.("Invalid login response", "error");
    return;
  }

  const user = setCurrentUser(result);

  console.log("CURRENT USER:", user);

  showToast?.("Login successful", "success");

  applyRoleUI?.();

  if (APP.role === "admin" || APP.role === "owner") {
    showToast?.("Welcome Admin Panel", "info");
  } else {
    showToast?.("Welcome Dashboard", "success");
  }

  UserInit();
  
  go("dashboard");
}

// =====================================================
// LOGIN ERROR
// =====================================================

function handleLoginError(err) {

  hideLoader?.();

  console.error("LOGIN ERROR:", err);

  showToast?.(
    err?.message || "Login failed. Please try again.",
    "error"
  );

  go("login");
}

// =====================================================
// LOGOUT
// =====================================================

function logout() {

  localStorage.clear();

  APP.user = null;
  APP.role = "guest";
  APP.currentPage = "login";

  showToast?.("Logged out successfully", "info");

  go("login");
}

// =====================================================
// SESSION RESTORE
// =====================================================

function restoreSession() {

  const email = localStorage.getItem("email");

  if (!email) {
    showToast?.("Please login to continue", "info");
    go("login");
    return;
  }

  APP.user = {
    email,
    name: localStorage.getItem("name") || ""
  };

  APP.role = (
    localStorage.getItem("role") || "guest"
  ).toLowerCase();

  applyRoleUI?.();

  showToast?.("Welcome back", "success");

  go("dashboard");
}

// =====================================================
// USER STATE
// =====================================================

function setCurrentUser(result) {

  if (!result) return null;

  const user = {
    user_id: result.user_id || "",
    email: result.email || "",
    name: result.fullname || result.name || "",
    role: (result.role || "guest").toLowerCase(),
    workspace_id: result.workspace_id || "",
    timelog_spreadsheet_id:
      result.timelog_spreadsheet_id || ""
  };

  APP.user = user;
  APP.role = user.role;

  localStorage.setItem("user_id", user.user_id);
  localStorage.setItem("email", user.email);
  localStorage.setItem("name", user.name);
  localStorage.setItem("role", user.role);
  localStorage.setItem("workspace_id", user.workspace_id);
  localStorage.setItem(
    "timelog_spreadsheet_id",
    user.timelog_spreadsheet_id
  );

  return user;
}

function getCurrentUser() {

  return APP.user || {
    user_id: localStorage.getItem("user_id") || "",
    email: localStorage.getItem("email") || "",
    name: localStorage.getItem("name") || "",
    role: localStorage.getItem("role") || "guest",
    workspace_id:
      localStorage.getItem("workspace_id") || "",
    timelog_spreadsheet_id:
      localStorage.getItem("timelog_spreadsheet_id") || ""
  };
}

// =====================================================
// HEADER
// =====================================================

function renderUserHeader() {

  const user = getCurrentUser();

  const name = user.name || "Guest User";

  const usernameEl =
    document.getElementById("currUsername");

  if (usernameEl) {
    usernameEl.textContent = name;
  }

  const initials = name
    .split(" ")
    .map(n => n[0])
    .join("")
    .substring(0, 2)
    .toUpperCase();

  const initialsEl =
    document.getElementById("currInitials");

  if (initialsEl) {
    initialsEl.textContent = initials;
  }

  const statusEl =
    document.getElementById("currWorkStatus");

  if (statusEl) {
    statusEl.textContent =
      APP.workStatus || "Not Started";
  }
}

</script>
