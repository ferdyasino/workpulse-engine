<div class="page-container">
  <div class="row g-4">
    <!-- =====================================================
         LEFT SIDEBAR
    ====================================================== -->
    <div class="col-12 col-lg-3">
      <div class="glass glass-card sticky-top" style="top: 16px">
        <div class="p-3 border-bottom">
          <div class="d-flex align-items-center">
            <div class="me-3">
              <i class="bi bi-sliders fs-3"></i>
            </div>

            <div>
              <div class="fw-bold">Workspace Settings</div>

              <small class="text-muted"> Configure your workspace </small>
            </div>
          </div>
        </div>

        <div class="list-group list-group-flush">
          <button
            class="list-group-item list-group-item-action active d-flex align-items-center"
            onclick="renderSettingsGroup('ALL', this)"
          >
            <i class="bi bi-grid me-2"></i>
            <span>All Settings</span>
          </button>

          <button
            class="list-group-item list-group-item-action d-flex align-items-center"
            onclick="renderSettingsGroup('PAYROLL', this)"
          >
            <i class="bi bi-cash-stack me-2"></i>
            <span>Payroll</span>
          </button>

          <button
            class="list-group-item list-group-item-action d-flex align-items-center"
            onclick="renderSettingsGroup('ATTENDANCE', this)"
          >
            <i class="bi bi-clock-history me-2"></i>
            <span>Attendance</span>
          </button>

          <button
            class="list-group-item list-group-item-action d-flex align-items-center"
            onclick="renderSettingsGroup('SYSTEM', this)"
          >
            <i class="bi bi-gear me-2"></i>
            <span>System</span>
          </button>

          <button
            class="list-group-item list-group-item-action d-flex align-items-center"
            onclick="renderSettingsGroup('WORKSPACE', this)"
          >
            <i class="bi bi-building me-2"></i>
            <span>Workspace</span>
          </button>
        </div>
      </div>
    </div>

    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->
    <div class="col-12 col-lg-9">
      <div class="glass glass-card">
        <!-- HEADER -->
        <div class="p-4 border-bottom">
          <div
            class="d-flex justify-content-between align-items-start flex-wrap gap-3"
          >
            <div>
              <h4 class="mb-1">Workspace Settings</h4>

              <div class="text-muted">
                Configure payroll, attendance and workspace behaviour.
              </div>
            </div>

            <div class="text-end">
              <div class="small text-muted">Current Workspace</div>

              <div id="settingsWorkspaceName" class="fw-semibold">—</div>
            </div>
          </div>
        </div>

        <!-- BODY -->
        <div class="p-4">
          <!-- Loading -->

          <div id="settingsLoading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>

            <div class="mt-3 text-muted">Loading workspace settings...</div>
          </div>

          <!-- Render Target -->

          <div id="settingsContent" class="d-none"></div>
        </div>
      </div>
    </div>
  </div>
</div>
