<div class="page-container">

  <div class="row g-4">

    <!-- =========================
         LEFT PANEL
    ========================== -->
    <div class="col-lg-4">

      <!-- CLOCK -->
      <div id="dashboardClockHost">
        <div class="glass glass-card text-center p-3">

          <div id="dashboardClockTime"
               class="dashboard-clock-time">
            00:00:00
          </div>

          <div id="dashboardClockDate"
               class="text-muted-custom dashboard-clock-date">
            ---
          </div>

        </div>
      </div>

      <!-- TODAY SUMMARY -->
      <div id="dashboardSummaryHost" class="mt-4">

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">Today Summary</h5>
        </div>

        <div class="glass glass-card p-3">

          <div id="dashboardSummaryList">

            <div class="d-flex justify-content-between py-1">
              <span>Status</span>
              <strong id="summaryStatus">--</strong>
            </div>

            <div class="d-flex justify-content-between py-1">
              <span>Time In</span>
              <strong id="summaryTimeIn">--</strong>
            </div>

            <div class="d-flex justify-content-between py-1">
              <span>Time Out</span>
              <strong id="summaryTimeOut">--</strong>
            </div>

          </div>

        </div>

      </div>

      <!-- BREAK ACTIVITY (FIXED NAME) -->
      <div id="dashboardRecentHost" class="mt-4">

        <h5 class="mb-2">Break Activity</h5>

        <div class="glass glass-card p-3">

          <div id="leftTimelogsList">
            <div class="text-muted-custom">No breaks yet</div>
          </div>

        </div>

      </div>

    </div>

    <!-- =========================
         RIGHT PANEL
    ========================== -->
    <div class="col-lg-8">

  <!-- HEADER -->
  <div class="glass glass-card mb-4 p-4">

    <div class="d-flex align-items-center justify-content-between">

      <!-- LEFT: USER INFO -->
      <div>
        <div class="d-flex align-items-center gap-2 mb-1">

          <div class="avatar-circle">
            <span id="currInitials">GU</span>
          </div>

          <h3 id="currUsername" class="mb-0 fw-bold">
            GUEST USER
          </h3>

        </div>

        <div class="text-muted-custom">
          <i class="bi bi-circle-fill me-1 small"></i>
          <span id="currWorkStatus">Not Started</span>
        </div>
      </div>

      <!-- RIGHT: BADGE -->
      <div class="text-end">
        <span class="badge bg-success px-3 py-2">
          Active Session
        </span>
      </div>

    </div>

  </div>

      <!-- TIMELINE -->
      <div id="dashboardTimelineHost">

        <div class="glass glass-card p-3">

          <div class="d-flex justify-content-between align-items-center mb-3">

            <h5 class="mb-0">Full Timeline</h5>

          </div>

          <div id="dashboardTimelogsList">
            <div class="text-muted-custom">No logs yet</div>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
