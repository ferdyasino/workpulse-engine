<div class="page-container">

  <div class="row g-4">

    <!-- =========================
         LEFT PANEL
    ========================== -->
    <div class="col-lg-4">

      <!-- CLOCK -->
      <div id="dashboardClockHost">
        <div class="glass glass-card text-center p-3">

          <div id="dashboardClockTime"
               class="dashboard-clock-time">
            00:00:00
          </div>

          <div id="dashboardClockDate"
               class="text-muted-custom dashboard-clock-date">
            ---
          </div>

        </div>
      </div>

      <!-- SUMMARY -->
      <div id="dashboardSummaryHost" class="mt-4">

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">Today Summary</h5>
          <span id="logStatusLabel" class="text-muted-custom"></span>
        </div>

        <div class="glass glass-card p-3">

          <div id="dashboardSummaryList">
            <div class="text-muted-custom">No activity yet</div>
          </div>

        </div>

      </div>

      <!-- RECENT ACTIVITY -->
      <div id="dashboardRecentHost" class="mt-4">

        <h5 class="mb-2">Recent Activity</h5>

        <div class="glass glass-card p-3">

          <div id="leftTimelogsList">
            <div class="text-muted-custom">No recent logs</div>
          </div>

        </div>

      </div>

    </div>

    <!-- =========================
         RIGHT PANEL
    ========================== -->
    <div class="col-lg-8">

      <!-- HEADER -->
      <div class="glass glass-card mb-4 p-3">

        <h4 id="dashboardTitle" class="mb-1">Dashboard</h4>

        <p class="text-muted-custom mb-0">
          Track your attendance activity in real time
        </p>

      </div>

      <!-- TIMELINE -->
      <div id="dashboardTimelineHost">

        <div class="glass glass-card p-3">

          <div class="d-flex justify-content-between align-items-center mb-3">

            <h5 class="mb-0">Full Timeline</h5>

            <span class="text-muted-custom small">
              Live updates
            </span>

          </div>

          <div id="dashboardTimelogsList">
            <div class="text-muted-custom">No logs yet</div>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
