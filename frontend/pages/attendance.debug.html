<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Attendance Engine Debugger</h3>
  </div>

  <div class="row g-3">
    <!-- Employee -->
    <div class="col-lg-4">
      <label class="form-label">Employee</label>

      <select id="attendanceUser" class="form-select"></select>
    </div>

    <!-- Shift -->
    <div class="col-lg-4">
      <label class="form-label">Shift</label>

      <select id="attendanceShift" class="form-select"></select>

      <div class="form-text">Defaults to the employee's assigned shift but can be overridden.</div>
    </div>

    <div class="col-lg-3">
      <label class="form-label">Timezone</label>

      <select id="attendanceTimezone" class="form-select"></select>

      <div class="form-text">Overrides the workspace timezone for debugging.</div>
    </div>

    <!-- Start Date -->
    <div class="col-lg-2">
      <label class="form-label">Start Date</label>

      <input id="attendanceStartDate" class="form-control" type="date" />
    </div>

    <!-- End Date -->
    <div class="col-lg-2">
      <label class="form-label">End Date</label>

      <input id="attendanceEndDate" class="form-control" type="date" />
    </div>
  </div>

  <div class="mt-4 d-flex gap-2">
    <button id="attendanceRun" class="btn btn-primary">
      <i class="bi bi-play-fill me-1"></i>
      Run Attendance Engine
    </button>

    <button
      id="attendanceToday"
      type="button"
      class="btn btn-outline-secondary"
      onclick="
        const today = new Date().toISOString().substring(0, 10);
        document.getElementById('attendanceStartDate').value = today;
        document.getElementById('attendanceEndDate').value = today;
      "
    >
      Today
    </button>

    <button
      id="attendanceLast7"
      type="button"
      class="btn btn-outline-secondary"
      onclick="
        const end = new Date();
        const start = new Date();
        start.setDate(end.getDate() - 6);

        document.getElementById('attendanceStartDate').value = start.toISOString().substring(0, 10);
        document.getElementById('attendanceEndDate').value = end.toISOString().substring(0, 10);
      "
    >
      Last 7 Days
    </button>

    <button
      id="attendanceThisMonth"
      type="button"
      class="btn btn-outline-secondary"
      onclick="
        const now = new Date();
        const first = new Date(now.getFullYear(), now.getMonth(), 1);

        document.getElementById('attendanceStartDate').value = first.toISOString().substring(0, 10);
        document.getElementById('attendanceEndDate').value = now.toISOString().substring(0, 10);
      "
    >
      This Month
    </button>
  </div>

  <hr />

  <pre
    id="attendanceResult"
    style="
      min-height: 650px;
      background: #111;
      color: #00ff66;
      padding: 20px;
      border-radius: 8px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.45;
    "
  ></pre>
</div>
