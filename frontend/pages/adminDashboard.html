<div class="page-container">

  <!-- =========================
       DASHBOARD STATS
  ========================== -->
  <div class="row g-4">

    <div class="col-md-3">
      <div class="glass glass-card text-center">
        <h6 class="text-secondary-custom">Total Users</h6>
        <h1 id="totalUsers">0</h1>
      </div>
    </div>

    <div class="col-md-3">
      <div class="glass glass-card text-center">
        <h6 class="text-secondary-custom">Active Users</h6>
        <h1 id="activeUsers">0</h1>
      </div>
    </div>

    <div class="col-md-3">
      <div class="glass glass-card text-center">
        <h6 class="text-secondary-custom">Present Today</h6>
        <h1 id="presentToday">0</h1>
      </div>
    </div>

    <div class="col-md-3">
      <div class="glass glass-card text-center">
        <h6 class="text-secondary-custom">Late / Absent</h6>
        <h1 id="lateAbsent">0</h1>
      </div>
    </div>

  </div>

  <!-- =========================
       EMPLOYEE TABLE SECTION
  ========================== -->
  <div class="glass glass-card mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

      <h5 class="mb-0">Employee Records</h5>

      <div class="d-flex gap-2">

        <button id="btnRefreshUsers" class="btn btn-primary btn-sm" onclick="loadReferenceData()">
          Refresh
        </button>

        <button id="btnAddUser" class="btn btn-primary btn-sm" onclick="openCreateUser()">
          Add Employee
        </button>

      </div>
    </div>

    <!-- =========================
         TABLE
    ========================== -->
    <div class="table-responsive">

      <table class="table align-middle">

        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>

            <!-- READY FOR FUTURE EXTENSIONS -->
            <th>Department</th>
            <th>Position</th>
            <th>Shift</th>

            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>

        <tbody id="usersTableBody">

          <!-- EMPTY STATE (controlled by JS) -->
          <tr>
            <td colspan="8" class="text-center text-muted py-4">
              No employees loaded
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
