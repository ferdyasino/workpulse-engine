<div id="appTopbar" class="topbar">
  <div id="dashboardTitle" class="topbar-left">Dashboard</div>

  <div class="topbar-center">
    <div id="adminClockContainer" class="text-center d-none admin-clock">
      <div id="adminClockTime" class="admin-clock-time">--:--:--</div>

      <div id="adminClockDate" class="admin-clock-date">---</div>
    </div>
  </div>

  <div class="topbar-right d-flex align-items-center gap-2">
    <span class="status-dot"></span>
    <span>Online</span>

    <div class="dropdown">
      <button
        class="btn btn-glass btn-sm dropdown-toggle"
        data-bs-toggle="dropdown"
      >
        ⚙
      </button>

      <ul class="dropdown-menu dropdown-menu-end">
        <li id="dashDropId">
          <button class="dropdown-item" onclick="go('dashboard')">
            <i class="bi bi-menu-button-wide me-2"></i>
            Dashboard
          </button>
        </li>

        <li id="adminMenuItem" class="d-none">
          <button class="dropdown-item" onclick="go('admin')">
            <i class="bi bi-menu-button-wide-fill me-2"></i>
            Admin Dashboard
          </button>
        </li>

        <li id="reportsId">
          <button class="dropdown-item" onclick="go('reports')">
            <i class="bi bi-file-earmark-bar-graph me-2"></i>
            Reports
          </button>
        </li>
        <li id="adminSettings" class="d-none">
          <button class="dropdown-item" onclick="go('settings')">
            <i class="bi bi-gear me-2"></i>Settings
          </button>
        </li>

        <li><hr class="dropdown-divider" /></li>

        <li>
          <button class="dropdown-item text-danger" onclick="logout()">
            <i class="bi bi-door-closed text-danger me-2"></i>
            Logout
          </button>
        </li>
      </ul>
    </div>
  </div>
</div>
