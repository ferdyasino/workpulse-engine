<div id="appTopbar" class="topbar glass">

  <div id="dashboardTitle" class="topbar-left">
    Dashboard
  </div>

  <div class="topbar-center">

  <div id="adminClockContainer" class="text-center d-none admin-clock">
    
    <div id="adminClockTime" class="admin-clock-time">
      --:--:--
    </div>

    <div id="adminClockDate" class="admin-clock-date">
      ---
    </div>

  </div>

  </div>

  <div class="topbar-right">
    <span class="status-dot"></span>
    <span>Online</span>
    <button
      class="btn btn-glass btn-sm d-none"
      onclick="toggleDashboard()"
      id="roleSwitchBtn"
      title="Switch Dashboard"
    >
      <span>⇄</span>
    </button>
    <button
      class="btn btn-glass-danger btn-sm"
      onclick="logout()"
      id="logoutBtn">
      Logout
    </button>
  </div>


</div>
