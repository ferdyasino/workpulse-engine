<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet">

<style>

/* =====================================================
   THEME
===================================================== */

:root {

  /* BRAND */
  --primary: #38bdf8;
  --primary-hover: #0ea5e9;

  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --secondary: #64748b;

  /* BACKGROUND */

  --bg-1: #020617;
  --bg-2: #0f172a;
  --bg-3: #1e293b;
  --bg-4: #334155;

  /* TEXT */

  --text-main: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;

  /* GLASS */

  --glass-bg: rgba(255,255,255,.08);
  --glass-bg-strong: rgba(255,255,255,.12);

  --glass-border: rgba(255,255,255,.15);

  /* EFFECTS */

  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;

  --blur: 14px;

  --shadow-sm:
    0 4px 12px rgba(0,0,0,.15);

  --shadow-md:
    0 8px 24px rgba(0,0,0,.25);

  --shadow-lg:
    0 12px 32px rgba(0,0,0,.35);
}

/* =====================================================
   GLOBAL
===================================================== */

html,
body {
  height: 100%;
}

body {

  min-height: 100vh;

  color: var(--text-main);

  background:
    radial-gradient(
      circle at top,
      var(--bg-3),
      var(--bg-1)
    );

  background-attachment: fixed;
}

/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.15);
  border-radius: 999px;
}

/* =====================================================
   GLASS
===================================================== */

.glass {

  background: var(--glass-bg);

  border: 1px solid var(--glass-border);

  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));

  border-radius: var(--radius-md);

  box-shadow: var(--shadow-md);
}

.glass-strong {
  background: var(--glass-bg-strong);
}

/* =====================================================
   CARDS
===================================================== */

.glass-card {

  padding: 1.5rem;

  transition: .2s ease;
}

.glass-card:hover {

  transform: translateY(-2px);

  box-shadow: var(--shadow-lg);
}

/* =====================================================
   TYPOGRAPHY
===================================================== */

.text-muted-custom {
  color: var(--text-muted);
}

.text-secondary-custom {
  color: var(--text-secondary);
}

/* =====================================================
   FORMS
===================================================== */

.form-control,
.form-select {

  background:
    rgba(255,255,255,.05);

  border:
    1px solid rgba(255,255,255,.12);

  color:
    var(--text-main);

  border-radius:
    var(--radius-sm);
}

.form-control::placeholder {
  color: var(--text-muted);
}

.form-control:focus,
.form-select:focus {

  background:
    rgba(255,255,255,.08);

  color:
    var(--text-main);

  border-color:
    var(--primary);

  box-shadow:
    0 0 0 .25rem
    rgba(56,189,248,.15);
}

/* =====================================================
   BUTTONS
===================================================== */

.btn {
  border-radius: var(--radius-sm);
}

.btn-primary {

  background:
    var(--primary);

  border-color:
    var(--primary);
}

.btn-primary:hover {

  background:
    var(--primary-hover);

  border-color:
    var(--primary-hover);
}

.btn-glass {

  background:
    rgba(255,255,255,.05);

  color:
    var(--text-main);

  border:
    1px solid rgba(255,255,255,.12);
}

.btn-glass:hover {

  background:
    rgba(255,255,255,.10);
}

.btn-glass-danger {

  background: rgba(239,68,68,.12);

  color: #fca5a5;

  border: 1px solid rgba(239,68,68,.25);

  transition: .2s;
}

.btn-glass-danger:hover {

  background: rgba(239,68,68,.2);

  color: #fff;

  transform: translateY(-1px);
}

/* =====================================================
   TABLES
===================================================== */

.table {

  color:
    var(--text-main);

  margin-bottom: 0;
}

.table th {

  color:
    var(--text-secondary);

  border-color:
    rgba(255,255,255,.08);
}

.table td {

  border-color:
    rgba(255,255,255,.08);
}

/* =====================================================
   BADGES
===================================================== */

.badge-success {

  background:
    rgba(34,197,94,.15);

  color:
    var(--success);
}

.badge-warning {

  background:
    rgba(245,158,11,.15);

  color:
    var(--warning);
}

.badge-danger {

  background:
    rgba(239,68,68,.15);

  color:
    var(--danger);
}

/* =====================================================
   TOPBAR
===================================================== */

.app-topbar {

  position: sticky;

  top: 0;

  z-index: 1000;

  margin: 12px;
  padding: 14px 20px;
}


.topbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 12px 20px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.topbar-left {
  font-weight: 600;
}

.topbar-center {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}

#adminClockContainer {
  pointer-events: auto;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* =====================================================
   SIDEBAR
===================================================== */

.app-sidebar {

  min-height: calc(100vh - 40px);

  padding: 1rem;
}

.sidebar-link {

  display: block;

  text-decoration: none;

  color: var(--text-secondary);

  padding: 12px;

  border-radius: 12px;

  transition: .2s;
}

.sidebar-link:hover {

  color: var(--text-main);

  background:
    rgba(255,255,255,.08);
}

/* =====================================================
   MODALS
===================================================== */

.modal-content {

  background:
    rgba(15,23,42,.95);

  color:
    var(--text-main);

  border:
    1px solid rgba(255,255,255,.12);

  border-radius:
    var(--radius-md);
}

/* =====================================================
   LOADER
===================================================== */

.loader {

  width: 48px;
  height: 48px;

  border:
    4px solid rgba(255,255,255,.15);

  border-top:
    4px solid var(--primary);

  border-radius: 50%;

  animation:
    spin 1s linear infinite;
}

@keyframes spin {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

/* =====================================================
   PAGE
===================================================== */

.page-container {

  max-width: 1400px;

  margin: auto;

  padding: 24px;
}

/* =====================================================
   CLOCK CARD
===================================================== */

.clock-card {

  width: 280px;

  padding: 20px;

  margin: auto;

  text-align: center;
}

/* =====================================================
   ANALOG CLOCK
===================================================== */

.analog-clock {
  display: block;
}

.clock-face {

  width: 220px;
  height: 220px;

  margin: auto;

  position: relative;

  border-radius: 50%;

  background:
    rgba(255,255,255,.04);

  border:
    2px solid rgba(255,255,255,.12);

  box-shadow:
    inset 0 0 20px rgba(255,255,255,.05),
    0 10px 30px rgba(0,0,0,.3);
}

.center-dot {

  width: 14px;
  height: 14px;

  background: var(--primary);

  border-radius: 50%;

  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  z-index: 100;
}

.hand {

  position: absolute;

  left: 50%;
  bottom: 50%;

  transform-origin: bottom center;
}

.hour {

  width: 6px;
  height: 60px;

  background: #fff;

  border-radius: 10px;
}

.minute {

  width: 4px;
  height: 85px;

  background: #cbd5e1;

  border-radius: 10px;
}

.second {

  width: 2px;
  height: 95px;

  background: #38bdf8;

  border-radius: 10px;
}

.mark {

  position: absolute;

  font-weight: 600;

  color: white;
}

.m12 {
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
}

.m3 {
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
}

.m6 {
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
}

.m9 {
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
}

.clock-date {

  margin-top: 15px;

  color: var(--text-secondary);
}

/* =====================================================
   DIGITAL TOPBAR CLOCK
===================================================== */

.digital-clock {

  font-size: 1.1rem;

  font-weight: 700;

  color: var(--text-main);

  white-space: nowrap;
}

/* =====================================================
   ADMIN CLOCK (FIXED LARGE DISPLAY)
===================================================== */

#adminClockContainer {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 180px;
}

/* BIG TIME */
#adminClockTime {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 1px;
  line-height: 1;
  color: var(--text-main);
  text-shadow: 0 0 10px rgba(56,189,248,.25);
}

/* DATE UNDER IT */
#adminClockDate {
  font-size: 13px;
  margin-top: 4px;
  color: var(--text-muted);
}

/* =====================================================
   DASHBOARD CLOCK (MAIN PANEL)
===================================================== */

.dashboard-clock-time {
  font-size: 44px;
  font-weight: 900;
  letter-spacing: 1px;
  line-height: 1.1;
  color: var(--text-main);
  text-shadow: 0 0 12px rgba(56,189,248,.25);
}

.dashboard-clock-date {
  font-size: 14px;
  margin-top: 6px;
  color: var(--text-muted);
}

/* =====================================================
   TOAST SYSTEM
===================================================== */

.toast-host {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast-item {
  min-width: 260px;
  max-width: 340px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(255,255,255,.12);
  color: var(--text-main);
  animation: toastIn .25s ease;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.toast-success {
  background: rgba(34,197,94,.15);
  border-color: rgba(34,197,94,.35);
}

.toast-error {
  background: rgba(239,68,68,.15);
  border-color: rgba(239,68,68,.35);
}

.toast-info {
  background: rgba(56,189,248,.15);
  border-color: rgba(56,189,248,.35);
}

.toast-warning {
  background: rgba(245,158,11,.15);
  border-color: rgba(245,158,11,.35);
}

.toast-close {
  cursor: pointer;
  opacity: .7;
  margin-left: 10px;
}

.toast-close:hover {
  opacity: 1;
}

@keyframes toastIn {
  from { transform: translateY(-8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes toastOut {
  to { transform: translateY(-6px); opacity: 0; }
}

</style>
