<style>

/* =====================================================
   DESIGN TOKENS (implicit usage)
===================================================== */
/* var(--glass-bg), --radius-sm, --radius-md, --blur, etc. */

/* =====================================================
   GLASS SYSTEM
===================================================== */

.glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
}

.glass-strong {
  background: var(--glass-bg-strong);
}

.glass-card {
  padding: 1.5rem;
  transition: .2s ease;
}

.glass-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

/* =====================================================
   FORMS (BASE)
===================================================== */

.form-control,
.form-select {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.12);
  color: var(--text-main);
  border-radius: var(--radius-sm);
}

.form-control::placeholder {
  color: var(--text-muted);
}

.form-control:focus,
.form-select:focus {
  background: rgba(255,255,255,.08);
  color: var(--text-main);
  border-color: var(--primary);
  box-shadow: 0 0 0 .25rem rgba(56,189,248,.15);
}

/* =====================================================
   BUTTONS
===================================================== */

.btn {
  border-radius: var(--radius-sm);
}

.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
}

.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.btn-glass {
  background: rgba(255,255,255,.05);
  color: var(--text-main);
  border: 1px solid rgba(255,255,255,.12);
}

.btn-glass:hover {
  background: rgba(255,255,255,.10);
}

.btn-glass-danger {
  background: rgba(239,68,68,.12);
  color: #fca5a5;
  border: 1px solid rgba(239,68,68,.25);
}

.btn-glass-danger:hover {
  background: rgba(239,68,68,.2);
  color: #fff;
  transform: translateY(-1px);
}

/* =====================================================
   TABLE
===================================================== */

.table {
  color: var(--text-main);
  margin-bottom: 0;
}

.table th {
  color: var(--text-secondary);
  border-color: rgba(255,255,255,.08);
}

.table td {
  border-color: rgba(255,255,255,.08);
}

/* =====================================================
   BADGES
===================================================== */

.badge-success { background: rgba(34,197,94,.15); color: var(--success); }
.badge-warning { background: rgba(245,158,11,.15); color: var(--warning); }
.badge-danger { background: rgba(239,68,68,.15); color: var(--danger); }

/* =====================================================
   TOAST SYSTEM
===================================================== */

.toast-host {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast-item {
  min-width: 260px;
  max-width: 340px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  backdrop-filter: blur(var(--blur));
  border: 1px solid rgba(255,255,255,.12);
  color: var(--text-main);
  display: flex;
  justify-content: space-between;
}

.toast-success { background: rgba(34,197,94,.15); }
.toast-error   { background: rgba(239,68,68,.15); }
.toast-info    { background: rgba(56,189,248,.15); }
.toast-warning { background: rgba(245,158,11,.15); }

/* =====================================================
   LOADER
===================================================== */

.loader {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(255,255,255,.15);
  border-top: 4px solid var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* =====================================================
   AVATAR
===================================================== */

.avatar-circle {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  font-size: 14px;
  text-transform: uppercase;
}

/* =====================================================
   SELECT DROPDOWN FIX (FINAL OVERRIDE)
===================================================== */

.form-select {
  border-radius: 14px !important;
  overflow: hidden !important;

  background-color: rgba(15, 23, 42, 0.85) !important;
  color: var(--text-main) !important;

  border: 1px solid rgba(255,255,255,.12) !important;

  padding: 10px 14px;

  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;

  display: block;
}
/* focus */
.form-select:focus {
  border-radius: 14px !important;
  outline: none;
  box-shadow: 0 0 0 .25rem rgba(56,189,248,.15) !important;
  border-color: rgba(56,189,248,.5) !important;
}

/* dropdown options */
.form-select option {
  background: #0f172a !important;
  color: #fff !important;
}
</style>
